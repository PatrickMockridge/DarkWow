# DarkWow Devnet — Docker Compose
#
# Two deployment modes:
#
#   Bridge mode (default, for single-machine dev/testing):
#     docker compose up
#     docker compose --profile test up  # includes test scripts
#
#   Host mode (multi-machine LAN deployment):
#     docker compose --profile host up
#
# Bridge mode provides a 3-node local network (lilith seed + 2 mining
# fullnodes). Host mode runs seed + miner on separate machines with
# host networking for LAN discovery.

version: '3.8'

services:
  # ==========================================================================
  # Bridge profile: 3-node local devnet (single-machine)
  # ==========================================================================
  lilith:
    image: dwow-devnet:latest
    # To build from local source:
    # build:
    #   context: ../../..
    #   dockerfile: contrib/docker/dwow-devnet/Dockerfile
    container_name: dwow-devnet-lilith
    hostname: lilith
    environment:
      - ROLE=lilith
      - NETWORK_NAME=dwow-devnet
      - P2P_PORT=31340
      - LILITH_RPC_PORT=18927
    ports:
      - "31340:31340"
    volumes:
      - lilith_data:/root/.local/share/dwow/lilith
    networks:
      - dwow-devnet-bridge
    restart: unless-stopped
    profiles:
      - ""  # default profile (no --profile flag needed)

  node0:
    image: dwow-devnet:latest
    # build:
    #   context: ../../..
    #   dockerfile: contrib/docker/dwow-devnet/Dockerfile
    container_name: dwow-devnet-node0
    hostname: node0
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    environment:
      - ROLE=dwowd
      - NETWORK_NAME=dwow-devnet
      - SEED_ADDR=lilith:31340
      - EXTERNAL_ADDR=node0:31342
      - P2P_PORT=31342
      - RPC_PORT=31345
      - STRATUM_PORT=31347
      - MANAGEMENT_PORT=31346
      - FIXED_DIFFICULTY=1
      - TARGET_BLOCK_TIME=120
      - MINING_ENABLED=true
      - MINING_THREADS=2
      - THRESHOLD=1
      - SKIP_SYNC=true
      - SKIP_FEES=true
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - WALLET_SECRET_FILE=/run/secrets/mining_secret
    ports:
      - "31345:31345"
      - "31347:31347"
    volumes:
      - node0_data:/root/.local/share/dwow/dwowd
      - /tmp/dwow_mining_secret:/run/secrets/mining_secret:ro
    networks:
      - dwow-devnet-bridge
    depends_on:
      - lilith
    healthcheck:
      test: ["CMD", "/app/dwowd", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    profiles:
      - ""

  node1:
    image: dwow-devnet:latest
    # build:
    #   context: ../../..
    #   dockerfile: contrib/docker/dwow-devnet/Dockerfile
    container_name: dwow-devnet-node1
    hostname: node1
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    environment:
      - ROLE=dwowd
      - NETWORK_NAME=dwow-devnet
      - SEED_ADDR=lilith:31340
      - EXTERNAL_ADDR=node1:31343
      - P2P_PORT=31343
      - RPC_PORT=31346
      - STRATUM_PORT=31348
      - MANAGEMENT_PORT=31349
      - FIXED_DIFFICULTY=1
      - TARGET_BLOCK_TIME=120
      - MINING_ENABLED=true
      - MINING_THREADS=2
      - THRESHOLD=1
      - SKIP_SYNC=true
      - SKIP_FEES=true
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - WALLET_SECRET_FILE=/run/secrets/mining_secret
    ports:
      - "31346:31346"
      - "31348:31348"
    volumes:
      - node1_data:/root/.local/share/dwow/dwowd
      - /tmp/dwow_mining_secret:/run/secrets/mining_secret:ro
    networks:
      - dwow-devnet-bridge
    depends_on:
      - lilith
      - node0
    healthcheck:
      test: ["CMD", "/app/dwowd", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    profiles:
      - ""

  # ==========================================================================
  # Host profile: multi-machine LAN deployment
  # ==========================================================================
  seed:
    image: dwow-devnet:latest
    container_name: dwow-devnet-seed
    network_mode: host
    environment:
      - ROLE=dwowd
      - IS_SEED=true
      - NETWORK_NAME=dwow-devnet
      - P2P_PORT=31342
      - RPC_PORT=31345
      - STRATUM_PORT=31347
      - MANAGEMENT_PORT=31346
      - FIXED_DIFFICULTY=1
      - MINING_ENABLED=true
      - MINING_THREADS=2
      - TARGET_BLOCK_TIME=120
      - THRESHOLD=1
      - SKIP_SYNC=true
      - SKIP_FEES=true
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - WALLET_SECRET_FILE=${WALLET_SECRET_FILE:-}
    volumes:
      - seed_data:/root/.local/share/dwow/dwowd
    restart: unless-stopped
    profiles:
      - host

  miner:
    image: dwow-devnet:latest
    container_name: dwow-devnet-miner
    network_mode: host
    environment:
      - ROLE=dwowd
      - NETWORK_NAME=dwow-devnet
      - SEED_ADDR=127.0.0.1:31342
      - P2P_PORT=31343
      - RPC_PORT=31346
      - STRATUM_PORT=31348
      - MANAGEMENT_PORT=31349
      - FIXED_DIFFICULTY=1
      - MINING_ENABLED=true
      - MINING_THREADS=4
      - TARGET_BLOCK_TIME=120
      - THRESHOLD=1
      - SKIP_SYNC=true
      - SKIP_FEES=true
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - WALLET_SECRET_FILE=${WALLET_SECRET_FILE:-}
    volumes:
      - miner_data:/root/.local/share/dwow/dwowd
    depends_on:
      - seed
    restart: unless-stopped
    profiles:
      - host

networks:
  dwow-devnet-bridge:
    driver: bridge

volumes:
  lilith_data:
  node0_data:
  node1_data:
  seed_data:
  miner_data:
