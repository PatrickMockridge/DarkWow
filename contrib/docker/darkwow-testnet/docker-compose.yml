# DarkWow Testnet — 3-node local devnet
#
# Architecture:
#   lilith — P2P seed/bootstrap node (no upstream seeds)
#   node0  — mining fullnode (connects to lilith, peers with node1)
#   node1  — mining fullnode (connects to lilith, peers with node0)
#
# Quick start:
#   docker compose -f contrib/docker/darkwow-testnet/docker-compose.yml up
#
# Multi-machine: switch to host networking and set SEED_ADDR to the seed's LAN IP.
# See README.md for full deployment guide.

services:
  lilith:
    profiles: ["native", "merge", "bridge"]
    image: ${DOCKER_REGISTRY:-docker.io/darkrenaissance}/darkwow-testnet:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-lilith
    hostname: lilith
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    environment:
      - ROLE=lilith
      - NETWORK=darkwow-testnet
      - P2P_PORT=31340
      - MAGIC_BYTES=68,82,75,87
      - LOCALNET=false
    ports:
      - "31340:31340"
    volumes:
      - lilith_data:/root/.local/share/dwow/lilith
    networks:
      - dwow-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/lilith", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  node0:
    profiles: ["native", "merge", "bridge"]
    image: ${DOCKER_REGISTRY:-docker.io/darkrenaissance}/darkwow-testnet:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-node0
    hostname: node0
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    environment:
      - ROLE=dwowd
      - NETWORK=darkwow-testnet
      - P2P_PORT=31342
      - RPC_PORT=31345
      - STRATUM_PORT=31347
      - SEED_ADDR=lilith:31340
      - PEER_ADDR=node1:31343
      - MAGIC_BYTES=68,82,75,87
      - MINING_THREADS=1
      - RANDOMX_MAX_THREADS=0
      - THRESHOLD=3
      - TARGET_BLOCK_TIME=120
      - SKIP_SYNC=false
      - SKIP_FEES=false
      - LOCALNET=false
      - EXTERNAL_ADDR=node0:31342
      - MERGE_MINING=${MERGE_MINING:-false}
      - MM_RPC_PORT=31348
      - FINALITY_MODE=${FINALITY_MODE:-always}
      - FINALITY_DISABLE_CARIBINA=${FINALITY_DISABLE_CARIBINA:-false}
      - FINALITY_ENABLE_MONERO=${FINALITY_ENABLE_MONERO:-false}
      - MONERO_MIN_CONFIRMATIONS=${MONERO_MIN_CONFIRMATIONS:-3}
      - MONEROD_RPC_URL=${MONEROD_RPC_URL:-}
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - WALLET_SECRET_FILE=/run/secrets/mining_secret
    ports:
      - "31345:31345"
      - "31347:31347"
      - "31342:31342"
      - "31348:31348"
    volumes:
      - node0_data:/root/.local/share/dwow/dwowd
      - /tmp/dwow_mining_secret:/run/secrets/mining_secret:ro
    networks:
      - dwow-local
    depends_on:
      - lilith
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/dwowd", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  node1:
    profiles: ["native", "merge", "bridge"]
    image: ${DOCKER_REGISTRY:-docker.io/darkrenaissance}/darkwow-testnet:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-node1
    hostname: node1
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    environment:
      - ROLE=dwowd
      - NETWORK=darkwow-testnet
      - P2P_PORT=31343
      - RPC_PORT=31346
      - STRATUM_PORT=31349
      - SEED_ADDR=lilith:31340
      - PEER_ADDR=node0:31342
      - MAGIC_BYTES=68,82,75,87
      - MINING_THREADS=1
      - RANDOMX_MAX_THREADS=0
      - THRESHOLD=3
      - TARGET_BLOCK_TIME=120
      - SKIP_SYNC=false
      - SKIP_FEES=false
      - LOCALNET=false
      - EXTERNAL_ADDR=node1:31343
      - FINALITY_MODE=${FINALITY_MODE:-always}
      - FINALITY_DISABLE_CARIBINA=${FINALITY_DISABLE_CARIBINA:-false}
      - FINALITY_ENABLE_MONERO=${FINALITY_ENABLE_MONERO:-false}
      - MONERO_MIN_CONFIRMATIONS=${MONERO_MIN_CONFIRMATIONS:-3}
      - MONEROD_RPC_URL=${MONEROD_RPC_URL:-}
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - WALLET_SECRET_FILE=/run/secrets/mining_secret
    ports:
      - "31346:31346"
      - "31349:31349"
      - "31343:31343"
    volumes:
      - node1_data:/root/.local/share/dwow/dwowd
      - /tmp/dwow_mining_secret:/run/secrets/mining_secret:ro
    networks:
      - dwow-local
    depends_on:
      - lilith
      - node0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/dwowd", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # Bridge Node Service (--profile bridge)
  #
  # Runs universal_relayer in relayer-only mode connected to node0 RPC.
  # All external chain handlers are disabled — this is a test harness for
  # verifying the bridge contract lifecycle end-to-end.
  #
  # Start with:  docker compose --profile bridge up -d
  # Requires:    lilith + node0 + node1 (native profile) already running
  # ============================================================================
  bridge-node:
    profiles: ["bridge"]
    image: ${DOCKER_REGISTRY:-docker.io/darkrenaissance}/darkwow-bridge-node:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/bridge-node/Dockerfile
    container_name: dwow-bridge-node
    hostname: bridge-node
    entrypoint: ["/app/entrypoint.sh"]
    environment:
      - MODE=relayer-only
      - NETWORK=darkwow-testnet
      - DARKFID_URL=tcp://node0:31345
      - POLL_INTERVAL_SECS=10
      - MAGIC_BYTES=68,82,75,87
      - ETH_ENABLED=false
      - XMR_ENABLED=false
      - ZEC_ENABLED=false
      - AZT_ENABLED=false
      - LTC_ENABLED=false
    networks:
      - dwow-local
    depends_on:
      lilith:
        condition: service_started
      node0:
        condition: service_started
    restart: unless-stopped

  # ============================================================================
  # Merge Mining Services (--profile merge)
  #
  # Start with:  docker compose --profile merge up -d
  # Without the profile flag, these services are skipped and native mining
  # (xmrig → dwowd stratum) is used.
  # ============================================================================
  monerod:
    profiles: ["merge"]
    image: ${DOCKER_REGISTRY:-docker.io/darkrenaissance}/darkwow-monerod:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.monero
    container_name: dwow-monerod
    hostname: monerod
    environment:
      - OFFLINE=${MONERO_OFFLINE:-true}
      - FIXED_DIFFICULTY=${MONERO_FIXED_DIFFICULTY:-1000}
      - MONERO_MINING_THREADS=${MONERO_MINING_THREADS:-1}
      - ZMQ_PORT=28083
      - RPC_PORT=28081
    expose:
      - "28081"
      - "28083"
    volumes:
      - monerod_data:/root/.bitmonero
    networks:
      - dwow-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-s", "-X", "POST", "http://127.0.0.1:28081/json_rpc",
             "-H", "Content-Type: application/json",
             "-d", '{"jsonrpc":"2.0","id":"0","method":"get_info"}']
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 10s

  p2pool:
    profiles: ["merge"]
    image: ${DOCKER_REGISTRY:-docker.io/darkrenaissance}/darkwow-p2pool:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.p2pool
    container_name: dwow-p2pool
    hostname: p2pool
    entrypoint: ["/app/entrypoint-p2pool.sh"]
    environment:
      - MONERO_HOST=monerod
      - MONERO_RPC_PORT=28081
      - MONERO_ZMQ_PORT=28083
      - DWOWD_MM_RPC=node0:31348
      - STRATUM_PORT=3333
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
    ports:
      - "3333:3333"
    volumes:
      - p2pool_data:/root/.p2pool
    networks:
      - dwow-local
    depends_on:
      - monerod
    restart: unless-stopped

  # ============================================================================
  # Public Testnet Join Services (--profile join-merge)
  #
  # Single-node merge mining stack for joining the public DarkWow testnet.
  # No lilith seed, no second mining node — this is a self-contained external
  # participant stack. All services use host networking so dwowd's P2P layer
  # sees the host's real IP address for peer discovery.
  #
  # Start with:  docker compose --profile join-merge up -d
  # Config via:  contrib/docker/darkwow-testnet/join-testnet.sh --mode merge
  # ============================================================================
  dwowd-join:
    profiles: ["join-merge"]
    image: ${DOCKER_REGISTRY:-docker.io/darkrenaissance}/darkwow-testnet:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-node0-join
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    network_mode: host
    environment:
      - ROLE=dwowd
      - NETWORK=${NETWORK:-darkwow-testnet}
      - P2P_PORT=${P2P_PORT:-31342}
      - RPC_PORT=${RPC_PORT:-31345}
      - STRATUM_PORT=${STRATUM_PORT:-31347}
      - SEED_ADDR=${SEED_ADDR:-lilith0.dark.fi:31340,lilith1.dark.fi:31340}
      - MAGIC_BYTES=${MAGIC_BYTES:-68,82,75,87}
      - MINING_THREADS=0
      - RANDOMX_MAX_THREADS=0
      - THRESHOLD=${THRESHOLD:-3}
      - TARGET_BLOCK_TIME=${TARGET_BLOCK_TIME:-120}
      - SKIP_SYNC=false
      - SKIP_FEES=false
      - LOCALNET=false
      - EXTERNAL_ADDR=${EXTERNAL_ADDR:-}
      - MERGE_MINING=true
      - MM_RPC_PORT=${MM_RPC_PORT:-31348}
      - FINALITY_MODE=${FINALITY_MODE:-always}
      - FINALITY_DISABLE_CARIBINA=${FINALITY_DISABLE_CARIBINA:-false}
      - FINALITY_ENABLE_MONERO=${FINALITY_ENABLE_MONERO:-false}
      - MONERO_MIN_CONFIRMATIONS=${MONERO_MIN_CONFIRMATIONS:-3}
      - MONEROD_RPC_URL=${MONEROD_RPC_URL:-}
      - MINING_ENABLED=false
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - WALLET_SECRET_FILE=/run/secrets/mining_secret
    volumes:
      - ${DATA_DIR:-./data/dwowd}:/root/.local/share/dwow/dwowd
    restart: unless-stopped

  monerod-join:
    profiles: ["join-merge"]
    image: ${DOCKER_REGISTRY:-docker.io/darkrenaissance}/darkwow-monerod:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.monero
    container_name: dwow-monerod
    network_mode: host
    environment:
      - OFFLINE=${MONERO_OFFLINE:-false}
      - MONERO_NETWORK=${MONERO_NETWORK:-testnet}
      - FIXED_DIFFICULTY=${MONERO_FIXED_DIFFICULTY:-1000}
      - ZMQ_PORT=28083
      - RPC_PORT=28081
      - MONERO_ADD_PEERS=${MONERO_ADD_PEERS:-125.229.105.12:28081,37.187.74.171:28089}
    volumes:
      - ${MONERO_DATA_DIR:-./data/monerod}:/root/.bitmonero
    restart: unless-stopped

  p2pool-join:
    profiles: ["join-merge"]
    image: ${DOCKER_REGISTRY:-docker.io/darkrenaissance}/darkwow-p2pool:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.p2pool
    container_name: dwow-p2pool
    network_mode: host
    entrypoint: ["/app/entrypoint-p2pool.sh"]
    environment:
      - MONERO_HOST=127.0.0.1
      - MONERO_RPC_PORT=28081
      - MONERO_ZMQ_PORT=28083
      - MONERO_NETWORK=${MONERO_NETWORK:-testnet}
      - DWOWD_MM_RPC=127.0.0.1:${MM_RPC_PORT:-31348}
      - STRATUM_PORT=3333
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - MONERO_WALLET_ADDRESS=${MONERO_WALLET_ADDRESS:-}
    volumes:
      - ${P2POOL_DATA_DIR:-./data/p2pool}:/root/.p2pool
    depends_on:
      - monerod-join
      - dwowd-join
    restart: unless-stopped

networks:
  dwow-local:
    driver: bridge

volumes:
  lilith_data:
  node0_data:
  node1_data:
  bridge_node_data:
  monerod_data:
  p2pool_data:
