# DarkWow Testnet — 3-node local devnet
#
# Architecture:
#   lilith — P2P seed/bootstrap node (no upstream seeds)
#   node0  — mining fullnode (connects to lilith, peers with node1)
#   node1  — mining fullnode (connects to lilith, peers with node0)
#
# Quick start:
#   docker compose -f contrib/docker/darkwow-testnet/docker-compose.yml up
#
# Multi-machine: switch to host networking and set SEED_ADDR to the seed's LAN IP.
# See README.md for full deployment guide.

services:
  lilith:
    profiles: ["native", "merge", "native-p2pool"]
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-lilith
    hostname: lilith
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    environment:
      - ROLE=lilith
      - NETWORK=darkwow-testnet
      - P2P_PORT=31340
      - MAGIC_BYTES=68,82,75,87
      - LOCALNET=false
    ports:
      - "31340:31340"
    volumes:
      - lilith_data:/root/.local/share/dwow/lilith
    networks:
      - dwow-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/lilith", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  node0:
    profiles: ["native", "merge", "native-p2pool"]
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-node0
    hostname: node0
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    environment:
      - ROLE=dwowd
      - NETWORK=darkwow-testnet
      - P2P_PORT=31342
      - RPC_PORT=31345
      - STRATUM_PORT=31347
      - SEED_ADDR=lilith:31340
      - PEER_ADDR=node1:31343
      - MAGIC_BYTES=68,82,75,87
      - MINING_THREADS=1
      - RANDOMX_MAX_THREADS=0
      - THRESHOLD=3
      - TARGET_BLOCK_TIME=120
      - SKIP_SYNC=false
      - SKIP_FEES=false
      - LOCALNET=false
      - EXTERNAL_ADDR=node0:31342
      - MERGE_MINING=${MERGE_MINING:-false}
      - MM_RPC_PORT=31348
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - WALLET_SECRET_FILE=/run/secrets/mining_secret
    ports:
      - "31345:31345"
      - "31347:31347"
      - "31342:31342"
      - "31348:31348"
    volumes:
      - node0_data:/root/.local/share/dwow/dwowd
      - /tmp/dwow_mining_secret:/run/secrets/mining_secret:ro
    networks:
      - dwow-local
    depends_on:
      - lilith
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/dwowd", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  node1:
    profiles: ["native", "merge", "native-p2pool"]
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-node1
    hostname: node1
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    environment:
      - ROLE=dwowd
      - NETWORK=darkwow-testnet
      - P2P_PORT=31343
      - RPC_PORT=31346
      - STRATUM_PORT=31349
      - SEED_ADDR=lilith:31340
      - PEER_ADDR=node0:31342
      - MAGIC_BYTES=68,82,75,87
      - MINING_THREADS=1
      - RANDOMX_MAX_THREADS=0
      - THRESHOLD=3
      - TARGET_BLOCK_TIME=120
      - SKIP_SYNC=false
      - SKIP_FEES=false
      - LOCALNET=false
      - EXTERNAL_ADDR=node1:31343
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - WALLET_SECRET_FILE=/run/secrets/mining_secret
    ports:
      - "31346:31346"
      - "31349:31349"
      - "31343:31343"
    volumes:
      - node1_data:/root/.local/share/dwow/dwowd
      - /tmp/dwow_mining_secret:/run/secrets/mining_secret:ro
    networks:
      - dwow-local
    depends_on:
      - lilith
      - node0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/dwowd", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # Merge Mining Services (--profile merge)
  #
  # Start with:  docker compose --profile merge up -d
  # Without the profile flag, these services are skipped and native mining
  # (xmrig → dwowd stratum) is used.
  # ============================================================================
  monerod:
    profiles: ["merge"]
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.monero
    container_name: dwow-monerod
    hostname: monerod
    environment:
      - OFFLINE=${MONERO_OFFLINE:-true}
      - FIXED_DIFFICULTY=${MONERO_FIXED_DIFFICULTY:-20000}
      - ZMQ_PORT=28083
      - RPC_PORT=28081
    ports:
      - "28081:28081"
    volumes:
      - monerod_data:/root/.bitmonero
    networks:
      - dwow-local
    restart: unless-stopped

  p2pool:
    profiles: ["merge"]
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.p2pool
    container_name: dwow-p2pool
    hostname: p2pool
    entrypoint: ["/app/entrypoint-p2pool.sh"]
    environment:
      - MONERO_HOST=monerod
      - MONERO_RPC_PORT=28081
      - MONERO_ZMQ_PORT=28083
      - DWOWD_MM_RPC=node0:31348
      - STRATUM_PORT=3333
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - MONERO_WALLET_ADDRESS=${MONERO_WALLET_ADDRESS:-}
    ports:
      - "3333:3333"
    volumes:
      - p2pool_data:/root/.p2pool
    networks:
      - dwow-local
    depends_on:
      - monerod
      - node0
    restart: unless-stopped

  xmrig-merge:
    profiles: ["merge"]
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.xmrig
    container_name: dwow-xmrig-merge
    entrypoint: ["/usr/local/bin/xmrig"]
    command:
      - "-o"
      - "p2pool:3333"
      - "-a"
      - "rx/0"
      - "-t"
      - "${XMERGE_THREADS:-1}"
      - "--keepalive"
    networks:
      - dwow-local
    depends_on:
      - p2pool
    restart: unless-stopped

  # ============================================================================
  # Merge Mining Adaptor Services (--profile native-p2pool)
  #
  # The adaptor bridges p2pool to dwowd stratum, enabling merge mining with
  # Monero and the anchoring/finality gadget. DarkWow as a minority-mined
  # RandomX L1 borrows security from Monero's hashpower through this pathway.
  #
  # DarkWow-native pooled mining (DRKW reward distribution without Monero) is
  # an ecosystem concern — not bundled or maintained here. The node software
  # and this adaptor are the only mining infrastructure provided by this repo.
  #
  # Start with:  docker compose --profile native-p2pool up -d
  # ============================================================================
  adaptor:
    profiles: ["native-p2pool"]
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-adaptor
    hostname: adaptor
    entrypoint: ["/app/entrypoint-adaptor.sh"]
    environment:
      - DWOWD_RPC=node0:31345
      - DWOWD_STRATUM=node0:31347
      - ADAPTOR_LISTEN=0.0.0.0:28081
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - CONNECT_RETRIES=30
    ports:
      - "28081:28081"
    networks:
      - dwow-local
    depends_on:
      - node0
    restart: unless-stopped

  p2pool-darkwow:
    profiles: ["native-p2pool"]
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.p2pool
    container_name: dwow-p2pool-darkwow
    hostname: p2pool-darkwow
    entrypoint: ["/app/entrypoint-p2pool-darkwow.sh"]
    environment:
      - MONERO_HOST=adaptor
      - MONERO_RPC_PORT=28081
      - STRATUM_PORT=3333
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
    ports:
      - "3334:3333"
    volumes:
      - p2pool_darkwow_data:/root/.p2pool
    networks:
      - dwow-local
    depends_on:
      - adaptor
    restart: unless-stopped

  xmrig-p2pool:
    profiles: ["native-p2pool"]
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.xmrig
    container_name: dwow-xmrig-p2pool
    entrypoint: ["/usr/local/bin/xmrig"]
    command:
      - "-o"
      - "p2pool-darkwow:3333"
      - "-a"
      - "rx/0"
      - "-t"
      - "${XMERGE_THREADS:-1}"
      - "--keepalive"
    networks:
      - dwow-local
    depends_on:
      - p2pool-darkwow
    restart: unless-stopped

  # ============================================================================
  # Public Testnet Join Services (--profile join-merge)
  #
  # Single-node merge mining stack for joining the public DarkWow testnet.
  # No lilith seed, no second mining node — this is a self-contained external
  # participant stack. All services use host networking so dwowd's P2P layer
  # sees the host's real IP address for peer discovery.
  #
  # Start with:  docker compose --profile join-merge up -d
  # Config via:  contrib/docker/darkwow-testnet/join-testnet.sh --mode merge
  # ============================================================================
  dwowd-join:
    profiles: ["join-merge"]
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-node0-join
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    network_mode: host
    environment:
      - ROLE=dwowd
      - NETWORK=${NETWORK:-darkwow-testnet}
      - P2P_PORT=${P2P_PORT:-31342}
      - RPC_PORT=${RPC_PORT:-31345}
      - STRATUM_PORT=${STRATUM_PORT:-31347}
      - SEED_ADDR=${SEED_ADDR:-lilith0.dark.fi:31340,lilith1.dark.fi:31340}
      - MAGIC_BYTES=${MAGIC_BYTES:-68,82,75,87}
      - MINING_THREADS=0
      - RANDOMX_MAX_THREADS=0
      - THRESHOLD=${THRESHOLD:-3}
      - TARGET_BLOCK_TIME=${TARGET_BLOCK_TIME:-120}
      - SKIP_SYNC=false
      - SKIP_FEES=false
      - LOCALNET=false
      - EXTERNAL_ADDR=${EXTERNAL_ADDR:-}
      - MERGE_MINING=true
      - MM_RPC_PORT=${MM_RPC_PORT:-31348}
      - MINING_ENABLED=false
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - WALLET_SECRET_FILE=/run/secrets/mining_secret
    volumes:
      - ${DATA_DIR:-./data/dwowd}:/root/.local/share/dwow/dwowd
    restart: unless-stopped

  monerod-join:
    profiles: ["join-merge"]
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.monero
    container_name: dwow-monerod
    network_mode: host
    environment:
      - OFFLINE=${MONERO_OFFLINE:-false}
      - MONERO_NETWORK=${MONERO_NETWORK:-testnet}
      - FIXED_DIFFICULTY=${MONERO_FIXED_DIFFICULTY:-20000}
      - ZMQ_PORT=28083
      - RPC_PORT=28081
      - MONERO_ADD_PEERS=${MONERO_ADD_PEERS:-125.229.105.12:28081,37.187.74.171:28089}
    volumes:
      - ${MONERO_DATA_DIR:-./data/monerod}:/root/.bitmonero
    restart: unless-stopped

  p2pool-join:
    profiles: ["join-merge"]
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.p2pool
    container_name: dwow-p2pool
    network_mode: host
    entrypoint: ["/app/entrypoint-p2pool.sh"]
    environment:
      - MONERO_HOST=127.0.0.1
      - MONERO_RPC_PORT=28081
      - MONERO_ZMQ_PORT=28083
      - MONERO_NETWORK=${MONERO_NETWORK:-testnet}
      - DWOWD_MM_RPC=127.0.0.1:${MM_RPC_PORT:-31348}
      - STRATUM_PORT=3333
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - MONERO_WALLET_ADDRESS=${MONERO_WALLET_ADDRESS:-}
    volumes:
      - ${P2POOL_DATA_DIR:-./data/p2pool}:/root/.p2pool
    depends_on:
      - monerod-join
      - dwowd-join
    restart: unless-stopped

  xmrig-join:
    profiles: ["join-merge"]
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.xmrig
    container_name: dwow-xmrig-merge
    network_mode: host
    entrypoint: ["/usr/local/bin/xmrig"]
    command:
      - "-o"
      - "127.0.0.1:3333"
      - "-a"
      - "rx/0"
      - "-t"
      - "${MINING_THREADS:-4}"
      - "--keepalive"
    depends_on:
      - p2pool-join
    restart: unless-stopped

networks:
  dwow-local:
    driver: bridge

volumes:
  lilith_data:
  node0_data:
  node1_data:
  monerod_data:
  p2pool_data:
  p2pool_darkwow_data:
