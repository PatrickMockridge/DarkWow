# DarkWow Testnet — 3-node local devnet
#
# Architecture:
#   observer — full node (no mining), shares hostlist, accepts inbound from wallets
#   node0    — mining fullnode (peers with observer + node1)
#   node1    — mining fullnode (peers with observer + node0)
#   wallets  — connect to observer + nodes via peers config
#
# Quick start:
#   docker compose -f contrib/docker/darkwow-testnet/docker-compose.yml up
#
# See README.md for full deployment guide.

services:
  observer:
    profiles: ["native", "merge", "bridge"]
    image: darkwow-testnet:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-observer
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4g

    hostname: observer
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    environment:
      - ROLE=dwowd
      - NETWORK=darkwow-testnet
      - P2P_PORT=31340
      - RPC_PORT=31345
      - STRATUM_PORT=31347
      - SEED_ADDR=
      - PEER_ADDR=node0:31342,node1:31343
      - MAGIC_BYTES=68,82,75,87
      - MINING_ENABLED=false
      - CREATE_GENESIS=false
      - IS_SEED=true
      - LOCALNET=true
      - P2P_LOCAL=true
      - MINING_EASY=true
      - SKIP_SYNC=false
      - SKIP_FEES=false
      - THRESHOLD=3
      - TARGET_BLOCK_TIME=120
      - RANDOMX_MAX_THREADS=1
      - DWOW_RAYON_THREADS=2
      - EXTERNAL_ADDR=observer:31340
    ports:
      - "127.0.0.1:31340:31340"
    volumes:
      - observer_data:/root/.local/share/dwow/dwowd
    networks:
      - dwow-local
    restart: unless-stopped

  node0:
    profiles: ["native", "merge", "bridge"]
    image: darkwow-testnet:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-node0
    # 6GB: node0 runs genesis contract initialization (9 contracts × ZK keygen)
    # plus RandomX VM. halo2 keygen for k>=15 circuits can use 1-2GB.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 6g

    hostname: node0
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    environment:
      - ROLE=dwowd
      - NETWORK=darkwow-testnet
      - RUST_MIN_STACK=67108864
      - RUST_BACKTRACE=full
      - CREATE_GENESIS=true
      - P2P_PORT=31342
      - RPC_PORT=31345
      - STRATUM_PORT=31347
      - SEED_ADDR=
      - PEER_ADDR=observer:31340,node1:31343
      - MAGIC_BYTES=68,82,75,87
      - MINING_THREADS=${MINING_THREADS:-1}
      - DWOW_RAYON_THREADS=${DWOW_RAYON_THREADS:-2}
      - MINING_ENABLED=true
      - NODE_NAME=node0
      - RANDOMX_MAX_THREADS=1
      - THRESHOLD=3
      - TARGET_BLOCK_TIME=120
      - SKIP_SYNC=false
      - SKIP_FEES=false
      - LOCALNET=true
      - P2P_LOCAL=true
      - MINING_EASY=true
      - EXTERNAL_ADDR=node0:31342
      - MERGE_MINING=${MERGE_MINING:-false}
      - MM_RPC_PORT=31348
      - P2POOL_HOST=127.0.0.1
      - P2POOL_STRATUM_PORT=3333
      - FINALITY_MODE=${FINALITY_MODE:-always}
      - FINALITY_CARIBINA_ENABLED=${FINALITY_CARIBINA_ENABLED:-true}
      - FINALITY_ENABLE_MONERO=${FINALITY_ENABLE_MONERO:-false}
      - MONERO_MIN_CONFIRMATIONS=${MONERO_MIN_CONFIRMATIONS:-3}
      - MONEROD_RPC_URL=${MONEROD_RPC_URL:-}
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - FORWARD_DESTINATION=${FORWARD_DESTINATION:-}
      - MONERO_WALLET_ADDRESS=${MONERO_WALLET_ADDRESS:-}
    volumes:
      - node0_data:/root/.local/share/dwow/dwowd
      - ./keys.toml:/run/config/keys.toml:ro
    ports:
      - "127.0.0.1:31345:31345"
    networks:
      - dwow-local
    depends_on:
      - observer
    restart: unless-stopped

  node1:
    profiles: ["native", "merge", "bridge"]
    image: darkwow-testnet:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-node1
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4g

    hostname: node1
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    environment:
      - ROLE=dwowd
      - NETWORK=darkwow-testnet
      - RUST_MIN_STACK=67108864
      - RUST_BACKTRACE=full
      - CREATE_GENESIS=false
      - P2P_PORT=31343
      - RPC_PORT=31346
      - STRATUM_PORT=31349
      - SEED_ADDR=
      - PEER_ADDR=observer:31340,node0:31342
      - MAGIC_BYTES=68,82,75,87
      - MINING_THREADS=${MINING_THREADS:-1}
      - DWOW_RAYON_THREADS=${DWOW_RAYON_THREADS:-2}
      - MINING_ENABLED=true
      - MERGE_MINING=${MERGE_MINING:-false}
      - MM_RPC_PORT=31349
      - P2POOL_HOST=127.0.0.1
      - P2POOL_STRATUM_PORT=3333
      - RANDOMX_MAX_THREADS=1
      - THRESHOLD=3
      - TARGET_BLOCK_TIME=120
      - SKIP_SYNC=false
      - SKIP_FEES=false
      - LOCALNET=true
      - P2P_LOCAL=true
      - MINING_EASY=true
      - NODE_NAME=node1
      - EXTERNAL_ADDR=node1:31343
      - FINALITY_MODE=${FINALITY_MODE:-always}
      - FINALITY_CARIBINA_ENABLED=${FINALITY_CARIBINA_ENABLED:-true}
      - FINALITY_ENABLE_MONERO=${FINALITY_ENABLE_MONERO:-false}
      - MONERO_MIN_CONFIRMATIONS=${MONERO_MIN_CONFIRMATIONS:-3}
      - MONEROD_RPC_URL=${MONEROD_RPC_URL:-}
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - FORWARD_DESTINATION=${FORWARD_DESTINATION:-}
      - MONERO_WALLET_ADDRESS=${MONERO_WALLET_ADDRESS:-}
    volumes:
      - node1_data:/root/.local/share/dwow/dwowd
      - ./keys.toml:/run/config/keys.toml:ro
    networks:
      - dwow-local
    depends_on:
      - observer
      - node0
    restart: unless-stopped

  node2:
    profiles: ["native", "merge", "bridge"]
    image: darkwow-testnet:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-node2
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4g

    hostname: node2
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    environment:
      - ROLE=dwowd
      - NETWORK=darkwow-testnet
      - RUST_MIN_STACK=67108864
      - RUST_BACKTRACE=full
      - CREATE_GENESIS=false
      - P2P_PORT=31344
      - RPC_PORT=31350
      - STRATUM_PORT=31351
      - SEED_ADDR=
      - PEER_ADDR=observer:31340,node0:31342,node1:31343
      - MAGIC_BYTES=68,82,75,87
      - MINING_THREADS=${MINING_THREADS:-1}
      - DWOW_RAYON_THREADS=${DWOW_RAYON_THREADS:-2}
      - MINING_ENABLED=true
      - RANDOMX_MAX_THREADS=1
      - THRESHOLD=3
      - TARGET_BLOCK_TIME=120
      - SKIP_SYNC=false
      - SKIP_FEES=false
      - LOCALNET=true
      - P2P_LOCAL=true
      - MINING_EASY=true
      - EXTERNAL_ADDR=node2:31344
      - FINALITY_MODE=${FINALITY_MODE:-always}
      - FINALITY_CARIBINA_ENABLED=${FINALITY_CARIBINA_ENABLED:-true}
      - FINALITY_ENABLE_MONERO=${FINALITY_ENABLE_MONERO:-false}
      - MONERO_MIN_CONFIRMATIONS=${MONERO_MIN_CONFIRMATIONS:-3}
      - MONEROD_RPC_URL=${MONEROD_RPC_URL:-}
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - FORWARD_DESTINATION=${FORWARD_DESTINATION:-}
      - MONERO_WALLET_ADDRESS=${MONERO_WALLET_ADDRESS:-}
    volumes:
      - node2_data:/root/.local/share/dwow/dwowd
    networks:
      - dwow-local
    depends_on:
      - observer
      - node0
      - node1
    restart: unless-stopped

  node3:
    profiles: ["native"]
    image: darkwow-testnet:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-node3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4g

    hostname: node3
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    environment:
      - ROLE=dwowd
      - NETWORK=darkwow-testnet
      - RUST_MIN_STACK=67108864
      - RUST_BACKTRACE=full
      - CREATE_GENESIS=false
      - P2P_PORT=31352
      - RPC_PORT=31353
      - STRATUM_PORT=31354
      - SEED_ADDR=
      - PEER_ADDR=observer:31340,node0:31342,node1:31343,node2:31344
      - MAGIC_BYTES=68,82,75,87
      - MINING_THREADS=${MINING_THREADS:-1}
      - DWOW_RAYON_THREADS=${DWOW_RAYON_THREADS:-2}
      - MINING_ENABLED=true
      - RANDOMX_MAX_THREADS=1
      - THRESHOLD=3
      - TARGET_BLOCK_TIME=120
      - SKIP_SYNC=false
      - SKIP_FEES=false
      - LOCALNET=true
      - P2P_LOCAL=true
      - MINING_EASY=true
      - EXTERNAL_ADDR=node3:31352
      - FINALITY_MODE=${FINALITY_MODE:-always}
      - FINALITY_CARIBINA_ENABLED=${FINALITY_CARIBINA_ENABLED:-true}
      - FINALITY_ENABLE_MONERO=${FINALITY_ENABLE_MONERO:-false}
      - MONERO_MIN_CONFIRMATIONS=${MONERO_MIN_CONFIRMATIONS:-3}
      - MONEROD_RPC_URL=${MONEROD_RPC_URL:-}
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - FORWARD_DESTINATION=${FORWARD_DESTINATION:-}
      - MONERO_WALLET_ADDRESS=${MONERO_WALLET_ADDRESS:-}
    volumes:
      - node3_data:/root/.local/share/dwow/dwowd
    networks:
      - dwow-local
    depends_on:
      - observer
      - node0
      - node1
      - node2
    restart: unless-stopped

  node4:
    profiles: ["native"]
    image: darkwow-testnet:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-node4
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4g

    hostname: node4
    entrypoint: ["/app/entrypoint.sh"]
    command: []
    environment:
      - ROLE=dwowd
      - NETWORK=darkwow-testnet
      - RUST_MIN_STACK=67108864
      - RUST_BACKTRACE=full
      - CREATE_GENESIS=false
      - P2P_PORT=31355
      - RPC_PORT=31356
      - STRATUM_PORT=31357
      - SEED_ADDR=
      - PEER_ADDR=observer:31340,node0:31342,node1:31343,node2:31344,node3:31352
      - MAGIC_BYTES=68,82,75,87
      - MINING_THREADS=${MINING_THREADS:-1}
      - DWOW_RAYON_THREADS=${DWOW_RAYON_THREADS:-2}
      - MINING_ENABLED=true
      - RANDOMX_MAX_THREADS=1
      - THRESHOLD=3
      - TARGET_BLOCK_TIME=120
      - SKIP_SYNC=false
      - SKIP_FEES=false
      - LOCALNET=true
      - P2P_LOCAL=true
      - MINING_EASY=true
      - EXTERNAL_ADDR=node4:31355
      - FINALITY_MODE=${FINALITY_MODE:-always}
      - FINALITY_CARIBINA_ENABLED=${FINALITY_CARIBINA_ENABLED:-true}
      - FINALITY_ENABLE_MONERO=${FINALITY_ENABLE_MONERO:-false}
      - MONERO_MIN_CONFIRMATIONS=${MONERO_MIN_CONFIRMATIONS:-3}
      - MONEROD_RPC_URL=${MONEROD_RPC_URL:-}
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - FORWARD_DESTINATION=${FORWARD_DESTINATION:-}
      - MONERO_WALLET_ADDRESS=${MONERO_WALLET_ADDRESS:-}
    volumes:
      - node4_data:/root/.local/share/dwow/dwowd
    networks:
      - dwow-local
    depends_on:
      - observer
      - node0
      - node1
      - node2
      - node3
    restart: unless-stopped

  # ============================================================================
  # Bridge Node Service (--profile bridge)
  #
  # Runs universal_relayer in relayer-only mode connected to node0 RPC.
  # All external chain handlers are disabled — this is a test harness for
  # verifying the bridge contract lifecycle end-to-end.
  #
  # Start with:  docker compose --profile bridge up -d
  # Requires:    observer + node0 + node1 (native profile) already running
  # ============================================================================
  bridge-node:
    profiles: ["bridge"]
    image: darkwow-bridge-node:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/bridge-node/Dockerfile
    container_name: dwow-bridge-node
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4g

    hostname: bridge-node
    entrypoint: ["/app/entrypoint.sh"]
    environment:
      - MODE=relayer-only
      - NETWORK=darkwow-testnet
      - DARKFID_URL=tcp://node0:31345
      - POLL_INTERVAL_SECS=10
      - MAGIC_BYTES=68,82,75,87
      - ETH_ENABLED=false
      - XMR_ENABLED=false
      - ZEC_ENABLED=false
      - AZT_ENABLED=false
      - LTC_ENABLED=false
    networks:
      - dwow-local
    depends_on:
      observer:
        condition: service_started
      node0:
        condition: service_started
    restart: unless-stopped

  # ============================================================================
  # Wallet Service (--profile wallet)
  #
  # Isolated wallet container for capability position resolution, contract
  # interactions, and hygienic dev work. Secret key never leaves the container.
  #
  # Two modes via WALLET_MODE env var:
  #   interactive (default) — init wallet, sleep, docker exec for manual ops
  #   test — auto scan, position, assert output, exit with status
  #
  # Build with:  docker compose --profile wallet build
  # Run with:    docker run -d --name dwow-wallet-N --network dwow-local \
  #                -e WALLET_INDEX=N darkwow-wallet:latest
  # Note:        Use test_pipeline.sh --with-wallet N to manage wallets.
  #              The compose service is for image building only; containers
  #              are started via docker run for per-instance volumes/configs.
  # ============================================================================
  wallet:
    profiles: ["wallet"]
    image: darkwow-wallet:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.wallet
    entrypoint: ["/app/entrypoint.sh"]
    environment:
      - WALLET_MODE=${WALLET_MODE:-interactive}
      - NETWORK=darkwow-testnet
      - RPC_URL=tcp://node0:31345
      # P2P network settings — wallet participates as a full node
      - SEED_ADDR=${SEED_ADDR:-tcp+tls://observer:31340}
      - P2P_PORT=${P2P_PORT:-31360}
      - MAGIC_BYTES=${MAGIC_BYTES:-68,82,75,87}
      - WALLET_PASS=${WALLET_PASS:-walletpass}
    networks:
      - dwow-local
    restart: unless-stopped

  # ============================================================================
  # Merge Mining Services (--profile merge)
  #
  # Start with:  docker compose --profile merge up -d
  # Without the profile flag, these services are skipped and native mining
  # (xmrig → dwowd stratum) is used.
  # ============================================================================
  monerod:
    profiles: ["merge"]
    image: darkwow-monerod:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.monero
    container_name: dwow-monerod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4g

    hostname: monerod
    environment:
      - OFFLINE=${MONERO_OFFLINE:-true}
      - FIXED_DIFFICULTY=${MONERO_FIXED_DIFFICULTY:-1000}
      - MONERO_MINING_THREADS=${MONERO_MINING_THREADS:-1}
      - ZMQ_PORT=28083
      - RPC_PORT=28081
    expose:
      - "28081"
      - "28083"
    volumes:
      - monerod_data:/root/.bitmonero
    networks:
      - dwow-local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-s", "-X", "POST", "http://127.0.0.1:28081/json_rpc",
             "-H", "Content-Type: application/json",
             "-d", '{"jsonrpc":"2.0","id":"0","method":"get_info"}']
      interval: 5s
      timeout: 3s
      retries: 1
      start_period: 10s

  # ============================================================================
  # Public Testnet Join Services (--profile join-merge)
  #
  # Single-node merge mining stack for joining the public DarkWow testnet.
  # No observer dependency, no second mining node — this is a self-contained external
  # participant stack. All services use host networking so dwowd's P2P layer
  # sees the host's real IP address for peer discovery.
  #
  # Start with:  docker compose --profile join-merge up -d
  # Config via:  contrib/docker/darkwow-testnet/join-testnet.sh --mode merge
  # ============================================================================
  dwowd-join:
    profiles: ["join-merge"]
    image: darkwow-testnet:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile
    container_name: dwow-node0-join
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4g

    entrypoint: ["/app/entrypoint.sh"]
    command: []
    network_mode: host
    environment:
      - ROLE=dwowd
      - NETWORK=${NETWORK:-darkwow-testnet}
      - P2P_PORT=${P2P_PORT:-31342}
      - RPC_PORT=${RPC_PORT:-31345}
      - STRATUM_PORT=${STRATUM_PORT:-31347}
      - SEED_ADDR=${SEED_ADDR:-lilith0.dark.fi:31340,lilith1.dark.fi:31340}
      - MAGIC_BYTES=${MAGIC_BYTES:-68,82,75,87}
      - MINING_THREADS=0
      - RANDOMX_MAX_THREADS=1
      - THRESHOLD=${THRESHOLD:-3}
      - TARGET_BLOCK_TIME=${TARGET_BLOCK_TIME:-120}
      - SKIP_SYNC=false
      - SKIP_FEES=false
      - LOCALNET=true
      - P2P_LOCAL=true
      - MINING_EASY=true
      - EXTERNAL_ADDR=${EXTERNAL_ADDR:-}
      - MERGE_MINING=true
      - MM_RPC_PORT=${MM_RPC_PORT:-31348}
      - FINALITY_MODE=${FINALITY_MODE:-always}
      - FINALITY_CARIBINA_ENABLED=${FINALITY_CARIBINA_ENABLED:-true}
      - FINALITY_ENABLE_MONERO=${FINALITY_ENABLE_MONERO:-false}
      - MONERO_MIN_CONFIRMATIONS=${MONERO_MIN_CONFIRMATIONS:-3}
      - MONEROD_RPC_URL=${MONEROD_RPC_URL:-}
      - MINING_ENABLED=false
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - FORWARD_DESTINATION=${FORWARD_DESTINATION:-}
      - MONERO_WALLET_ADDRESS=${MONERO_WALLET_ADDRESS:-}
    volumes:
      - ${DATA_DIR:-./data/dwowd}:/root/.local/share/dwow/dwowd
    restart: unless-stopped

  monerod-join:
    profiles: ["join-merge"]
    image: darkwow-monerod:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.monero
    container_name: dwow-monerod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4g

    network_mode: host
    environment:
      - OFFLINE=${MONERO_OFFLINE:-false}
      - MONERO_NETWORK=${MONERO_NETWORK:-testnet}
      - FIXED_DIFFICULTY=${MONERO_FIXED_DIFFICULTY:-1000}
      - ZMQ_PORT=28083
      - RPC_PORT=28081
      - MONERO_ADD_PEERS=${MONERO_ADD_PEERS:-125.229.105.12:28081,37.187.74.171:28089}
    volumes:
      - ${MONERO_DATA_DIR:-./data/monerod}:/root/.bitmonero
    restart: unless-stopped

  p2pool-join:
    profiles: ["join-merge"]
    image: darkwow-p2pool:latest
    build:
      context: ../../..
      dockerfile: contrib/docker/darkwow-testnet/Dockerfile.p2pool
    container_name: dwow-p2pool
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4g

    network_mode: host
    entrypoint: ["/app/entrypoint-p2pool.sh"]
    environment:
      - MONERO_HOST=127.0.0.1
      - MONERO_RPC_PORT=28081
      - MONERO_ZMQ_PORT=28083
      - MONERO_NETWORK=${MONERO_NETWORK:-testnet}
      - DWOWD_MM_RPC=127.0.0.1:${MM_RPC_PORT:-31348}
      - STRATUM_PORT=3333
      - WALLET_ADDRESS=${WALLET_ADDRESS:-}
      - FORWARD_DESTINATION=${FORWARD_DESTINATION:-}
      - MONERO_WALLET_ADDRESS=${MONERO_WALLET_ADDRESS:-}
    volumes:
      - ${P2POOL_DATA_DIR:-./data/p2pool}:/root/.p2pool
    depends_on:
      - monerod-join
      - dwowd-join
    restart: unless-stopped

networks:
  dwow-local:
    driver: bridge

volumes:
  observer_data:
  node0_data:
  node1_data:
  node2_data:
  node3_data:
  node4_data:
  monerod_data:
  p2pool_data:
