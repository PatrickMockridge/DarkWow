# DarkFi Linear-Testnet Node 1 Configuration
network = "linear-testnet"

[network_config."linear-testnet"]
# Database path (container internal)
database = "~/.local/share/darkfi/darkfid/linear-testnet"

# Consensus settings
threshold = 1
max_forks = 8

# PoW settings
[network_config."linear-testnet".pow]
# Target block time in seconds (60 = 1 block per minute)
target_block_time = 60
# Initial difficulty (first block) - 0xFF = 255, easy for testnet
initial_difficulty = 255
# Minimum difficulty
min_difficulty = 1
# Maximum difficulty
max_difficulty = 4294967295
# Minimum interval between valid blocks (seconds)
min_block_interval = 10

# Startup behavior
skip_sync = true
skip_fees = true
txs_batch_size = 50

# RPC endpoint
[network_config."linear-testnet".rpc]
rpc_listen = "tcp://0.0.0.0:28346"

# Stratum RPC for xmrig
[network_config."linear-testnet".stratum_rpc]
rpc_listen = "tcp://0.0.0.0:48447"

# P2P network
[network_config."linear-testnet".net]
localnet = true
active_profiles = ["tcp+tls"]
peers = ["tcp+tls://node0:28340"]

[network_config."linear-testnet".net.profiles."tcp+tls"]
inbound = ["tcp+tls://0.0.0.0:28341"]