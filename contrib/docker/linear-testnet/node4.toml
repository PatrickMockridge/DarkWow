# DarkFi Linear-Testnet Node 4 Configuration
network = "linear-testnet"

[network_config."linear-testnet"]
database = "~/.local/share/darkfi/darkfid/linear-testnet"

threshold = 1
max_forks = 8
pow_target = 1
pow_fixed_difficulty = 1
skip_sync = true
skip_fees = true
txs_batch_size = 50

[network_config."linear-testnet".rpc]
rpc_listen = "tcp://0.0.0.0:28349"

[network_config."linear-testnet".stratum_rpc]
rpc_listen = "tcp://0.0.0.0:48747"

[network_config."linear-testnet".net]
localnet = true
active_profiles = ["tcp+tls"]
peers = ["tcp+tls://node0:28340"]

[network_config."linear-testnet".net.profiles."tcp+tls"]
inbound = ["tcp+tls://0.0.0.0:28344"]