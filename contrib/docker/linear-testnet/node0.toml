# DarkFi Linear-Testnet Node 0 Configuration (Seed Peer)
network = "linear-testnet"

[network_config."linear-testnet"]
# Database path (container internal)
database = "~/.local/share/darkfi/darkfid/linear-testnet"

# Consensus settings
threshold = 1
max_forks = 8

# PoW settings (fixed difficulty = 1 for fast testing)
pow_target = 1
pow_fixed_difficulty = 1

# Developer wallet configuration
# Initial DARK allocation at genesis for development
dev_wallet_secret = "generate"  # "generate" = create new, or hex-encoded secret
dev_wallet_initial_balance = 100000000000  # 100 DARK in smallest unit

# Mining reward recipient (defaults to dev_wallet if not set)
# mining_recipient = "Dz..."  # bs58 encoded public address

# Startup behavior
skip_sync = true
skip_fees = true
txs_batch_size = 50

# RPC endpoint
[network_config."linear-testnet".rpc]
rpc_listen = "tcp://0.0.0.0:28345"

# Stratum RPC for xmrig
[network_config."linear-testnet".stratum_rpc]
rpc_listen = "tcp://0.0.0.0:48347"

# P2P network
[network_config."linear-testnet".net]
localnet = true
active_profiles = ["tcp+tls"]

[network_config."linear-testnet".net.profiles."tcp+tls"]
inbound = ["tcp+tls://0.0.0.0:28340"]

# No peers - this is the seed node