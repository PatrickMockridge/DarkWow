version: '3.8'
services:
  lilith:
    build:
      context: ../../..
      dockerfile: contrib/docker/linear-testnet/Dockerfile
    container_name: dwow-linear-lilith
    hostname: lilith
    # Override entrypoint - lilith uses inline config
    entrypoint: ["/bin/sh", "-c", "cat > /tmp/lilith.toml << 'LILITH_EOF'\n[rpc]\nrpc_listen = \"tcp://127.0.0.1:18927\"\n\n[network.\"linear-testnet\"]\naccept_addrs = [\"tcp+tls://0.0.0.0:18345\"]\nseeds = []\npeers = []\nversion = \"0.5.0\"\napp_name = \"darkfid\"\nlocalnet = true\nhostlist =\"~/.local/share/dwow/lilith/linear-testnet/hostlist.tsv\"\ndatastore = \"~/.local/share/dwow/lilith/linear-testnet\"\nmagic_bytes = [163, 139, 113, 101]\nLILITH_EOF\nexec /app/lilith --config /tmp/lilith.toml"]
    command: []
    ports:
      - "18345:18345"
    volumes:
      - lilith_data:/root/.local/share/dwow/lilith
    networks:
      - dwow-local
    healthcheck:
      test: ["CMD", "/app/lilith", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  node0:
    build:
      context: ../../..
      dockerfile: contrib/docker/linear-testnet/Dockerfile
    container_name: dwow-linear-node0
    hostname: node0
    entrypoint: ["/app/entrypoint.sh"]
    environment:
      - NETWORK=linear-testnet
    ports:
      - "28345:28345"
      - "48347:48347"
      - "28340:28340"
    volumes:
      - node0_data:/root/.local/share/dwow/darkfid
    networks:
      - dwow-local
    depends_on:
      - lilith
    healthcheck:
      test: ["CMD", "/app/dwowd", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  node1:
    build:
      context: ../../..
      dockerfile: contrib/docker/linear-testnet/Dockerfile
    container_name: dwow-linear-node1
    hostname: node1
    entrypoint: ["/app/entrypoint.sh"]
    environment:
      - NETWORK=linear-testnet
    ports:
      - "28346:28346"
      - "48447:48447"
      - "28341:28341"
    volumes:
      - node1_data:/root/.local/share/dwow/darkfid
    networks:
      - dwow-local
    depends_on:
      - lilith
      - node0
    healthcheck:
      test: ["CMD", "/app/dwowd", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  dwow-local:
    driver: bridge

volumes:
  lilith_data:
  node0_data:
  node1_data:
