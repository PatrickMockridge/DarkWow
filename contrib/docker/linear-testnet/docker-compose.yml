version: '3.8'
services:
  node0:
    build:
      context: ../../..
      dockerfile: contrib/docker/linear-testnet/Dockerfile
    container_name: darkfi-linear-node0
    hostname: node0
    entrypoint: ["/app/entrypoint.sh"]
    environment:
      - NETWORK=linear-testnet
    ports:
      - "28345:28345"
      - "48347:48347"
      - "28340:28340"
    volumes:
      - node0_data:/root/.local/share/darkfi/darkfid
    networks:
      - darkfi-local
    healthcheck:
      test: ["CMD", "/app/darkfid", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  node1:
    build:
      context: ../../..
      dockerfile: contrib/docker/linear-testnet/Dockerfile
    container_name: darkfi-linear-node1
    hostname: node1
    entrypoint: ["/app/entrypoint.sh"]
    environment:
      - NETWORK=linear-testnet
    ports:
      - "28346:28346"
      - "48447:48447"
      - "28341:28341"
    volumes:
      - node1_data:/root/.local/share/darkfi/darkfid
    networks:
      - darkfi-local
    depends_on:
      - node0
    healthcheck:
      test: ["CMD", "/app/darkfid", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  darkfi-local:
    driver: bridge

volumes:
  node0_data:
  node1_data:
