version: '3.8'

services:
  # ============================================
  # Node 0 (Seed peer)
  # ============================================
  node0:
    build:
      context: /home/patrick/Darkfi/darkfi
      dockerfile: contrib/docker/linear-testnet/Dockerfile
      args:
        - BUILD_FROM_SOURCE=1
    container_name: darkfi-linear-node0
    ports:
      - "28345:28345"  # RPC
      - "48347:48347"  # stratum
      - "28340:28340"  # P2P
    volumes:
      - ./node0.toml:/config/darkfid.toml:ro
      - node0_data:/root/.local/share/darkfi/darkfid
    networks:
      - darkfi-local
    command: -c /config/darkfid.toml --network linear-testnet

  # ============================================
  # Node 1
  # ============================================
  node1:
    build:
      context: /home/patrick/Darkfi/darkfi
      dockerfile: contrib/docker/linear-testnet/Dockerfile
      args:
        - BUILD_FROM_SOURCE=1
    container_name: darkfi-linear-node1
    ports:
      - "28346:28346"  # RPC
      - "48447:48447"  # stratum
      - "28341:28341"  # P2P
    volumes:
      - ./node1.toml:/config/darkfid.toml:ro
      - node1_data:/root/.local/share/darkfi/darkfid
    networks:
      - darkfi-local
    command: -c /config/darkfid.toml --network linear-testnet

  # ============================================
  # Node 2
  # ============================================
  node2:
    build:
      context: /home/patrick/Darkfi/darkfi
      dockerfile: contrib/docker/linear-testnet/Dockerfile
      args:
        - BUILD_FROM_SOURCE=1
    container_name: darkfi-linear-node2
    ports:
      - "28347:28347"  # RPC
      - "48547:48547"  # stratum
      - "28342:28342"  # P2P
    volumes:
      - ./node2.toml:/config/darkfid.toml:ro
      - node2_data:/root/.local/share/darkfi/darkfid
    networks:
      - darkfi-local
    command: -c /config/darkfid.toml --network linear-testnet

networks:
  darkfi-local:
    driver: bridge

volumes:
  node0_data:
  node1_data:
  node2_data: