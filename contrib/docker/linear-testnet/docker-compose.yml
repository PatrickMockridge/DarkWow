version: '3.8'

services:
  # ============================================
  # Node 0 (Seed peer)
  # ============================================
  node0:
    build: .
    container_name: darkfi-linear-node0
    ports:
      - "28345:28345"  # RPC
      - "48347:48347"  # stratum
      - "28340:28340"  # P2P
    volumes:
      - ./node0.toml:/config/darkfid.toml:ro
      - node0_data:/root/.local/share/darkfi/darkfid
    networks:
      - darkfi-local
    environment:
      - WALLET_ADDR=${WALLET_ADDR_0:-DZnsGMCvZU5CEzvpuExnxbvz6SEhE2rn89sMcuHsppFE6TjL4SBTrKkf}
    command: -c /config/darkfid.toml --network linear-testnet
    healthcheck:
      test: ["CMD", "curl", "-f", "-X", "POST", "http://localhost:28345", "-H", "Content-Type: application/json", "-d", '{"jsonrpc":"2.0","method":"ping","params":[],"id":1}']
      interval: 10s
      timeout: 5s
      retries: 5

  xmrig0:
    image: xmrig/xmrig:latest
    container_name: darkfi-linear-xmrig0
    networks:
      - darkfi-local
    command: ["-u", "x+1", "-o", "node0:48347", "-t", "2", "-u", "${WALLET_ADDR_0:-DZnsGMCvZU5CEzvpuExnxbvz6SEhE2rn89sMcuHsppFE6TjL4SBTrKkf}"]
    restart: unless-stopped

  # ============================================
  # Node 1
  # ============================================
  node1:
    build: .
    container_name: darkfi-linear-node1
    ports:
      - "28346:28346"  # RPC
      - "48447:48447"  # stratum
      - "28341:28341"  # P2P
    volumes:
      - ./node1.toml:/config/darkfid.toml:ro
      - node1_data:/root/.local/share/darkfi/darkfid
    networks:
      - darkfi-local
    environment:
      - WALLET_ADDR=${WALLET_ADDR_1:-DZnsGMCvZU5CEzvpuExnxbvz6SEhE2rn89sMcuHsppFE6TjL4SBTrKkf}
    command: -c /config/darkfid.toml --network linear-testnet
    depends_on:
      - node0
    healthcheck:
      test: ["CMD", "curl", "-f", "-X", "POST", "http://localhost:28346", "-H", "Content-Type: application/json", "-d", '{"jsonrpc":"2.0","method":"ping","params":[],"id":1}']
      interval: 10s
      timeout: 5s
      retries: 5

  xmrig1:
    image: xmrig/xmrig:latest
    container_name: darkfi-linear-xmrig1
