## darkfid configuration file
##
## Please make sure you go through all the settings so you can configure
## your daemon properly.
##
## The default values are left commented. They can be overridden either by
## uncommenting, or by using the command-line.

# Blockchain network to use
network = "linear-testnet"

# Linear-testnet blockchain network configuration
[network_config."linear-testnet"]
# Path to the blockchain database directory
database = "/home/patrick/Darkfi/dwow/contrib/localnet/darkfid-single-node/data/darkfid"

# Confirmation threshold, denominated by number of blocks
threshold = 1

# Max in-memory forks to maintain
max_forks = 8

# PoW block production target, in seconds
pow_target = 1

# Optional fixed PoW difficulty, used for testing
pow_fixed_difficulty = 1

# Skip syncing process and start node right away
skip_sync = true

# Disable transaction's fee verification, used for testing
skip_fees = true

## Linear-testnet JSON-RPC settings
[network_config."linear-testnet".rpc]
# JSON-RPC listen URL
rpc_listen = "tcp://127.0.0.1:28345"

# Disabled RPC methods
#rpc_disabled_methods = []

## Linear-testnet P2P network settings
[network_config."linear-testnet".net]
# Allow localnet hosts
localnet = true

# Whitelisted network transports for outbound connections
active_profiles = ["tcp+tls"]

[network_config."linear-testnet".net.profiles."tcp+tls"]
# P2P accept addresses the instance listens on for inbound connections
inbound = ["tcp+tls://0.0.0.0:28340"]
