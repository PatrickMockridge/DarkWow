# DarkWow Testnet Docker Compose
# Usage: docker compose up -d
#
# Runs a dwowd node on darkwow-testnet in a container.
# Data is persisted to ~/.local/share/dwow on the host.
#
# Ports:
#   31345 - JSON-RPC
#   31347 - Stratum (xmrig)
#   31348 - Merge Mining JSON-RPC (p2pool)
#   31342 - P2P (if inbound enabled)
#
# Example:
#   # Start
#   docker compose up -d
#
#   # View logs
#   docker compose logs -f
#
#   # Stop
#   docker compose down
#
#   # With custom config
#   docker compose run --rm dwowd --verbose

version: '3.8'

services:
  dwowd:
    image: dwow:testnet
    container_name: dwowd-testnet
    restart: unless-stopped
    volumes:
      - ${DWOW_HOME:-$HOME/.local/share/dwow}:/data
    ports:
      - "31345:31345"   # JSON-RPC
      - "31347:31347"   # Stratum (xmrig)
      - "31348:31348"   # Merge Mining JSON-RPC (p2pool)
      # - "31342:31342" # P2P (uncomment to enable inbound connections)
    environment:
      - NETWORK=darkwow-testnet
    command: dwowd --network darkwow-testnet
    healthcheck:
      test: ["CMD", "/usr/bin/dwowd", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dwow-local

networks:
  dwow-local:
    driver: bridge
