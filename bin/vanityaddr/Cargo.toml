[package]
name = "vanityaddr"
version = "0.5.0"
homepage = "https://darkwow.org"
description = "Vanity address generation tool for DarkFi keypairs, contract IDs, and token IDs"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
repository = "https://codeberg.org/darkrenaissance/darkfi"
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
arg = {git = "https://github.com/parazyd/arg"}
bs58 = "0.5.1"
ctrlc = "3.5.1"
dwow = {path = "../../", features = ["async-serial", "util"]}
dwow-sdk = {path = "../../src/sdk", features = ["async"]}
rand = "0.8.5"
rayon = "1.11.0"

[lints]
workspace = true
