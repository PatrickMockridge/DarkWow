[package]
name = "eth_relayer"
version = "0.5.0"
homepage = "https://darkwow.org"
description = "ETH bridge relayer service for DarkFi"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
repository = "https://codeberg.org/darkrenaissance/darkfi"
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
# Darkfi
dwow_core = {path = "../../", features = ["async-daemonize", "rpc", "async-serial"]}
dwow-sdk = {path = "../../src/sdk", features = ["async"]}
dwow-serial = {path = "../../src/serial", features = ["async"]}
dwow_bridge_contract = {path = "../../src/contract/bridge"}

# Serialization
serde = {version = "1.0.228", features = ["derive"]}
toml = "0.9.8"
hex = "0.4.3"

# Crypto
blake3 = "1.8.2"
secp256k1 = "0.28"  # For ETH transaction signing

# Async
smol = "2.0.2"

# RPC
tinyjson = "2.5.1"
url = "2.5.7"

# Ethereum
web3 = "0.19"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt"] }

# Argument parsing
structopt = "0.3.26"
structopt-toml = "0.5.1"

[lints]
workspace = true