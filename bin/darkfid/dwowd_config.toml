## ===========================
## DWOW-DEVNET CONFIGURATION (reference)
## ===========================
## This section documents the config generated by the Docker devnet
## entrypoint (contrib/docker/dwow-devnet/entrypoint.sh). It is not
## meant to be used directly — use the Docker image instead, which
## generates this config from environment variables at runtime.
##
## The Docker image handles:
##   - Magic bytes auto-derived from NETWORK_NAME (blake3 hash)
##   - Seed/miner role selection via IS_SEED / SEED_ADDR env vars
##   - External address configuration for internet-facing nodes
##   - Fixed difficulty for fast devnet block mining
##
## See contrib/docker/dwow-devnet/README.md for usage.
#
#[network_config."dwow-devnet"]
#database = "~/.local/share/dwow/dwowd/dwow-devnet"
#threshold = 1
#max_forks = 8
#pow_target = 120
#pow_fixed_difficulty = 1
#skip_sync = true
#skip_fees = true
#txs_batch_size = 50
#
#[network_config."dwow-devnet".pow]
#target_block_time = 120
#initial_difficulty = 255
#min_difficulty = 1
#max_difficulty = 4294967295
#min_block_interval = 10
#
#[network_config."dwow-devnet".rpc]
#rpc_listen = "tcp://0.0.0.0:31345"
#
#[network_config."dwow-devnet".stratum_rpc]
#rpc_listen = "tcp://0.0.0.0:31347"
#
#[network_config."dwow-devnet".management_rpc]
#rpc_listen = "tcp://127.0.0.1:31346"
#
#[network_config."dwow-devnet".net]
#localnet = false
#active_profiles = ["tcp+tls"]
#inbound = ["tcp+tls://0.0.0.0:31342"]
#magic_bytes = [0, 0, 0, 0]  # auto-derived from NETWORK_NAME
#hostlist = "~/.local/share/dwow/dwowd/dwow-devnet/hostlist.tsv"
## If joining an existing devnet, uncomment and set the seed address:
## seeds = ["tcp+tls://<seed-ip>:31342"]
## If this is the seed and internet-facing, uncomment:
## external_addrs = ["tcp+tls://<public-ip>:31342"]
#
#[network_config."dwow-devnet".net.profiles."tcp+tls"]
#inbound = ["tcp+tls://0.0.0.0:31342"]
