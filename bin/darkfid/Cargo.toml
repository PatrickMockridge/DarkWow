[package]
name = "darkfid"
version = "0.5.0"
homepage = "https://darkwow.org"
description = "DarkFi node daemon"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
repository = "https://codeberg.org/darkrenaissance/darkfi"
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
# Darkfi
darkfi = {path = "../../", features = ["async-daemonize", "bs58", "validator", "net", "rpc"]}
darkfi_linear = {path = "../../src/linear", features = ["async"]}
darkfi_money_v3_contract = {path = "../../src/contract/money_v3", features = ["client", "no-entrypoint"]}
darkfi_native_token_contract = {path = "../../src/contract/native_token", features = ["client"]}
darkfi_deployooor_contract = {path = "../../src/contract/deployooor", features = ["client"]}
darkfi_baccarat_contract = {path = "../../src/contract/baccarat", features = ["client", "no-entrypoint"]}
darkfi-sdk = {path = "../../src/sdk"}
darkfi-serial = {path = "../../src/serial"}

# Misc
blake3 = "1.8.2"
glob = "0.3"
randomx = {git = "https://codeberg.org/darkrenaissance/RandomX", rev = "0e31d5a"}
thiserror = "2.0"
bs58 = "0.5.1"
tracing = "0.1.44"
num-bigint = "0.4.6"
rand = "0.8.5"
sled = "0.34"
toml = "0.9.8"

# JSON-RPC
async-trait = "0.1.89"
tinyjson = "2.5.1"
url = "2.5.7"

# Monero
monero = "0.21.0"
hex = "0.4.3"

# Daemon
easy-parallel = "3.3.1"
signal-hook-async-std = "0.4.0"
signal-hook = "0.4.1"
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt"] }
tracing-appender = "0.2.4"
smol = "2.0.2"

# Argument parsing
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0"
structopt = "0.3.26"
structopt-toml = "0.5.1"

[dev-dependencies]
darkfi-contract-test-harness = {path = "../../src/contract/test-harness"}
darkfi_attestation_contract = {path = "../../src/contract/attestation", features = ["client", "no-entrypoint"]}
darkfi_bridge_contract = {path = "../../src/contract/bridge", features = ["client", "no-entrypoint"]}
darkfi_lottery_contract = {path = "../../src/contract/lottery", features = ["client", "no-entrypoint"]}
darkfi_tender_contract = {path = "../../src/contract/tender", features = ["client", "no-entrypoint"]}
darkfi_auction_contract = {path = "../../src/contract/auction", features = ["client", "no-entrypoint"]}
darkfi_pool_stake_contract = {path = "../../src/contract/pool_stake", features = ["client", "no-entrypoint"]}

[lints]
workspace = true
