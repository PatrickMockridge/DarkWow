[package]
name = "darkfid"
version = "0.5.0"
homepage = "https://dark.fi"
description = "DarkFi node daemon"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
repository = "https://codeberg.org/darkrenaissance/darkfi"
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
# Darkfi
darkfi = {path = "../../", features = ["async-daemonize", "bs58", "validator", "net", "rpc"]}
darkfi_money_v2_contract = {path = "../../src/contract/money_v2"}
darkfi_native_token_contract = {path = "../../src/contract/native_token", features = ["client"]}
darkfi_deployooor_contract = {path = "../../src/contract/deployooor", features = ["client"]}
darkfi-contract-test-harness = {path = "../../src/contract/test-harness"}  # TEMPORARILY DISABLED - needs cleanup
darkfi-sdk = {path = "../../src/sdk"}
darkfi-serial = {path = "../../src/serial"}

# Misc
blake3 = "1.8.2"
glob = "0.3"
thiserror = "2.0"
bs58 = "0.5.1"
tracing = "0.1.44"
num-bigint = "0.4.6"
rand = "0.8.5"
sled-overlay = "0.1.20"
toml = "0.9.8"

# JSON-RPC
async-trait = "0.1.89"
tinyjson = "2.5.1"
url = "2.5.7"

# Monero
monero = "0.21.0"
hex = "0.4.3"

# Daemon
easy-parallel = "3.3.1"
signal-hook-async-std = "0.4.0"
signal-hook = "0.4.1"
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt"] }
tracing-appender = "0.2.4"
smol = "2.0.2"

# Argument parsing
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0"
structopt = "0.3.26"
structopt-toml = "0.5.1"

[lints]
workspace = true
