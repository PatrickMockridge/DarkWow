## dww configuration file
##
## Please make sure you go through all the settings so you can configure
## your daemon properly.
##
## The default values are left commented. They can be overridden either by
## uncommenting, or by using the command-line.

# Blockchain network to use
network = "darkwow-devnet"

# Localnet blockchain network configuration
[network_config."localnet"]
# Path to primary blockchain sled database (CChainState — same as dwowd)
chain_path = "~/.local/share/dwow/dww/localnet/database"

# Path to wallet-specific cache sled database
cache_path = "~/.local/share/dwow/dww/localnet/cache"

# Path to wallet database
wallet_path = "~/.local/share/dwow/dww/localnet/wallet.db"

# Password for the wallet database
# HAZOP H12: do not hardcode wallet passwords. The wallet will prompt on first use.
# Set via environment: export DWOW_WALLET_PASS=your_password
# wallet_pass = "set-via-env-or-prompt"

# dwowd JSON-RPC endpoint
endpoint = "tcp://127.0.0.1:48345"

# Path to interactive shell history file
history_path = "~/.local/share/dwow/dww/localnet/history.txt"

## P2P network settings — wallet participates as a full node
[network_config."localnet".net]
localnet = true

# Testnet blockchain network configuration
[network_config."testnet"]
# Path to primary blockchain sled database (CChainState — same as dwowd)
chain_path = "~/.local/share/dwow/dww/testnet/database"

# Path to wallet-specific cache sled database
cache_path = "~/.local/share/dwow/dww/testnet/cache"

# Path to wallet database
wallet_path = "~/.local/share/dwow/dww/testnet/wallet.db"

# Password for the wallet database
# HAZOP H12: do not hardcode wallet passwords. The wallet will prompt on first use.
# Set via environment: export DWOW_WALLET_PASS=your_password
# wallet_pass = "set-via-env-or-prompt"

# dwowd JSON-RPC endpoint
endpoint = "tcp://127.0.0.1:18345"

# Path to interactive shell history file
history_path = "~/.local/share/dwow/dww/testnet/history.txt"

## P2P network settings — wallet participates as a full node (pull-only).
## The wallet connects DIRECTLY to these `peers` (ManualSession) and pulls
## GetTip/GetBlocks. No seed/hostlist exchange.
[network_config."testnet".net]
peers = [{ url = "tcp+tls://lilith0.dark.fi:18340" }, { url = "tcp+tls://lilith1.dark.fi:18340" }]
magic_bytes = [163, 139, 113, 101]

# Linear-testnet blockchain network configuration
[network_config."darkwow-devnet"]
# Path to primary blockchain sled database (CChainState — same as dwowd)
chain_path = "~/.local/share/dwow/dww/darkwow-devnet/database"

# Path to wallet-specific cache sled database
cache_path = "~/.local/share/dwow/dww/darkwow-devnet/cache"

# Path to wallet database
wallet_path = "~/.local/share/dwow/dww/darkwow-devnet/wallet.db"

# Password for the wallet database
# HAZOP H12: do not hardcode wallet passwords. The wallet will prompt on first use.
# Set via environment: export DWOW_WALLET_PASS=your_password
# wallet_pass = "set-via-env-or-prompt"

# dwowd JSON-RPC endpoint
endpoint = "tcp://127.0.0.1:28345"

# Path to interactive shell history file
history_path = "~/.local/share/dwow/dww/darkwow-devnet/history.txt"

## P2P network settings — wallet participates as a full node
[network_config."darkwow-devnet".net]
localnet = true
# Matches the node's devnet magic (dwowd_config.toml line 646), so a wallet on
# devnet does not silently fall back to the wrong DRKW default.
magic_bytes = [241, 227, 197, 179]

# DarkWow Testnet blockchain network configuration
[network_config."darkwow-testnet"]
# Path to primary blockchain sled database (CChainState — same as dwowd)
chain_path = "~/.local/share/dwow/dww/darkwow-testnet/database"

# Path to wallet-specific cache sled database
cache_path = "~/.local/share/dwow/dww/darkwow-testnet/cache"

# Path to wallet database
wallet_path = "~/.local/share/dwow/dww/darkwow-testnet/wallet.db"

# Password for the wallet database
# HAZOP H12: do not hardcode wallet passwords. The wallet will prompt on first use.
# Set via environment: export DWOW_WALLET_PASS=your_password
# wallet_pass = "set-via-env-or-prompt"

# dwowd JSON-RPC endpoint (for tx broadcast, fee lookup, ZKAS lookup)
# Block sync uses P2P via the net section below
endpoint = "tcp://127.0.0.1:31345"

# Path to interactive shell history file
history_path = "~/.local/share/dwow/dww/darkwow-testnet/history.txt"

## P2P network settings — wallet participates as a full node (pull-only)
[network_config."darkwow-testnet".net]
# Dial the mining node's tcp+tls inbound (0.0.0.0:31342), NOT the seed port
# (31340) — seeds are for hostlist discovery, not block sync. A wallet pointed
# at the seed port never reaches a LinearSyncHandler and stays at peers=0.
peers = [{ url = "tcp+tls://127.0.0.1:31342" }]
localnet = true
magic_bytes = [68, 82, 75, 87]

# Mainnet blockchain network configuration
[network_config."mainnet"]
# Path to primary blockchain sled database (CChainState — same as dwowd)
chain_path = "~/.local/share/dwow/dww/mainnet/database"

# Path to wallet-specific cache sled database
cache_path = "~/.local/share/dwow/dww/mainnet/cache"

# Path to wallet database
wallet_path = "~/.local/share/dwow/dww/mainnet/wallet.db"

# Password for the wallet database
# WARNING: Do not set wallet_pass in the config file for production.
# The wallet will prompt for a password on first use. Set via env:
#   export DWOW_WALLET_PASS=your_strong_password
# wallet_pass = "set-via-env-or-prompt"

# Enable production security checks (password strength, encryption verification)
# production = true

# dwowd JSON-RPC endpoint
endpoint = "tcp://127.0.0.1:8345"

# Path to interactive shell history file
history_path = "~/.local/share/dwow/dww/mainnet/history.txt"

## P2P network settings — wallet participates as a full node (pull-only)
## (peers TBD — update before mainnet launch)
[network_config."mainnet".net]
# peers TBD before mainnet launch
