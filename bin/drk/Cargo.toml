[package]
name = "dww"
version = "0.5.0"
homepage = "https://darkwow.org"
description = "Command-line client for darkwow daemon"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
repository = "https://codeberg.org/darkrenaissance/darkfi"
license = "AGPL-3.0-only"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Darkfi
dwow = {path = "../../", features = ["async-daemonize", "bs58", "rpc", "randomx", "tx", "blockchain"]}
dwow_deployooor_contract = {path = "../../src/contract/deployooor", features = ["no-entrypoint", "client"]}
dwow-sdk = {path = "../../src/sdk", features = ["async"]}
dwow-serial = {path = "../../src/serial", features = ["async", "derive"]}
dwow_linear = {path = "../../src/linear"}

# Contract crates for drk wallet
dwow_money_v3_contract = {path = "../../src/contract/money_v3", features = ["client"]}
dwow_native_token_contract = {path = "../../src/contract/native_token", features = ["client", "no-entrypoint"]}
dwow_dao_escrow_contract = {path = "../../src/contract/dao_escrow", features = ["client", "no-entrypoint"]}
dwow_stablecoin_contract = {path = "../../src/contract/stablecoin", features = ["client", "no-entrypoint"]}
dwow_drain_protection_contract = {path = "../../src/contract/drain_protection", features = ["client"]}
dwow_atomic_swap_contract = {path = "../../src/contract/atomic_swap", features = ["client"]}
dwow_attestation_contract = {path = "../../src/contract/attestation", features = ["client"]}
dwow_auction_contract = {path = "../../src/contract/auction", features = ["client"]}
dwow_baccarat_contract = {path = "../../src/contract/baccarat", features = ["client"]}
dwow_betting_stake_contract = {path = "../../src/contract/betting_stake", features = ["client"]}
dwow_bridge_contract = {path = "../../src/contract/bridge", features = ["client"]}
dwow_darkbet_exchange_contract = {path = "../../src/contract/darkbet_exchange", features = ["client"]}
dwow_darktoshi_dice_contract = {path = "../../src/contract/darktoshi_dice", features = ["client"]}
dwow_dex_contract = {path = "../../src/contract/dex", features = ["client"]}
dwow_escrow_contract = {path = "../../src/contract/escrow", features = ["client"]}
dwow_game_room_contract = {path = "../../src/contract/game_room", features = ["client"]}
dwow_identity_contract = {path = "../../src/contract/identity", features = ["client"]}
dwow_insurance_market_contract = {path = "../../src/contract/insurance_market", features = ["client"]}
dwow_labor_market_contract = {path = "../../src/contract/labor_market", features = ["client"]}
dwow_lottery_contract = {path = "../../src/contract/lottery", features = ["client"]}
dwow_oracle_contract = {path = "../../src/contract/oracle", features = ["client"]}
dwow_pool_stake_contract = {path = "../../src/contract/pool_stake", features = ["client"]}
dwow_relayer_endowment_contract = {path = "../../src/contract/relayer_endowment", features = ["client"]}
dwow_roulette_contract = {path = "../../src/contract/roulette", features = ["client"]}
dwow_slot_contract = {path = "../../src/contract/slot", features = ["client"]}
dwow_subscription_contract = {path = "../../src/contract/subscription", features = ["client"]}
dwow_tender_contract = {path = "../../src/contract/tender", features = ["client"]}

# Misc
blake3 = "1.8.2"
hex = "0.4.3"
randomx = {git = "https://codeberg.org/darkrenaissance/RandomX", rev = "0e31d5a"}
serde_json = "1.0"
bs58 = "0.5.1"
futures = "0.3.31"
lazy_static = "1.5.0"
libc = "0.2"
linenoise-rs = "0.1.1"
num-bigint = "0.4.6"
prettytable-rs = "0.10.0"
rand = "0.8.5"
rodio = {version = "0.21.1", default-features = false, features = ["playback", "mp3"]}
rusqlite = {version = "0.37.0", features = ["sqlcipher"]}
sled-overlay = "0.1.20"
toml = "0.9.8"
tracing = "0.1.44"
url = "2.5.7"

# Daemon
easy-parallel = "3.3.1"
signal-hook-async-std = "0.4.0"
signal-hook = "0.4.1"
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt"] }
tracing-appender = "0.2.4"
smol = "2.0.2"

# Argument parsing
serde = {version = "1.0.228", features = ["derive"]}
structopt = "0.3.26"
structopt-toml = "0.5.1"

[lints]
workspace = true
