[package]
name = "dwow_wallet"
version = "0.5.0"
homepage = "https://darkwow.org"
description = "Command-line client for dwowd daemon"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
repository = "https://codeberg.org/darkrenaissance/darkwow"
license = "AGPL-3.0-only"
edition = "2021"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Darkfi
dwow_core = {path = "../../", features = ["blockchain", "net"]}
dwow_deployooor_contract = {path = "../../src/contract/deployooor", features = ["no-entrypoint", "client"]}
dwow-sdk = {path = "../../src/sdk", features = ["async"]}
dwow-serial = {path = "../../src/serial", features = ["async", "derive", "url"]}
dwow_chain = {path = "../../src/linear"}
async-trait = "0.1"

# Core contract crates — ZK binary blobs for proof generation.
# Genesis contracts are on-chain; wallets discover interfaces via manifest during scan.
# Non-genesis contract Rust/ZK code remains available for deploy-on-command.
dwow_promissory_note_contract = {path = "../../src/contract/promissory_note", features = ["client", "no-entrypoint"]}
dwow_native_token_contract = {path = "../../src/contract/native_token", features = ["client", "no-entrypoint"]}
# All other contract crate deps removed — zero source references, pure compile waste.

# Misc
blake3 = "1.8.2"
hex = "0.4.3"
randomx = {git = "https://codeberg.org/darkrenaissance/RandomX", rev = "0e31d5a"}
serde_json = "1.0"
bs58 = "0.5.1"
futures = "0.3.31"
wasmparser = "0.243.0"
ed25519-compact = "2"
libc = "0.2"
num-bigint = "0.4.6"
prettytable-rs = "0.10.0"
rand = "0.8.5"
semver = "1.0"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
futures-rustls = "0.26"
x509-parser = "0.17"
url = "2"
rusqlite = {version = "0.37.0", features = ["sqlcipher"]}
sled = "0.34.7"
thiserror = "2.0.17"
toml = "0.9.8"
tracing = "0.1.44"

# Daemon
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt"] }
smol = "2.0.2"

serde = {version = "1.0.228", features = ["derive"]}

# Optional transport modularity (Tor, SOCKS5, QUIC, Nym)
dwow_transport = { path = "../../src/transport", optional = true }

[features]
default = []
transport = ["dwow_transport"]
transport-tor = ["dwow_transport/tor"]
transport-socks5 = ["dwow_transport/socks5"]
transport-all = ["transport", "transport-tor", "transport-socks5"]

[lints]
workspace = true
