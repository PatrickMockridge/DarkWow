[package]
name = "universal_relayer"
version = "0.5.0"
homepage = "https://dark.fi"
description = "Universal bridge relayer for all chains on DarkFi"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
repository = "https://codeberg.org/darkrenaissance/darkfi"
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
# Darkfi
darkfi = {path = "../../", features = ["async-daemonize", "rpc", "async-serial"]}
darkfi-sdk = {path = "../../src/sdk", features = ["async"]}
darkfi-serial = {path = "../../src/serial", features = ["async"]}
darkfi_bridge_contract = {path = "../../src/contract/bridge"}

# Serialization
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0"
toml = "0.9.8"
hex = "0.4.3"

# Crypto
blake3 = "1.8.2"
bs58 = "0.5"

# Async
async-trait = "0.1"
smol = "2.0.2"

# HTTP client (simple, no deps conflicts)
ureq = "2.9"

# RPC
tinyjson = "2.5.1"
url = "2.5.7"

# Monero
monero = "0.21"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt"] }

# Argument parsing
structopt = "0.3.26"
structopt-toml = "0.5.1"

[lints]
workspace = true