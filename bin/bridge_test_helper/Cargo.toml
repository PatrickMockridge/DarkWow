[package]
name = "bridge_test_helper"
version = "0.1.0"
homepage = "https://darkwow.org"
description = "Bridge test helper — generates ZK proofs and encoded contract calls for bridge pipeline testing"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
repository = "https://codeberg.org/darkrenaissance/darkfi"
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
dwow = {path = "../../", features = ["rpc", "tx", "async-daemonize"]}
dwow-sdk = {path = "../../src/sdk"}
dwow-serial = {path = "../../src/serial", features = ["derive"]}
dwow_linear = {path = "../../src/linear"}
dwow_bridge_contract = {path = "../../src/contract/bridge", features = ["client"]}
dwow_relayer_endowment_contract = {path = "../../src/contract/relayer_endowment", features = ["client"]}
dwow-contract-test-harness = {path = "../../src/contract/test-harness"}
smol = "2.0.2"
structopt = "0.3.26"
hex = "0.4.3"
rand = "0.8.5"
url = "2.5.7"
anyhow = "1.0"
serde_json = "1.0"
bs58 = "0.5.1"
tinyjson = "2.5.1"

[lints]
workspace = true
