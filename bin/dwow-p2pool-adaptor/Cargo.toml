[package]
name = "dwow-p2pool-adaptor"
version = "0.1.0"
homepage = "https://darkwow.org"
description = "Protocol adaptor: presents dwowd as a monerod-compatible daemon to p2pool"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
repository = "https://codeberg.org/darkrenaissance/darkfi"
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
dwow = {path = "../../", features = ["async-daemonize", "net", "rpc"]}
dwow_linear = {path = "../../src/linear", features = ["async"]}
dwow-sdk = {path = "../../src/sdk"}
dwow-serial = {path = "../../src/serial"}

blake3 = "1.8.2"
hex = "0.4.3"
randomx = {git = "https://codeberg.org/darkrenaissance/RandomX", rev = "0e31d5a"}
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0"
tinyjson = "2.5.1"
url = "2.5.7"
smol = "2.0.2"
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.22", default-features = false, features = ["fmt"]}
structopt = "0.3.26"
structopt-toml = "0.5.1"

[lints]
workspace = true
