## lilith configuration file
##
## Please make sure you go through all the settings so you can configure
## your daemon properly.
##
## The default values are left commented. They can be overridden either by
## uncommenting, or by using the command-line.

## JSON-RPC settings
[rpc]
# JSON-RPC listen URL
rpc_listen = "tcp://127.0.0.1:18927"

# Disabled RPC methods
#rpc_disabled_methods = []

## Per-network settings
[network."darkwow-devnet"]
accept_addrs = ["tcp+tls://0.0.0.0:18345"]
seeds = []
peers = []
version = "0.5.0"
app_name = "darkfid"
localnet = true
hostlist ="~/.local/share/dwow/lilith/darkwow-devnet/hostlist.tsv"
datastore = "~/.local/share/dwow/lilith/darkwow-devnet"
magic_bytes = [163, 139, 113, 101]

[network."darkwow-testnet"]
accept_addrs = ["tcp+tls://0.0.0.0:31340"]
seeds = []
peers = []
version = "0.5.0"
app_name = "darkfid"
localnet = false
hostlist = "~/.local/share/dwow/lilith/darkwow-testnet/hostlist.tsv"
datastore = "~/.local/share/dwow/lilith/darkwow-testnet"
magic_bytes = [68, 82, 75, 87]

