[package]
name = "dwow_mempool"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "DarkWow mempool — fee-ordered transaction pool with nullifier dedup"

[dependencies]
dwow_chain = {path = "../../src/linear", features = ["fee-window"]}
dwow_core = {path = "../.."}
dwow-sdk = {path = "../../src/sdk", features = ["json"]}
blake3 = {version = "1", features = ["serde"]}
sled = "0.34"
smol = "2"
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
# Test fixtures must encode a genuine FeeV3 call: since `OBL-C146` the mempool derives the
# spent nullifier set from the L1 call params, so a hand-assembled `[0x08] ++ fee ++ zeros`
# fixture is refused at admission.
dwow_native_token_contract = {path = "../../src/contract/native_token", features = ["no-entrypoint"]}
