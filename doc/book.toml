[book]
authors = ["DarkWow"]
language = "en"
src = "src"
title = "The DarkWow Book"
description = "DarkWow mdbook"
text-direction = "ltr"

[output.html]
default-theme = "darkforest"
preferred-dark-theme = "darkforest"
theme = "theme"
additional-css = ["theme/tabs.css", "theme/highlight.css", "src/fonts.css"]
additional-js = ["theme/mermaid.min.js", "theme/mermaid-init.js", "theme/zkas-highlight.js", "theme/tabs.js"]

[output.html.search]
limit-results = 20

[output.html.playground]
runnable = false

[preprocessor.tabs]
optional = true

# [preprocessor.katex]
# macros = "latex-macros.txt"
# after = ["links"]
# optional = true

[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]
optional = true

[preprocessor.mermaid]
command = "mdbook-mermaid"
optional = true
