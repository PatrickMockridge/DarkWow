[package]
name = "dwow-net"
version = "0.5.0"
homepage = "https://darkwow.org"
description = "DarkWow: P2P networking crate — shared between dwowd and wallet"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
path = "mod.rs"

[dependencies]
# Async runtime
smol = "2.0.2"
futures = "0.3.31"
async-trait = "0.1.89"
pin-project-lite = "0.2.16"

# Logging
tracing = "0.1.44"

# Serialization
dwow-serial = { path = "../serial" }

# Networking types
url = { version = "2.5.7", features = ["serde"] }
semver = "1.0.27"
rand = "0.8.5"

# Config deserialization
serde = { version = "1.0.228", features = ["derive"] }
toml = { version = "0.9.8", optional = true }

# CLI config merging (daemon-only — wallet constructs Settings directly)
structopt = { version = "0.3.26", optional = true }
structopt-toml = { version = "0.5.1", optional = true }

# Transport: TLS
futures-rustls = { version = "0.26.0", default-features = false, features = ["logging", "tls12", "ring"], optional = true }
rcgen = { version = "0.14.6", optional = true, features = ["pem"] }
x509-parser = { version = "0.18.0", features = ["validate", "verify"], optional = true }

# Transport: QUIC
quinn-smol = { git = "https://github.com/parazyd/quinn", branch = "main", default-features = false, features = ["rustls-ring", "runtime-smol"], optional = true }

# Transport: Tor
arti-client = { version = "0.37.0", default-features = false, features = ["async-std", "compression", "error_detail", "rustls", "onion-service-client", "onion-service-service"], optional = true }
tor-rtcompat = { version = "0.37.0", features = ["async-std", "rustls"], optional = true }
tor-error = { version = "0.37.0", optional = true }
tor-hscrypto = { version = "0.37.0", optional = true }
tor-hsservice = { version = "0.37.0", optional = true }
tor-proto = { version = "0.37.0", optional = true }
tor-cell = { version = "0.37.0", optional = true }

# Transport: socks5
socket2 = { version = "0.6.1", features = ["all"], optional = true }

# UPnP
oxy-upnp-igd = { version = "0.1", optional = true }

# TLS cert utilities
ed25519-compact = { version = "2.2.0", optional = true }

[features]
default = []
# daemon CLI config merging (structopt + structopt-toml)
cli = ["structopt", "structopt-toml", "toml"]
# TLS transport
tls = ["futures-rustls", "rcgen", "x509-parser", "ed25519-compact"]
# QUIC transport
quic = ["quinn-smol"]
# Tor transport
tor = ["arti-client", "tor-rtcompat", "tor-error", "tor-hscrypto", "tor-hsservice", "tor-proto", "tor-cell"]
# SOCKS5 transport
socks5 = ["socket2"]
# UPnP port mapping
upnp-igd = ["oxy-upnp-igd"]
# All transports
transports = ["tls", "quic", "tor", "socks5"]
# Full daemon config (what dwowd needs)
daemon = ["cli", "transports", "upnp-igd"]
