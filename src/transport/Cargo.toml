[package]
name = "dwow_transport"
version = "0.5.0"
homepage = "https://darkwow.org"
description = "Pluggable transport abstraction for DarkWow (TCP, TLS, Tor, SOCKS5, QUIC, Unix, Nym)"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
repository = "https://codeberg.org/darkrenaissance/darkwow"
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
# Always needed
smol = "2.0.2"
url = "2.5.7"
futures = "0.3.31"
async-trait = "0.1.89"
tracing = "0.1.44"
libc = "0.2.178"
socket2 = { version = "0.6.1", features = ["all"] }

# TLS (always available — TCP+TLS is the standard transport)
futures-rustls = { version = "0.26.0", default-features = false, features = ["logging", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rcgen = { version = "0.14.6", features = ["pem"] }
x509-parser = { version = "0.18.0", features = ["validate", "verify"] }
ed25519-compact = "2.2.0"
blake3 = "1.8.2"

# Tor transport
arti-client = { version = "0.37.0", optional = true, default-features = false, features = ["async-std", "compression", "error_detail", "rustls", "onion-service-client", "onion-service-service"] }
tor-error = { version = "0.37.0", optional = true }
tor-rtcompat = { version = "0.37.0", optional = true, features = ["async-std", "rustls"] }
tor-hscrypto = { version = "0.37.0", optional = true }
tor-hsservice = { version = "0.37.0", optional = true }
tor-proto = { version = "0.37.0", optional = true }
tor-cell = { version = "0.37.0", optional = true }

# QUIC transport
quinn-smol = { git = "https://github.com/parazyd/quinn", branch = "main", default-features = false, features = ["rustls-ring", "runtime-smol"], optional = true }

# Nym transport (stub)
rand = { version = "0.8.5", optional = true }

[features]
default = []

tor = ["arti-client", "tor-hsservice", "tor-hscrypto", "tor-error", "tor-rtcompat", "tor-proto", "tor-cell"]
socks5 = []
unix = []
quic = ["quinn-smol"]
nym = ["rand"]

# Meta-features
all-transports = ["tor", "socks5", "unix", "quic", "nym"]

[lints]
workspace = true
