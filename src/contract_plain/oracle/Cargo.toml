[package]
name = "darkfi_plain_oracle_contract"
version = "0.1.0"
edition = "2021"
authors = ["DarkFi contributors"]
description = "DarkFi Plain Oracle Contract - Data aggregation with slashable staking"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
darkfi-sdk = { path = "../../../src/sdk", features = ["wasm"] }
darkfi-serial = { path = "../../../src/serial", features = ["derive", "crypto"] }
pasta_curves = "0.5.1"
thiserror = "2.0.17"

[features]
default = []
no-entrypoint = []

[lints]
workspace = true