[package]
name = "dwow_chain"
version = "0.1.0"
edition = "2021"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
license = "AGPL-3.0-only"

[features]
default = []
async = ["dwow-serial/async"]
# Post-mainnet (TBA): cross-shard Merkle SDK + shard state roots. Same wiring
# as the root crate's `sharding` feature (Cargo.toml:231) — the local cfg must
# also enable `dwow-sdk/sharding`, else `src/shard.rs` compiles against a
# `dwow_sdk::crypto::shard` module that is configured out (E0432). Only
# `--workspace --all-features` enabled the dep feature, masking the gap.
# DO NOT ENABLE before mainnet is stable. Architectural scaffolding only —
# all function bodies are todo!(). See doc/src/arch/consensus/scaling.md.
sharding = ["dwow-sdk/sharding"]
# Fee window signalling — adaptive congestion-driven threshold adjustment.
# Spec: fee-spec.md §12. Gated for modular deployment.
fee-window = []
# sync-p2p enables P2P message registration for shared sync protocol types.
# Required by any node (wallet, mining, observer) that sends/receives
# sync messages via dwow_core::net channels.
sync-p2p = ["dwow_core/net-wallet", "futures-rustls"]

[dependencies]
sled = "0.34"
sled-overlay = "0.1.20"
thiserror = "2.0.17"
tracing = "0.1"
blake3 = { version = "1", features = ["serde"] }
rand = "0.8"
randomx = { git = "https://codeberg.org/darkrenaissance/RandomX", rev = "0e31d5a" }
sha2 = "0.10"
# merlin removed — zero references in src/linear/src.
hex = "0.4"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "2"
ureq = "3"
monero = { version = "0.21.0" }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
primitive-types = { version = "0.14.0" }
dwow-sdk = { path = "../sdk", features = ["async", "json"] }
dwow_core = { path = "../..", features = ["wasm-runtime"] }
dwow_native_token_contract = { path = "../../src/contract/native_token", features = ["client"] }
smol = "2"
dwow-serial = { path = "../serial", features = ["derive", "async", "hash"] }
async-trait = "0.1"
futures-rustls = { version = "0.26.0", default-features = false, features = ["logging", "tls12", "ring"], optional = true }

[dev-dependencies]
smol = "2"