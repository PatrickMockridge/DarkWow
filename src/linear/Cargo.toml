[package]
name = "dwow_chain"
version = "0.1.0"
edition = "2021"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
license = "AGPL-3.0-only"

[features]
default = []
async = ["dwow-serial/async"]
# Fee window signalling — adaptive congestion-driven threshold adjustment.
# Spec: fee-spec.md §12. Gated for modular deployment.
fee-window = []
# sync-p2p enables P2P message registration for shared sync protocol types.
# Required by any node (wallet, mining, observer) that sends/receives
# sync messages via dwow_core::net channels.
sync-p2p = ["dwow_core/net-wallet", "futures-rustls"]
# Consensus-execution machinery: RandomX block hashing (Block::hash_with_vm,
# verify_uncle_proof, consensus::verify_proof), the Miner, the RandomX VM cache,
# and contract execution (execution.rs → dwow_core's wasmer runtime). Mining /
# verifying nodes (dwowd) enable this. The wallet (dww) does NOT — its scan path
# trusts the synced block hash, never re-hashes PoW, and never executes WASM, so
# it must not compile the RandomX or wasmer stacks.
pow = ["dep:randomx"]
# Lowers `COINBASE_MATURITY` (src/linear/src/lib.rs) from 100 to 1 for devnet and test
# builds.
#
# The maturity *rule* is untouched: `check_coinbase_maturity` still runs on every
# `connect_block` and still refuses an immature coinbase spend. Only the height it
# measures against changes. Nothing reads the number independently — the miner's
# mempool gate (`bin/dwowd/src/lib.rs`) and the in-memory pruning horizon
# (`chain_state.rs`) both name the same constant, so a build cannot half-adopt it.
#
# **Why test code needs it.** DRKW can only originate from a coinbase: `MintV1` is
# disabled, genesis is structurally one pinned coinbase, and there is no faucet or
# premine. So funding a wallet at all costs `COINBASE_MATURITY + 2` mined blocks —
# and this scaffold's per-block cost is ~256 MiB (a fresh RandomX cache), measured at
# 28-32 GB for the 101-block window. Lowering it makes wallet tests that need mature
# DRKW cost two blocks instead of 101. The value was five until `OBL-C146`; every fee
# fixture had been spending a height-2 coinbase at height 3 with an empty declaration,
# so the maturity rule never saw those spends. With a correct declaration the window had
# to fit the fixtures rather than the fixtures bypassing the rule.
#
# **This is consensus-visible.** A build with it enabled disagrees with a production
# node about when a coinbase spend is legal, *while sharing the same genesis pin* —
# so it must be enabled for every node of a given network or none of them. It is
# enabled only by dev-dependencies (never by a `[dependencies]` entry or a release
# build): dev-dependencies are not in the graph of a contract WASM build, and
# `src/linear` is in no contract's `SOURCE_MANIFEST`, so enabling it here can neither
# stale an artifact nor move the genesis pin.
short-coinbase-maturity = []

[dependencies]
sled = "0.34"
sled-overlay = "0.1.20"
thiserror = "2.0.17"
tracing = "0.1"
blake3 = { version = "1", features = ["serde"] }
rand = "0.8"
randomx = { git = "https://codeberg.org/darkrenaissance/RandomX", rev = "0e31d5a", optional = true }
sha2 = "0.10"
# merlin removed — zero references in src/linear/src.
hex = "0.4"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "2"
ureq = "3"
monero = { version = "0.21.0" }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
primitive-types = { version = "0.14.0" }
dwow-sdk = { path = "../sdk", features = ["async", "json"] }
dwow_core = { path = "../..", features = ["wasm-runtime", "tx"] }
dwow_native_token_contract = { path = "../../src/contract/native_token", features = ["client"] }
dwow_promissory_note_contract = { path = "../../src/contract/promissory_note" }
dwow_purse_contract = { path = "../../src/contract/purse" }
dwow_box_contract = { path = "../../src/contract/box" }
smol = "2"
dwow-serial = { path = "../serial", features = ["derive", "async", "hash"] }
async-trait = "0.1"
futures-rustls = { version = "0.26.0", default-features = false, features = ["logging", "tls12", "ring"], optional = true }

[dev-dependencies]
smol = "2"