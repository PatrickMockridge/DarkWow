[package]
name = "dwow_chain"
version = "0.1.0"
edition = "2021"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
license = "AGPL-3.0-only"

[features]
default = []
async = ["dwow-serial/async"]
# HAZID H-C1: reorganize_to() does not execute WASM or update contract state.
# Enabling reorg with the current implementation silently corrupts chain state.
# Gate until the missing WASM execution + supply chain update are implemented.
# See doc/src/arch/consensus/hazid-report.md §H-C1.

[dependencies]
sled = "0.34"
sled-overlay = "0.1.20"
thiserror = "2.0.17"
tracing = "0.1"
blake3 = { version = "1", features = ["serde"] }
rand = "0.8"
randomx = { git = "https://codeberg.org/darkrenaissance/RandomX", rev = "0e31d5a" }
sha2 = "0.10"
merlin = "3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "2"
ureq = "3"
monero = { version = "0.21.0" }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
primitive-types = { version = "0.14.0" }
dwow-sdk = { path = "../sdk", features = ["async"] }
dwow_core = { path = "../..", features = ["wasm-runtime"] }
dwow_native_token_contract = { path = "../../src/contract/native_token", features = ["client"] }
smol = "2"
dwow-serial = { path = "../serial", features = ["derive", "async"] }

[dev-dependencies]
smol = "2"