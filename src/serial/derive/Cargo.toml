[package]
name = "dwow-derive"
version = "0.5.1"
homepage = "https://darkwow.org"
description = "Crate for serialization derive macros"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
repository = "https://codeberg.org/darkrenaissance/darkfi"
license = "AGPL-3.0-only"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = {version = "2", features = ["full", "fold"]}

dwow-derive-internal = {path = "../derive-internal"}

[features]
default = []
async = ["dwow-derive-internal/async"]
