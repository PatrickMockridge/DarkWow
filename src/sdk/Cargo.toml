[package]
name = "dwow-sdk"
version = "0.5.0"
homepage = "https://darkwow.org"
description = "SDK used for developing smart contracts on DarkFi"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
repository = "https://codeberg.org/darkrenaissance/darkfi"
license = "AGPL-3.0-only"
edition = "2021"

[lib]
doctest = false

[features]
default = []
async = ["dwow-serial/async"]
wasm = []
# serde_json pulls f64 ops into wasm32 — non-deterministic across architectures.
# Contracts target wasm32 and must not contain float instructions.
# Wallet/node enable this feature; contracts do not.
json = ["dep:serde_json"]
# Post-mainnet (TBA): cross-shard Merkle SDK types. DO NOT ENABLE
# before mainnet stable. All function bodies are todo!().
sharding = []

[dependencies]
# Error handling
thiserror = "2.0.17"

# Serialization
dwow-serial = {path = "../serial", features = ["derive", "crypto"]}
serde = {version = "1.0", features = ["derive"]}
serde_json = { version = "1.0", optional = true }
hex = "0.4"
toml = "0.9"

# Encoding
bs58 = {version = "0.5.1", features = ["check"]}
num = "0.4.3"
sha2 = "0.10.9"

# Cryptography
blake2b_simd = "1.0.3"
blake3 = "1.8.2"
chacha20poly1305 = "0.10.1"
halo2_gadgets = "0.5.0"
bridgetree = "0.7.0"
num-bigint = "0.4.6"
num-traits = "0.2.19"
pasta_curves = "0.5.1"
rand_core = "0.6.4"
rand = "0.8.5"

# Misc
lazy_static = "1.5.0"
subtle = "2.6.1"
hashbrown = "0.16.1"

# Storage
sled-overlay = "0.1.20"

[dev-dependencies]
halo2_proofs = {version = "0.3.2", features = ["circuit-params", "dev-graph", "sanity-checks"]}
halo2_gadgets = {version = "0.5.0", features = ["test-dependencies"]}

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[lints]
workspace = true
