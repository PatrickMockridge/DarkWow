# FYI manifest — no capability descriptor (wallet uses generic AEAD discovery)

[contract]
name = "stablecoin"
category = "Stablecoin"
description = "CDP stablecoin — open position, deposit collateral, mint stable, repay, liquidate. Governance-signed UpdateConfig."
version = "2.0.0"
dependencies = ["promissory_note", "native_token_v1"]

[[functions]]
name = "initialize"
code = 0
requires_proof = true
proof_circuit = "InitV2"

[[functions]]
name = "open_position"
code = 1
requires_proof = true
proof_circuit = "OpenPositionV2"

[[functions]]
name = "add_collateral"
code = 2
requires_proof = true
proof_circuit = "AddCollateralV2"

[[functions]]
name = "remove_collateral"
code = 3
requires_proof = true
proof_circuit = "RemoveCollateralV2"

[[functions]]
name = "mint_stable"
code = 4
requires_proof = true
proof_circuit = "MintStableV2"

[[functions]]
name = "repay_stable"
code = 5
requires_proof = true
proof_circuit = "RepayStableV2"

[[functions]]
name = "liquidate"
code = 6
requires_proof = true
proof_circuit = "LiquidateV2"

[[functions]]
name = "update_config"
code = 7

[[functions]]
name = "governance_report"
code = 8
requires_proof = true
proof_circuit = "GovernanceReportV2"

[[functions]]
name = "accrue_interest"
code = 9
requires_proof = true
proof_circuit = "AccrueInterestV2"

[[functions]]
name = "redeem_stable"
code = 10
requires_proof = true
proof_circuit = "RedeemStable_V1"

[[functions]]
name = "spend_hook_callback"
code = 11

[[trees]]
name = "info"

[[trees]]
name = "positions"

[[trees]]
name = "position_nullifiers"

[[trees]]
name = "stablecoin"

[[trees]]
name = "collateral"

[[trees]]
name = "liquidations"

[[trees]]
name = "governance_reports"

# V2 circuits (HAZOP RC3: domain separation)
[[circuits]]
name = "InitV2"
namespace = "stablecoin"

