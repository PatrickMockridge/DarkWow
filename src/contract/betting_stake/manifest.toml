[contract]
name = "betting_stake"
category = "Finance"
description = "Betting stake — initialize staking registry, stake, unstake, claim earnings, update risk."
version = "1.0.0"
dependencies = ["promissory_note", "native_token_v1"]

[[functions]]
name = "initialize"
code = 0
requires_proof = true
proof_circuit = "InitV2"

[[functions]]
name = "stake"
code = 1
requires_proof = true
proof_circuit = "StakeV2"

[[functions]]
name = "unstake"
code = 2
requires_proof = true
proof_circuit = "UnstakeV2"

[[functions]]
name = "claim_earnings"
code = 3
requires_proof = true
proof_circuit = "ClaimV2"

[[functions]]
name = "update_risk"
code = 4
requires_proof = true
proof_circuit = "UpdateRiskV2"

[[capabilities]]
discriminant = 0
name = "staker"
description = "Active staker"

[[trees]]
name = "staking_registry"

[[trees]]
name = "staking_stakes"

[[trees]]
name = "staking_earnings"

[[trees]]
name = "info"

[[circuits]]
name = "InitV2"
namespace = "betting_stake"

[[circuits]]
name = "StakeV2"
namespace = "betting_stake"

[[circuits]]
name = "UnstakeV2"
namespace = "betting_stake"

[[circuits]]
name = "ClaimV2"
namespace = "betting_stake"

[[circuits]]
name = "UpdateRiskV2"
namespace = "betting_stake"
