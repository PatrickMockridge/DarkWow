[package]
name = "dwow_insurance_market_contract"
version = "0.1.0"
edition = "2021"
authors = ["DarkFi Developers"]
license = "AGPL-3.0"

[lib]
name = "dwow_insurance_market_contract"
crate-type = ["lib", "cdylib"]

[dependencies]
dwow-sdk = { path = "../../sdk", features = ["wasm"] }
dwow-serial = { path = "../../serial", features = ["derive", "crypto"] }
thiserror = "1.0"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

dwow = { path = "../../../", features = ["zk"], optional = true }
halo2_proofs = { version = "0.3.2", optional = true }

[features]
default = []
no-entrypoint = []
client = [
    "dwow",
    "dwow-serial/async",
    "halo2_proofs",
]