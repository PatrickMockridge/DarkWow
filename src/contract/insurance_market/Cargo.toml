[package]
name = "dwow_insurance_market_contract"
version = "0.1.0"
edition = "2021"
authors = ["DarkFi Developers"]
license = "AGPL-3.0"

[lib]
name = "dwow_insurance_market_contract"
crate-type = ["cdylib", "rlib"]

[dependencies]
dwow-sdk = { path = "../../sdk", features = ["wasm"] }
dwow-serial = { path = "../../serial", features = ["derive", "crypto"] }
thiserror = "1.0"
rand = "0.8"

dwow_core = { path = "../../../", features = ["zk"], optional = true }
halo2_proofs = { version = "0.3.2", optional = true }
dwow_promissory_note_contract = { version = "0.1.0", path = "../promissory_note", features = ["no-entrypoint"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[features]
default = []
no-entrypoint = []
deterministic-zk = []
client = [
    "dwow_core",
    "dwow-serial/async",
    "halo2_proofs",
]
