# Purse contract manifest — capability declarations for type construction.
# The wallet reads this manifest to construct capability types per wallet.md §2.2.
# Purse is L1: three ZK circuits, Merkle inclusion, Pedersen balance commitments.
# The wire carries what a verifier needs and no more: the public inputs, the Merkle
# path, the proof, and — for the two operations that emit one — the fields the note
# schema is filled from. `purse_id` and `state_nonce` are NOT on the wire; their
# witness slots read `note:` and the wallet serves them from its own record
# (`CapRecord.object_id`/`.state_nonce`, `bin/dww/src/lib.rs`), because `privacy.md`
# §2 promises an observer learns "not which resource was operated on" and §5.5 says
# the object id "is never a public input". The balances are the residue, blocked on
# the note's `value` type rather than on a choice: see `src/contract/purse/src/model/mod.rs`
# and `scripts/check-l1-wire-conformance.sh`, which declares each remaining slot.
# owner_secret and the Pedersen blinds stay private (wallet.md §6.4.1).
# **`Deposit` and `Withdraw` declare `public_inputs`, and they must.** Measured 2026-09-26: with
# the lists removed, `test_purse_deposit_withdraw_wallet_driven_generic_prover` fails with
# `public input references intermediate heap slot 23 (>= 22); circuits whose constrain_instance
# targets are intermediates require the manifest public_inputs declaration` — the wallet's derive
# path (`bin/dww/src/prover_impl.rs`'s `extract_instances`) reads the compiled circuit's
# `ConstrainInstance` operands and refuses any that land on an intermediate heap slot. `Balance`
# and both box circuits declare none because theirs resolve to witness slots, which is the state
# `manifest.rs`'s field doc describes as "the box/purse case" — and that sentence is wrong for
# these two (recorded for the next batch that touches `src/sdk`). An audit that reads these lists
# as redundant leftovers is reading them wrong: they are the difference between a proof that
# builds and one that verifies.

[contract]
name = "purse"
category = "Infrastructure"
version = "1.0.0"
description = "ZK fungible capability container — balance tracking with Pedersen commitments (L1)"

[[functions]]
name = "initialize"
code = 0
description = "Genesis initialization"
requires_proof = false

[[functions]]
name = "deposit"
code = 1
description = "Deposit fungible value — consumes old state, creates new Merkle leaf"
requires_proof = true
proof_circuit = "Deposit"

[[functions]]
name = "withdraw"
code = 2
description = "Withdraw fungible value — enforces bounds, consumes old state"
requires_proof = true
proof_circuit = "Withdraw"

[[functions]]
name = "balance"
code = 3
description = "Prove balance without consuming — read-only Merkle inclusion"
requires_proof = true
proof_circuit = "Balance"

[[circuits]]
name = "Deposit"
namespace = "Deposit"
witness_map = [
    "note:purse_id",
    "param:old_balance",
    "note:balance_blind",
    "param:deposit_amount",
    "blind:deposit",
    "param:new_balance",
    "derived:blind_sum:2,4",
    "note:state_nonce",
    "derived:nullifier:15,0,7",
    "merkle_root",
    "derived:leaf_increment:0,5,7,15",
    "derived:pedersen_x:1,2",
    "derived:pedersen_y:1,2",
    "derived:pedersen_x:5,6",
    "derived:pedersen_y:5,6",
    "secret",
    "derived:owner_pub:15",
    "leaf_position",
    "merkle_path",
    "tx_commitment",
    "param:tx_nonce",
    "derived:tx_binding:19,20",
    # Slots 22 and 23. `asset_id` comes from the wallet's record, so it leaves the wire.
    #
    # `derived_purse_id` is an *instance* the metadata publishes, so it must be in the call data —
    # but **the caller cannot compute it**, and that is `OBL-C180`: as a plain untagged param it was
    # required from the caller's JSON, and the only test that builds a purse deposit the way a wallet
    # does failed `missing required parameter 'derived_purse_id'`. The circuit computes it —
    # `poseidon(DOMAIN_COMMITMENT, owner_pub, asset_id, purse_id)` — and constrains it equal to the
    # instance (`deposit.zk:120-122`), so the prover binds it from the same three values:
    # slot 16 (`derived:owner_pub:15`), slot 22 (`note:asset_id`) and slot 0 (`note:purse_id`), all
    # earlier in the order, so the rule's DAG holds. The `[[parameters]]` entry keeps `witness = 23`:
    # the caller's JSON need not supply it, the client fills it from the bound value, and
    # `encode_params_values` writes it — which is what an instance requires (`OBL-C179`).
    #
    # **`balance` cannot do this and is left as a required caller param.** Its `derived_purse_id` is
    # witness slot 5 while its `owner_pub` is slot 11, so the rule would be a forward reference —
    # `prover.rs`, write-path invariant 5, refuses it. Reordering the witness section would move the
    # VK; that is a circuit change for a separate unit, not a manifest edit.
    "note:asset_id",
    "derived:purse_id:16,22,0",
]
public_inputs = [
    "slot:8",
    "slot:9",
    "slot:11",
    "slot:12",
    "slot:13",
    "slot:14",
    "slot:10",
    "slot:21",
    "slot:20",
    # The purse identity, last in the circuit's instance sequence.
    "slot:23",
]
[[circuits]]
name = "Withdraw"
namespace = "Withdraw"
witness_map = [
    "note:purse_id",
    "param:old_balance",
    "note:balance_blind",
    "param:withdraw_amount",
    "blind:withdraw",
    "param:new_balance",
    "derived:blind_sub:2,4",
    "note:state_nonce",
    "derived:nullifier:15,0,7",
    "merkle_root",
    "derived:leaf_increment:0,5,7,15",
    "derived:pedersen_x:1,2",
    "derived:pedersen_y:1,2",
    "derived:pedersen_x:5,6",
    "derived:pedersen_y:5,6",
    "secret",
    "derived:owner_pub:15",
    "leaf_position",
    "merkle_path",
    "tx_commitment",
    "param:tx_nonce",
    "derived:tx_binding:19,20",
    # Slots 22 and 23. As `Deposit` above — the same rule from the same three operands, and
    # `OBL-C180` applies identically. `withdraw.zk:118-120` is the counterpart of `deposit.zk:120-122`.
    "note:asset_id",
    "derived:purse_id:16,22,0",
]
public_inputs = [
    "slot:8",
    "slot:9",
    "slot:11",
    "slot:12",
    "slot:13",
    "slot:14",
    "slot:10",
    "slot:21",
    "slot:20",
    # The purse identity, last in the circuit's instance sequence.
    "slot:23",
]
[[circuits]]
name = "Balance"
namespace = "Balance"
witness_map = [
    "note:purse_id",
    "note:asset_id",
    "note:value",
    "note:balance_blind",
    "note:state_nonce",
    "param:derived_purse_id",
    "param:expected_root",
    "param:token_commit",
    "param:balance_commit_x",
    "param:balance_commit_y",
    "secret",
    "derived:owner_pub:10",
    "note:token_blind",
    "leaf_position",
    "merkle_path",
    "tx_commitment",
    "param:tx_nonce",
    "param:tx_binding",
]

[[parameters]]
function = "deposit"
fields = [
    { name = "old_balance", type = "u64" },
    { name = "deposit_amount", type = "u64" },
    { name = "new_balance", type = "u64" },
    { name = "nullifier", type = "pallas_base", witness = 8 },
    { name = "expected_root", type = "pallas_base", witness = 9 },
    { name = "new_leaf", type = "pallas_base", witness = 10, leaf = true },
    { name = "old_commit_x", type = "pallas_base", witness = 11 },
    { name = "old_commit_y", type = "pallas_base", witness = 12 },
    { name = "new_commit_x", type = "pallas_base", witness = 13 },
    { name = "new_commit_y", type = "pallas_base", witness = 14 },
    { name = "leaf_pos", type = "u32", witness = 17 },
    { name = "merkle_path", type = "merkle_path", witness = 18 },
    { name = "proof", type = "proof" },
    { name = "tx_binding", type = "pallas_base", witness = 21 },
    { name = "tx_nonce", type = "pallas_base" },
    # `asset_id` was here, on the wire and undeclared by `scripts/check-l1-wire-conformance.sh` — its
    # rule covers witness-map `param:` slots, and a plain params field is invisible to it. It is slot 22
    # in the witness map now and travels in no call data.
    #
    # `derived_purse_id` takes its place as the final field: a one-way function of the purse id, which
    # is the only form `privacy.md` §5.5 permits to be public, and what lets a parent require a deposit
    # into a named purse. **`witness = 23`** — it is an instance and must be published, but the caller
    # cannot compute it; the client fills it from the prover's slot 23 and the encoder writes it. See
    # the `witness_map` note for why that slot is `derived:purse_id:16,22,0` and not `param:`.
    { name = "derived_purse_id", type = "pallas_base", witness = 23 },
]

[[parameters]]
function = "withdraw"
fields = [
    { name = "old_balance", type = "u64" },
    { name = "withdraw_amount", type = "u64" },
    { name = "new_balance", type = "u64" },
    { name = "nullifier", type = "pallas_base", witness = 8 },
    { name = "expected_root", type = "pallas_base", witness = 9 },
    { name = "new_leaf", type = "pallas_base", witness = 10, leaf = true },
    { name = "old_commit_x", type = "pallas_base", witness = 11 },
    { name = "old_commit_y", type = "pallas_base", witness = 12 },
    { name = "new_commit_x", type = "pallas_base", witness = 13 },
    { name = "new_commit_y", type = "pallas_base", witness = 14 },
    { name = "leaf_pos", type = "u32", witness = 17 },
    { name = "merkle_path", type = "merkle_path", witness = 18 },
    { name = "proof", type = "proof" },
    { name = "tx_binding", type = "pallas_base", witness = 21 },
    { name = "tx_nonce", type = "pallas_base" },
    # `asset_id` was here, on the wire and undeclared by `scripts/check-l1-wire-conformance.sh` — its
    # rule covers witness-map `param:` slots, and a plain params field is invisible to it. It is slot 22
    # in the witness map now and travels in no call data.
    #
    # `derived_purse_id` takes its place as the final field: a one-way function of the purse id, which
    # is the only form `privacy.md` §5.5 permits to be public, and what lets a parent require a deposit
    # into a named purse. **`witness = 23`**, as `deposit`'s — see that entry's note.
    { name = "derived_purse_id", type = "pallas_base", witness = 23 },
]

[[parameters]]
function = "balance"
fields = [
    { name = "derived_purse_id", type = "pallas_base" },
    { name = "expected_root", type = "pallas_base" },
    { name = "token_commit", type = "pallas_base" },
    { name = "balance_commit_x", type = "pallas_base" },
    { name = "balance_commit_y", type = "pallas_base" },
    { name = "leaf_pos", type = "u32", witness = 13 },
    { name = "merkle_path", type = "merkle_path", witness = 14 },
    { name = "proof", type = "proof" },
    { name = "tx_binding", type = "pallas_base" },
    { name = "tx_nonce", type = "pallas_base" },
]

[[trees]]
name = "nullifiers"
description = "Spent nullifier records"

[[trees]]
name = "purse_roots"
description = "Historical Merkle roots for inclusion proofs"

[[trees]]
name = "info"
description = "Merkle tree state and root pointers"

[[capabilities]]
name = "purse_capability"
discriminant = 0
primitives = ["SecretKey", "Commitment", "Nullifier", "MerkleNode", "ContractId", "FuncId", "AssetId"]
note_schema = [
    { name = "asset_id", type = "pallas_base", witness = 22 },
    { name = "value", type = "u64", source = "new_balance" },
    { name = "balance_blind", type = "pallas_scalar", witness = 6 },
    { name = "commitment", type = "pallas_base", witness = 10 },
    { name = "purse_id", type = "pallas_base", witness = 0 },
    { name = "state_nonce", type = "pallas_base", derived = "increment:7" },
]

[[actions]]
function = "deposit"
required_barbs = ["Spend", "Nullify", "ProveInclusion", "Commit", "Dispatch", "Gate"]
consumes = ["purse_capability"]
produces = [{ name = "purse_capability" }]

[[actions]]
function = "withdraw"
required_barbs = ["Spend", "Nullify", "ProveInclusion", "Commit", "Dispatch", "Gate"]
consumes = ["purse_capability"]
produces = [{ name = "purse_capability" }]

[[actions]]
function = "balance"
requires = { type = "any", capabilities = ["purse_capability"] }
required_barbs = ["Spend", "ProveInclusion", "Dispatch", "Gate"]
