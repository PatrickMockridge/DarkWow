[contract]
name = "purse"
category = "Asset"
description = "ZK fungible asset container — DarkWow equivalent of Agoric ERTP Purse. Deposit, withdraw, and balance operations with hidden balances (Pedersen) and hidden token types (Poseidon)."
genesis_inclusion_reason = "O-Cap primitive — the fungible asset container that all token balances are measured in. Every wallet depends on it for balance tracking."
version = "1.0.0"

[[functions]]
name = "deposit"
code = 1
description = "Deposit tokens into a Purse. Proves old_balance + deposit == new_balance via Pedersen additive homomorphism."

[[functions]]
name = "withdraw"
code = 2
description = "Withdraw tokens from a Purse. Constrains withdraw_amount <= old_balance. Nullifier prevents replay."

[[functions]]
name = "balance"
code = 3
description = "Prove knowledge of Purse ownership and balance. Exposes balance_commit for predicate checks by other contracts."

[[capabilities]]
discriminant = 0
name = "purse_balance"
description = "Hidden balance via Pedersen commitment. Non-consumable."

[[capabilities]]
discriminant = 1
name = "purse_withdrawal"
description = "Withdrawal right from a purse. Consumable."

[[actions]]
function = "deposit"
requires = []
produces = ["purse_balance"]
consumes = []

[[actions]]
function = "withdraw"
requires = ["purse_balance"]
produces = ["purse_balance"]
consumes = ["purse_withdrawal"]

[[actions]]
function = "balance"
requires = ["purse_balance"]
produces = []
consumes = []
