[contract]
name = "escrow"
category = "Finance"
description = "Simple escrow contract — create, fund, claim, refund. Timeout-based refund protection."
version = "2.0.0"
dependencies = ["promissory_note", "native_token_v1"]

[[functions]]
name = "initialize"
code = 0

[[functions]]
name = "create_escrow"
code = 1
requires_proof = true
proof_circuit = "CreateEscrowV2"

[[functions]]
name = "fund"
code = 2
requires_proof = true
proof_circuit = "FundEscrowV2"

[[functions]]
name = "claim"
code = 3
requires_proof = true
proof_circuit = "ClaimEscrowV2"

[[functions]]
name = "refund"
code = 4
requires_proof = true
proof_circuit = "RefundEscrowV2"

[[functions]]
name = "cancel"
code = 5
requires_proof = true
proof_circuit = "CancelEscrowV2"

[[capabilities]]
discriminant = 0
name = "creator"
description = "Escrow creator"

[[capabilities]]
discriminant = 1
name = "counterparty"
description = "Escrow counterparty"

[[trees]]
name = "info"

[[trees]]
name = "escrows"

[[trees]]
name = "nullifiers"

[[trees]]
name = "spent_flags"

[[circuits]]
name = "CreateEscrowV2"
namespace = "escrow"

[[circuits]]
name = "FundEscrowV2"
namespace = "escrow"

[[circuits]]
name = "ClaimEscrowV2"
namespace = "escrow"

[[circuits]]
name = "RefundEscrowV2"
namespace = "escrow"

[[circuits]]
name = "CancelEscrowV2"
namespace = "escrow"
