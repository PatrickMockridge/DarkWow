[package]
name = "dwow-safemath-zk-proof-harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "Portable DarkFi proof harness for dwow-safemath-zk"

[lib]
path = "src/lib.rs"

[dependencies]
dwow-safemath-zk = { path = ".." }

[dev-dependencies]
dwow_engine = { package = "dwow", git = "https://codeberg.org/darkrenaissance/darkfi", rev = "bbcfa2f33bba31c92e72a70ba3992ef1147723d2", default-features = false, features = ["zk", "zkas"] }
halo2_proofs = "0.3.2"

[patch.crates-io]
halo2_proofs = { git = "https://github.com/parazyd/halo2", branch = "v032" }
halo2_gadgets = { git = "https://github.com/parazyd/halo2", branch = "v032" }
