[contract]
name = "game_room"
category = "Gaming"
description = "Multi-game room — create room, deposit, bet, raise, call, fold, settle pot, claim."
version = "2.0.0"
dependencies = ["promissory_note", "native_token_v1"]

[[functions]]
name = "create_room"
code = 0
requires_proof = true
proof_circuit = "CreateRoomV2"

[[functions]]
name = "deposit"
code = 1
requires_proof = true
proof_circuit = "DepositV2"

[[functions]]
name = "withdraw"
code = 2
requires_proof = true
proof_circuit = "WithdrawV2"

[[functions]]
name = "place_bet"
code = 3
requires_proof = true
proof_circuit = "PlaceBetV2"

[[functions]]
name = "raise"
code = 4
requires_proof = true
proof_circuit = "RaiseV2"

[[functions]]
name = "call"
code = 5
requires_proof = true
proof_circuit = "CallV2"

[[functions]]
name = "fold"
code = 6
requires_proof = true
proof_circuit = "FoldV2"

[[functions]]
name = "close_pot"
code = 7
requires_proof = true
proof_circuit = "ClosePotV2"

[[functions]]
name = "settle_pot"
code = 8
requires_proof = true
proof_circuit = "SettlePotV2"

[[functions]]
name = "contribute_entropy"
code = 9
requires_proof = true
proof_circuit = "ContributeEntropyV2"

[[functions]]
name = "claim"
code = 10
requires_proof = true
proof_circuit = "ClaimV2"

[[functions]]
name = "create_pot"
code = 11
requires_proof = true
proof_circuit = "CreatePotV2"

[[capabilities]]
discriminant = 0
name = "host"
description = "Room host"

[[capabilities]]
discriminant = 1
name = "player"
description = "Room player"

[[trees]]
name = "info"

[[trees]]
name = "game_room_rooms"

[[trees]]
name = "game_room_accounts"

[[trees]]
name = "game_room_pots"

[[trees]]
name = "game_room_bets"

[[trees]]
name = "game_room_nullifiers"

[[trees]]
name = "game_room_entropy"

# V2 circuits (HAZOP RC3: domain separation)
[[circuits]]
name = "CreateRoomV2"
namespace = "game_room"

[[circuits]]
name = "DepositV2"
namespace = "game_room"

[[circuits]]
name = "PlaceBetV2"
namespace = "game_room"

[[circuits]]
name = "SettlePotV2"
namespace = "game_room"

[[circuits]]
name = "ClaimV2"
namespace = "game_room"

[[circuits]]
name = "CallV2"
namespace = "game_room"

[[circuits]]
name = "ClosePotV2"
namespace = "game_room"

[[circuits]]
name = "ContributeEntropyV2"
namespace = "game_room"

[[circuits]]
name = "FoldV2"
namespace = "game_room"

[[circuits]]
name = "RaiseV2"
namespace = "game_room"

[[circuits]]
name = "WithdrawV2"
namespace = "game_room"

[[circuits]]
name = "CreatePotV2"
namespace = "game_room"
