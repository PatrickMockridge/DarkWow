[contract]
name = "lottery"
category = "Gaming"
description = "On-chain lottery — buy tickets, draw winners, reveal, claim prizes."
version = "2.0.0"
dependencies = ["promissory_note", "native_token_v1"]

[[functions]]
name = "initialize"
code = 0

[[functions]]
name = "buy_ticket"
code = 1
requires_proof = true
proof_circuit = "CommitTicketV2"

[[functions]]
name = "draw_winners"
code = 2

[[functions]]
name = "reveal_ticket"
code = 3
requires_proof = true
proof_circuit = "RevealTicketV2"

[[functions]]
name = "claim_prize"
code = 4

[[functions]]
name = "expire_lottery"
code = 5

[[capabilities]]
discriminant = 0
name = "operator"
description = "Lottery operator"

[[capabilities]]
discriminant = 1
name = "ticket_holder"
description = "Ticket holder"

[[trees]]
name = "lotteries"

[[trees]]
name = "tickets"

[[trees]]
name = "nullifiers"

[[trees]]
name = "claims"

[[trees]]
name = "tickets_smt"

[[trees]]
name = "tickets_roots"

[[trees]]
name = "info"

[[circuits]]
name = "CommitTicketV2"
namespace = "lottery"

[[circuits]]
name = "RevealTicketV2"
namespace = "lottery"

# `InitializeV2` was listed here with the note "Registered by `init_contract`, but absent from this
# list" — and it is now absent from the tree too. It was deleted on 2026-09-24, not declared away: its
# circuit binds the exposed nullifier to a `lottery_id` the contract *derives from the exec-time block
# height* (`entrypoint/initialize.rs:57`), so no caller can know the id when it builds the call, and a
# proof against it could only bind to a lottery the contract never created. `initialize` stays a
# non-ZK setup step, which is what the `[[functions]]` entry above already says by omitting
# `requires_proof`.

[[circuits]]
name = "DrawWinnersV2"
namespace = "lottery"

[[circuits]]
name = "ClaimPrizeV2"
namespace = "lottery"

[[circuits]]
name = "ExpireLotteryV2"
namespace = "lottery"
