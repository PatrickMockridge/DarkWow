[contract]
name = "multisig"
category = "Governance"
description = "Threshold signature factory — create N-of-M groups, collect partial signatures, produce approval capabilities. Genesis primitive for multi-party authorization."
genesis_inclusion_reason = "O-Cap primitive — threshold signature authorization. Enables N-of-M multi-sig for any contract that composes with approval capabilities. Extracted from duplicated threshold logic in DAO-Escrow and DrainProtection."
version = "1.0.0"

[[functions]]
name = "create_group"
code = 1
description = "Create an N-of-M threshold signature group. Takes list of public keys and required threshold. Produces group_capability."

[[functions]]
name = "sign"
code = 2
description = "Sign a message as a group member. Proves membership via public key in group. Produces partial_signature capability."

[[functions]]
name = "finalize"
code = 3
description = "Finalize when threshold partial signatures exist for a message. Consumes partial signatures, produces approval capability for composition."

[[capabilities]]
discriminant = 0
name = "group_membership"
description = "Membership in an N-of-M signing group. Non-consumable."

[[capabilities]]
discriminant = 1
name = "partial_signature"
description = "A partial Schnorr signature. Consumable on finalize."

[[capabilities]]
discriminant = 2
name = "approval"
description = "Threshold approval (>= N signatures collected). Produced by finalize."

[[actions]]
function = "create_group"
requires = []
produces = ["group_membership"]
consumes = []

[[actions]]
function = "sign"
requires = ["group_membership"]
produces = ["partial_signature"]
consumes = []

[[actions]]
function = "finalize"
requires = ["partial_signature"]
produces = ["approval"]
consumes = ["partial_signature"]
