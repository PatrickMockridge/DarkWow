[contract]
name = "promissory_note"
category = "Token"
description = "Universal DeFi primitive — ERC-20 style token creation, private transfers, OTC swaps, and redemption. Genesis-deployed as ecosystem infrastructure."
version = "1.0.0"
dependencies = ["native_token_v1"]
genesis_inclusion_reason = "Universal DeFi dependency — not consensus-critical"

# ============================================================================
# Functions
# ============================================================================

[[functions]]
name = "register_type"
code = 0
description = "Create a new token type with mint authority. TokenId is derived from auth_parent, user_data, and blind."
requires_proof = true
proof_circuit = "RegisterTypeV2"

[[functions]]
name = "redeem"
code = 1
description = "Redeem a coin via RedeemV1 — destroys monetary value, creates zero-value receipt coin as cryptographic proof of redemption."
requires_proof = true
proof_circuit = "RedeemV2"

[[functions]]
name = "issue"
code = 2
description = "Mint new coins of an existing token. Requires mint authority — the caller must prove knowledge of the mint_secret matching the token's stored auth_parent."
requires_proof = true
proof_circuit = "IssueV2"

[[functions]]
name = "revoke"
code = 3
description = "Burn coins via BurnV1 — publishes nullifiers to prevent double-spending. Supports spend_hook dispatch to target contracts."
requires_proof = true
proof_circuit = "RevokeV2"

[[functions]]
name = "transfer"
code = 4
description = "Atomic burn-and-blind-output via TransferV1. Burns input coins, creates new blind outputs. Enforces value conservation per token_commit."
requires_proof = true
proof_circuit = "TransferV2"

[[functions]]
name = "otc_swap"
code = 5
description = "Peer-to-peer atomic swap via OtcSwapV1. Exactly 2 inputs and 2 outputs. Both parties must sign."
requires_proof = true
proof_circuit = "TransferV2"

# ============================================================================
# Capabilities
# ============================================================================

[[capabilities]]
discriminant = 0
name = "coin"
description = "An unspent coin in the wallet — can be spent via burn, transfer, or redeem. Consumable."
primitives = ["SecretKey","Commitment","Nullifier","ContractId","FuncId","AssetId","MerkleNode"]
note_schema = [
    { name = "value", type = "u64" },
    { name = "token_id", type = "token_id" },
    { name = "spend_hook", type = "func_id" },
    { name = "user_data", type = "pallas_base" },
    { name = "coin_blind", type = "pallas_base" },
    { name = "value_blind", type = "pallas_scalar" },
    { name = "token_blind", type = "pallas_base" },
    { name = "memo", type = "bytes" },
]

[[capabilities]]
discriminant = 1
name = "mint_authority"
description = "Knowledge of the mint_secret for a specific token_id — allows minting new coins of that token. Non-consumable."
primitives = ["SecretKey","Commitment","Nullifier","ContractId","FuncId","AssetId"]

[[capabilities]]
discriminant = 2
name = "receipt"
description = "A zero-value receipt coin from RedeemV1 — cryptographic proof of redemption. Non-transferable, non-consumable."
primitives = ["SecretKey","Commitment","Nullifier","ContractId","FuncId","AssetId","MerkleNode"]
note_schema = [
    { name = "value", type = "u64" },
    { name = "token_id", type = "token_id" },
    { name = "spend_hook", type = "func_id" },
    { name = "user_data", type = "pallas_base" },
    { name = "coin_blind", type = "pallas_base" },
    { name = "value_blind", type = "pallas_scalar" },
    { name = "token_blind", type = "pallas_base" },
    { name = "memo", type = "bytes" },
]

# ============================================================================
# Actions
# ============================================================================

[[actions]]
function = "register_type"
requires = { type = "none" }
consumes = []
produces = [{ name = "mint_authority", description = "Mint authority for the newly created token" }]
required_barbs = ["Spend","Nullify","Commit","Dispatch","Gate","Denominate"]

[[actions]]
function = "issue"
requires = { type = "all", capabilities = ["mint_authority"] }
consumes = []
produces = [{ name = "coin", description = "Newly minted coins" }]
required_barbs = ["Spend","Nullify","Commit","Dispatch","Gate","Denominate"]

[[actions]]
function = "revoke"
requires = { type = "any", capabilities = ["coin"] }
consumes = ["coin"]
produces = []
required_barbs = ["Spend","Nullify","Commit","Dispatch","Gate","Denominate"]

[[actions]]
function = "transfer"
requires = { type = "any", capabilities = ["coin"] }
consumes = ["coin"]
produces = [{ name = "coin", description = "New blind output coins" }]
required_barbs = ["Spend","Nullify","Commit","Dispatch","Gate","Denominate"]

[[actions]]
function = "redeem"
requires = { type = "any", capabilities = ["coin"] }
consumes = ["coin"]
produces = [{ name = "receipt", description = "Zero-value receipt coin — proof of redemption" }]
required_barbs = ["Spend","Nullify","Commit","Dispatch","Gate","Denominate"]

[[actions]]
function = "otc_swap"
requires = { type = "any", capabilities = ["coin"] }
consumes = ["coin"]
produces = [{ name = "coin", description = "New blind output coins for both swap parties" }]
required_barbs = ["Spend","Nullify","Commit","Dispatch","Gate","Denominate"]

# ============================================================================
# State Trees
# ============================================================================

[[trees]]
name = "coins"
description = "Coin commitment Merkle tree — stores coin commitments for spend verification"

[[trees]]
name = "nullifiers"
description = "Flat nullifier markers (db_mark_spent) — prevents double-spending; no SMT per §9.2"

[[trees]]
name = "info"
description = "Contract metadata — version, genesis root, total supply, latest roots"

[[trees]]
name = "coin_roots"
description = "Historical coin tree roots indexed by block height"

[[trees]]
name = "nullifier_roots"
description = "Historical nullifier tree roots indexed by block height"

[[trees]]
name = "token_registry"
description = "Token registry — maps token_id to token metadata and mint authority"

[[trees]]
name = "token_registry_roots"
description = "Historical token registry tree roots indexed by block height"

# ============================================================================
# ZK Circuits
# ============================================================================

[[circuits]]
name = "RegisterTypeV2"
namespace = "promissory_note"

[[circuits]]
name = "RedeemV2"
namespace = "promissory_note"

[[circuits]]
name = "IssueV2"
namespace = "promissory_note"

[[circuits]]
name = "RevokeV2"
namespace = "promissory_note"

[[circuits]]
name = "TransferV2"
namespace = "promissory_note"

# ============================================================================
# Parameters
# ============================================================================

[[parameters]]
function = "register_type"
fields = [
    { name = "mint_public", type = "public_key" },
    { name = "user_data", type = "pallas_base" },
    { name = "token_blind", type = "pallas_base" },
]

[[parameters]]
function = "issue"
fields = [
    { name = "token_id", type = "pallas_base" },
    { name = "value", type = "u64" },
    { name = "recipient", type = "public_key" },
    { name = "spend_hook", type = "pallas_base", optional = true },
    { name = "user_data", type = "pallas_base", optional = true },
]

[[parameters]]
function = "transfer"
fields = [
    { name = "amount", type = "u64" },
    { name = "token_id", type = "pallas_base" },
    { name = "recipient", type = "public_key" },
    { name = "spend_hook", type = "pallas_base", optional = true },
    { name = "user_data", type = "pallas_base", optional = true },
]

[[parameters]]
function = "revoke"
fields = [
    { name = "coin_ids", type = "pallas_base" },  # variable length
]

[[parameters]]
function = "redeem"
fields = [
    { name = "coin_id", type = "pallas_base" },
    { name = "spend_hook", type = "pallas_base", optional = true },
]

[[parameters]]
function = "otc_swap"
fields = [
    { name = "our_swap", type = "bytes" },    # PartialSwapData JSON
    { name = "their_swap", type = "bytes" },  # PartialSwapData JSON
]
