[package]
name = "dwow_slot_contract"
version = "0.1.0"
edition = "2021"
authors = ["DarkFi contributors"]
description = "DarkFi Composable Slot Machine Contract - Modular slot game with extensible paytables"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dwow-sdk = { path = "../../sdk", features = ["wasm"] }
dwow-serial = { path = "../../serial", features = ["derive", "crypto"] }
pasta_curves = "0.5.1"
thiserror = "2.0.17"

dwow_core = { path = "../../../", features = ["zk"], optional = true }
chacha20poly1305 = { version = "0.10.1", optional = true }
halo2_proofs = { version = "0.3.2", optional = true }
tracing = { version = "0.1.44", optional = true }
rand = { version = "0.8.5", optional = true }
dwow_money_v3_contract = { version = "0.1.0", path = "../money_v3", features = ["no-entrypoint"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[features]
default = []
no-entrypoint = []
client = [
    "dwow_core",
    "dwow-serial/async",
    "rand",
    "chacha20poly1305",
    "tracing",
    "halo2_proofs",
]

[lints]
workspace = true
