[package]
name = "darkfi_slot_contract"
version = "0.1.0"
edition = "2021"
authors = ["DarkFi contributors"]
description = "DarkFi Composable Slot Machine Contract - Modular slot game with extensible paytables"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
darkfi-sdk = { path = "../../sdk", features = ["wasm"] }
darkfi-serial = { path = "../../serial", features = ["derive", "crypto"] }
pasta_curves = "0.5.1"
thiserror = "2.0.17"

[features]
default = []
no-entrypoint = []

[lints]
workspace = true