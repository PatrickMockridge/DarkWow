[package]
name = "darkfi-contract-test-harness"
version = "0.5.0"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
license = "AGPL-3.0-only"
edition = "2021"

[dependencies]
darkfi = {path = "../../../", features = ["zk"]}
darkfi-sdk = {path = "../../sdk"}
darkfi-serial = {path = "../../serial", features = ["crypto"]}
darkfi_native_token_contract = {path = "../native_token", features = ["client", "no-entrypoint"]}

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt"] }
rand = "0.8.5"

[[bin]]
name = "test_native_token"
path = "src/native_token.rs"

[lints]
workspace = true