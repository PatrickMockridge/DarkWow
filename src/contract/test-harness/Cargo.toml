[package]
name = "darkfi-contract-test-harness"
version = "0.5.0"
authors = ["Dyne.org foundation <foundation@dyne.org>"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
darkfi = {path = "../../../", features = ["zk"]}
darkfi-sdk = {path = "../../sdk"}
darkfi-serial = {path = "../../serial", features = ["crypto"]}
darkfi_native_token_contract = {path = "../native_token", features = ["client", "no-entrypoint"]}
darkfi_money_v3_contract = {path = "../money_v3", features = ["client", "no-entrypoint"]}
darkfi_deployooor_contract = {path = "../deployooor", features = ["client", "no-entrypoint"]}
darkfi_dex_contract = {path = "../dex", features = ["client", "no-entrypoint"]}
atomic_swap_contract = {path = "../atomic_swap", features = ["client", "no-entrypoint"]}
darkfi_oracle_contract = {path = "../oracle", features = ["client", "no-entrypoint"]}
darkfi_stablecoin_contract = {path = "../stablecoin", features = ["client", "no-entrypoint"]}
darkfi_auction_contract = {path = "../auction", features = ["client", "no-entrypoint"]}
subscription_contract = {path = "../subscription", features = ["client"]}
darkfi_tender_contract = {path = "../tender", features = ["client", "no-entrypoint"]}
darkfi_bridge_contract = {path = "../bridge", features = ["client", "no-entrypoint"]}
darkfi_attestation_contract = {path = "../attestation", features = ["client", "no-entrypoint"]}
darkfi-identity-contract = {path = "../identity", features = ["client", "no-entrypoint"]}
darkfi_escrow_contract = {path = "../escrow", features = ["client", "no-entrypoint"]}
darkfi_labor_market_contract = {path = "../labor_market", features = ["client", "no-entrypoint"]}
darkfi_dao_escrow_contract = {path = "../dao_escrow", features = ["client", "no-entrypoint"]}
darkfi_darkbet_exchange_contract = {path = "../darkbet_exchange", features = ["client", "no-entrypoint"]}
darkfi_baccarat_contract = {path = "../baccarat", features = ["client", "no-entrypoint"]}
darkfi_pool_stake_contract = {path = "../pool_stake", features = ["client", "no-entrypoint"]}
darkfi_roulette_contract = {path = "../roulette", features = ["client", "no-entrypoint"]}
darkfi_darktoshi_dice_contract = {path = "../darktoshi_dice", features = ["client", "no-entrypoint"]}
darkfi_slot_contract = {path = "../slot", features = ["client", "no-entrypoint"]}

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt"] }
rand = "0.8.5"

[[bin]]
name = "test_native_token"
path = "src/native_token.rs"

[[bin]]
name = "test_deployooor"
path = "src/deployooor.rs"

[lints]
workspace = true