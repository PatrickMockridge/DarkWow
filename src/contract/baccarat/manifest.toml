[contract]
name = "baccarat"
category = "Gaming"
description = "On-chain baccarat — commit bet, draw cards, settle, house close."
version = "1.0.0"
dependencies = ["promissory_note", "native_token_v1"]

[[functions]]
name = "initialize"
code = 0

[[functions]]
name = "commit_bet"
code = 1
requires_proof = true
proof_circuit = "CommitBet_V2"

[[functions]]
name = "draw_cards"
code = 2
requires_proof = true
proof_circuit = "DrawCards_V2"

[[functions]]
name = "settle_bet"
code = 3
requires_proof = true
proof_circuit = "SettleBet_V2"

[[functions]]
name = "house_close"
code = 4
requires_proof = true
proof_circuit = "HouseClose_V2"

[[capabilities]]
discriminant = 0
name = "player"
description = "Baccarat player"

[[capabilities]]
discriminant = 1
name = "banker"
description = "House banker"

[[trees]]
name = "bets"

[[trees]]
name = "nullifiers"

[[trees]]
name = "info"

[[trees]]
name = "house"

[[circuits]]
name = "CommitBet_V2"
namespace = "baccarat"

[[circuits]]
name = "SettleBet_V2"
namespace = "baccarat"

# Registered by `init_contract` and emitted by get_metadata, but absent from
# this list. Note baccarat names its circuits `X_V2` while every other contract
# uses `XV2`; the names here are the ones the circuits actually declare.
[[circuits]]
name = "DrawCards_V2"
namespace = "baccarat"

[[circuits]]
name = "HouseClose_V2"
namespace = "baccarat"
