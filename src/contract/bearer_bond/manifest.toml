[contract]
name = "bearer_bond"
category = "Finance"
description = "Bearer bond contract — bond issuance, staking and transfers; the issuer-authority arms (issue, interest, coverage) are refused until an authority model exists (OBL-C248/C275/C276)."
version = "1.0.0"
dependencies = ["promissory_note", "native_token_v1"]

[[functions]]
name = "issue_stake"
code = 0
requires_proof = true
proof_circuit = "BlindOutput_V2"
description = "Refused: the series issuer is a caller-supplied ContractId with no proof of control (AuthorityModelUnavailable, OBL-C275)."

[[functions]]
name = "transfer_stake"
code = 1
requires_proof = true
proof_circuit = "BlindOutput_V2"

[[functions]]
name = "request_interest"
code = 2
requires_proof = true
proof_circuit = "Burn_V2"
description = "Refused: total_staked is never updated, so interest computes against zero (AuthorityModelUnavailable, OBL-C276)."

[[functions]]
name = "emergency_unstake"
code = 3
requires_proof = true
proof_circuit = "Redeem_V2"

[[functions]]
name = "unstake"
code = 4
requires_proof = true
proof_circuit = "Redeem_V2"

[[functions]]
name = "burn_stake"
code = 5
requires_proof = true
proof_circuit = "Burn_V2"

[[functions]]
name = "prove_coverage"
code = 6
requires_proof = true
proof_circuit = "ProveCoverage_V2"
description = "Refused: the report is unauthenticated; any caller could post it and void a series (AuthorityModelUnavailable, OBL-C248)."

[[functions]]
name = "verify_coverage"
code = 7

[[functions]]
name = "pay_interest"
code = 8
requires_proof = true
proof_circuit = "BlindOutput_V2"

[[functions]]
name = "register_series"
code = 9

[[capabilities]]
discriminant = 0
name = "bond_holder"
description = "Bearer bond holder"

[[trees]]
name = "commitment_set"

[[trees]]
name = "nullifiers"

[[trees]]
name = "commitment_merkle"

[[trees]]
name = "info"

[[trees]]
name = "commitment_roots"

[[trees]]
name = "nullifier_roots"

[[trees]]
name = "bonds_info"

[[circuits]]
name = "Burn_V2"
namespace = "bearer_bond"

[[circuits]]
name = "BlindOutput_V2"
namespace = "bearer_bond"

[[circuits]]
name = "Redeem_V2"
namespace = "bearer_bond"

[[circuits]]
name = "ProveCoverage_V2"
namespace = "bearer_bond"
