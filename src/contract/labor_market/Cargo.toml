[package]
name = "dwow_labor_market_contract"
version = "0.1.0"
edition = "2021"
authors = ["DarkFi contributors"]
description = "DarkFi Labor Market Contract - Token-curated registry of service providers"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.8.2"
dwow-sdk = { path = "../../sdk", features = ["wasm"] }
dwow-serial = { path = "../../serial", features = ["derive", "crypto"] }
thiserror = "2.0.17"

dwow_core = { path = "../../../", features = ["zk"], optional = true }
chacha20poly1305 = { version = "0.10.1", optional = true }
halo2_proofs = { version = "0.3.2", optional = true }
tracing = { version = "0.1.44", optional = true }
rand = { version = "0.8.5", optional = true }

lazy_static = "1.5.0"
dwow_promissory_note_contract = { version = "0.1.0", path = "../promissory_note", features = ["no-entrypoint"] }
# Typed access to `CheckAttestationParamsV1`, which `create_job_v1` requires as a child call so that
# the job's `attestation_id` names a real, active attestation (`OBL-Z16`). Same shape as the
# promissory_note dependency above: no entrypoint, model and call types only.
dwow_attestation_contract = { version = "0.1.0", path = "../attestation", features = ["no-entrypoint"] }
# Typed access to `VerifyCapabilityParams`, which `accept_job_with_capability_v1` decodes to bind the
# credential the child proved to the capability the job requires (`OBL-C186`). The same
# `no-entrypoint` shape as the two above.
#
# **This line was missing, and the omission was invisible to `cargo check`.** The handler referenced
# `dwow_identity_contract::model::VerifyCapabilityParams` while the crate declared no such dependency,
# and `cargo check -p dwow_labor_market_contract` passed anyway — the host-target check resolved it
# through workspace feature unification, while `make … all` (the wasm target, which is what actually
# ships) failed `error[E0433]: cannot find module or crate dwow_identity_contract`. A check that is not
# the build is not evidence the build works.
dwow_identity_contract = { version = "0.1.0", path = "../identity", features = ["no-entrypoint"] }

[dev-dependencies]
smol = "2.0.2"
dwow-contract-test-harness = {path = "../test-harness"}

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.8", features = ["custom"] }
dwow-sdk = { path = "../../sdk", features = ["wasm"] }

[features]
default = []
no-entrypoint = []
deterministic-zk = []
client = [
    "dwow_core",
    "dwow-serial/async",
    "rand",
    "chacha20poly1305",
    "tracing",
    "halo2_proofs",
]

[lints]
workspace = true
