# FYI manifest — no capability descriptor (wallet uses generic AEAD discovery)

[contract]
name = "labor_market"
category = "Labor"
description = "Labor marketplace — create jobs, accept, submit deliverables, confirm delivery, dispute, refund, milestones."
version = "2.0.0"
dependencies = ["promissory_note", "native_token_v1"]

[[functions]]
name = "create_job"
code = 0
requires_proof = true
proof_circuit = "CreateJobV2"

[[functions]]
name = "accept_job"
code = 1
requires_proof = true
proof_circuit = "AcceptJobV2"

[[functions]]
name = "submit_deliverable"
code = 2
requires_proof = true
proof_circuit = "SubmitDeliverableV2"

[[functions]]
name = "submit_git_deliverable"
code = 3
requires_proof = true
proof_circuit = "SubmitGitDeliverableV2"

[[functions]]
name = "confirm_delivery"
code = 4
requires_proof = true
proof_circuit = "ConfirmDeliveryV2"

[[functions]]
name = "dispute"
code = 5
requires_proof = true
proof_circuit = "DisputeV2"

[[functions]]
name = "refund"
code = 6
requires_proof = true
proof_circuit = "RefundV2"

[[functions]]
name = "cancel"
code = 7

[[functions]]
name = "create_job_with_milestones"
code = 8

[[functions]]
name = "submit_milestone"
code = 9

[[functions]]
name = "confirm_milestone"
code = 10

[[functions]]
name = "initiate_dispute"
code = 11

# `requires_proof` and `proof_circuit` are **removed** from this pair, not corrected. Measured
# 2026-10-08: `CreateJobWithCapabilityV2` and `CreateJobWithMilestonesAndCapabilityV2` have no `.zk`
# source anywhere under `proof/` (the nine files there declare `CreateJobV2`, `AcceptJobV2`,
# `AcceptJobWithCapabilityV2` and six others, and neither of these two). The manifest was therefore
# naming circuits that do not exist, so a wallet reading it would try to build a proof it cannot make,
# and a reviewer would read a proof-bearing endpoint that is not proof-bearing. Both endpoints run
# unproved — which is the gap `OBL-C188` records, a caller-chosen principal stored with no signature
# and no circuit — and this file now says so instead of claiming otherwise. `OBL-C91`; the arm not
# taken is writing the two circuits.
[[functions]]
name = "create_job_with_capability"
code = 12

[[functions]]
name = "accept_job_with_capability"
code = 13
requires_proof = true
proof_circuit = "AcceptJobWithCapabilityV2"

[[functions]]
name = "create_job_with_milestones_and_capability"
code = 14

[[trees]]
name = "jobs"

[[trees]]
name = "nullifiers"

[[trees]]
name = "spent_flags"

[[trees]]
name = "info"

[[circuits]]
name = "CreateJobV2"
namespace = "labor_market"

[[circuits]]
name = "AcceptJobV2"
namespace = "labor_market"

[[circuits]]
name = "SubmitDeliverableV2"
namespace = "labor_market"

[[circuits]]
name = "SubmitGitDeliverableV2"
namespace = "labor_market"

[[circuits]]
name = "ConfirmDeliveryV2"
namespace = "labor_market"

[[circuits]]
name = "DisputeV2"
namespace = "labor_market"

[[circuits]]
name = "RefundV2"
namespace = "labor_market"

[[circuits]]
name = "AcceptJobWithCapabilityV2"
namespace = "labor_market"

# `milestone_payment.zk` exists and is registered by `init_contract`, but had no
# entry here. (`MilestonePaymentV2` has no [[functions]] entry either — that is a
# separate ABI question, not a manifest-naming one.)
[[circuits]]
name = "MilestonePaymentV2"
namespace = "labor_market"

# `CreateJobWithCapabilityV2` and `CreateJobWithMilestonesAndCapabilityV2` were listed here and have
# no `.zk` source (measured 2026-10-08) — a circuit table naming circuits that do not exist. Removed
# with the `[[functions]]` claims above; `OBL-C91`.
