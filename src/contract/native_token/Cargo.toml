[package]
name = "dwow_native_token_contract"
version = "0.1.0"
edition = "2021"
authors = ["DarkFi contributors"]
description = "DarkFi Native Token Contract - Consensus-first native token"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dwow-sdk = { path = "../../sdk", features = ["wasm"] }
dwow-serial = { path = "../../serial", features = ["derive", "crypto"] }
pasta_curves = "0.5.1"
# UNVERIFIED(HYG-9-5): needs cargo check -p dwow-native-token-contract -j 2
# && cargo check -p dwow-native-token-contract --features client -j 2
# serde (hard dep) removed — zero `serde` references anywhere in the crate
# (no derives, no de/serialize).
thiserror = "2.0.17"

# The following dependencies are used for the client API and
# probably shouldn't be in WASM
dwow_core = { path = "../../../", features = ["zk"], optional = true }
# UNVERIFIED(HYG-9-5): chacha20poly1305, halo2_proofs, serde_json, bs58
# removed — zero direct references in src/ and tests/ (halo2 types reach the
# crate only via dwow_sdk::zk::halo2 re-exports; serde_json/bs58 via dwow-sdk).
tracing = { version = "0.1.44", optional = true }
rand = { version = "0.8.5", optional = true }

[features]
default = []
no-entrypoint = []
deterministic-zk = []
client = [
    "dwow_core",
    "dwow-serial/async",
    "rand",
    "tracing",
]
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.8", features = ["custom"] }
dwow-sdk = { path = "../../sdk", features = ["wasm"] }

[lints]
workspace = true

# These are used just for the integration tests
[dev-dependencies]
smol = "2.0.2"
rand = "0.8.5"