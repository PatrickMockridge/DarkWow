# Native Token — Consensus-Critical Contract
#
# FYI manifest. The wallet handles Native Token natively — this manifest
# documents the interface but is not used for capability discovery.
# Native Token is rock-dumb by design: no multi-token, no auth, no
# freezing — minimal consensus attack surface.
#
# See: doc/src/contract/native_token.md

[contract]
name = "native_token"
category = "Token"
description = "Consensus-critical native token — block rewards, fee payment, and supply audit. The only genesis contract that can halt the chain."
version = "2.0.0"
dependencies = []

[[functions]]
name = "fee"
code = 8
description = "Pay transaction fees via FeeV2 (0x08). Plaintext fee + tier (FeeParamsV3) — burns the input commitment, creates a change output, adds the fee to the plaintext fees_db[height] total."
requires_proof = true
proof_circuit = "Fee_V2"

[[functions]]
name = "mint"
code = 1
description = "DISABLED — returns InvalidFunction. The only mint path is PoWRewardV1 (consensus-governed block rewards)."

[[functions]]
name = "burn"
code = 2
description = "Burn native token value via BurnV1 — publishes nullifiers. Used internally by fee payment."
requires_proof = true
proof_circuit = "Burn_V2"

[[functions]]
name = "transfer"
code = 3
description = "Transfer native token value via TransferV1. Atomic burn + blind output with value conservation."
requires_proof = true
# Uses Burn_V2 + Mint_V2 circuits (no dedicated Transfer circuit)

[[functions]]
name = "spend"
code = 4
description = "Spend native token value via SpendV1. Burn + blind output with value conservation."
requires_proof = true
# Uses Burn_V2 + Mint_V2 circuits (no dedicated Spend circuit)

[[functions]]
name = "pow_reward"
code = 5
description = "Block reward via PoWRewardV1. Consensus-governed emission — verifies cumulative supply chain, expected reward at block height, and Pedersen commitment, in plaintext (no ZK proof)."

[[functions]]
name = "fee_collect"
code = 6
description = "Collect accumulated fees via FeeCollectV1. Closes the fee epoch and distributes rewards. Verifies the plain fee sum against fees_db[height] in plaintext (no ZK proof)."

[[functions]]
name = "uncle_mint"
code = 7
description = "Mint an uncle reward note via UncleMintV1. Plaintext (no ZK proof) — one spendable note per accepted uncle, carved out of the coinbase; no supply write."

# Native token is the ONE bespoke citizen (wallet.md §6.4, §9) — this manifest
# documents the interface but is NOT used for capability discovery or construction.
# The wallet handles native_token natively via Path 1 (scan) and the hardcoded
# TransferCallBuilder (write).

[[capabilities]]
discriminant = 0
name = "commitment"
description = "An unspent native token commitment. Consumable via transfer/burn/spend/fee."
primitives = ["SecretKey", "Commitment", "Nullifier", "ContractId", "FuncId", "AssetId", "MerkleNode"]
note_schema = [{ name = "value", type = "u64" }, { name = "commitment", type = "pallas_base" }]

[[actions]]
function = "transfer"
requires = { type = "any", capabilities = ["commitment"] }
produces = [{ name = "commitment", description = "New blind output commitments" }]
consumes = ["commitment"]
required_barbs = ["Spend", "Nullify", "Commit", "Dispatch", "Gate", "Denominate"]

[[actions]]
function = "fee"
requires = { type = "any", capabilities = ["commitment"] }
produces = [{ name = "commitment", description = "Change output commitment after fee deduction" }]
consumes = ["commitment"]
required_barbs = ["Spend", "Nullify", "Commit", "Dispatch", "Gate", "Denominate"]

[[actions]]
function = "spend"
requires = { type = "any", capabilities = ["commitment"] }
produces = [{ name = "commitment", description = "New blind output commitments" }]
consumes = ["commitment"]
required_barbs = ["Spend", "Nullify", "Commit", "Dispatch", "Gate", "Denominate"]

[[trees]]
name = "commitment_set"
description = "Commitment Merkle tree"

[[trees]]
name = "nullifiers"
description = "Nullifier SMT for double-spend prevention"

[[trees]]
name = "merkle"
description = "Merkle tree checkpoints"

[[trees]]
name = "info"
description = "Contract metadata and state"

[[trees]]
name = "commitment_roots"
description = "Historical commitment tree roots"

[[trees]]
name = "nullifier_roots"
description = "Historical nullifier tree roots"

[[trees]]
name = "fees"
description = "Fee collection accumulator"

[[circuits]]
name = "Fee_V2"
namespace = "native_token"

[[circuits]]
name = "Mint_V2"
namespace = "native_token"

[[circuits]]
name = "Burn_V2"
namespace = "native_token"
