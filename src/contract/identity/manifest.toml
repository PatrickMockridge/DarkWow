# DarkWow Identity Contract Manifest
# 8 functions, 2 ZK circuits.
#
# NOTE: this manifest previously declared 9 functions / 3 circuits, including
# `create_claim` (code 3) and the `CreateClaimV2` circuit. Both were removed from
# the contract: `IdentityFunction::try_from(0x03)` returns Err (see
# src/contract/identity/src/lib.rs), only IssueCredential_V2 and VerifyCapability_V2
# are registered by init_contract, and tests/integration.rs asserts the rejection.
# Code 3 is therefore unassigned and MUST NOT be reintroduced here without the
# contract gaining it back.

[contract]
name = "Identity"
category = "Identity"
version = "1.0.0"
description = "O-Cap authorization primitive. Issues credentials, creates ZK claims, verifies capabilities."

[[functions]]
name = "initialize"
code = 0

[[functions]]
name = "issue_credential"
code = 1
requires_proof = true
proof_circuit = "IssueCredentialV2"

[[functions]]
name = "revoke_credential"
code = 2

[[functions]]
name = "register_capability"
code = 4

[[functions]]
name = "issue_capability"
code = 5

[[functions]]
name = "verify_capability"
code = 6
requires_proof = true
proof_circuit = "VerifyCapabilityV2"

[[functions]]
name = "revoke_capability"
code = 7

[[functions]]
name = "register_issuer"
code = 8

# Capability declarations (OBL-C74). Identity's capability types are ZK badges, not AEAD notes, so
# their note schemas are empty — the same shape multisig uses for its non-note capabilities. Without
# these entries the wallet could not discover the credential/capability types the contract defines.
[[capabilities]]
discriminant = 0
name = "credential"
description = "An issued credential record: schema, issuer and holder, proved without disclosure."
primitives = ["SecretKey", "Commitment", "ContractId", "FuncId"]
note_schema = []

[[capabilities]]
discriminant = 1
name = "capability"
description = "A registered capability type a holder can prove a credential against."
primitives = ["SecretKey", "Commitment", "ContractId", "FuncId"]
note_schema = []

[[actions]]
function = "issue_credential"
requires = { type = "none" }
produces = [{ name = "credential" }]
consumes = []
required_barbs = ["Commit", "Dispatch", "Gate"]

[[actions]]
function = "issue_capability"
requires = { type = "all", capabilities = ["credential"] }
produces = [{ name = "capability" }]
consumes = []
required_barbs = ["Commit", "Dispatch", "Gate"]

[[actions]]
function = "verify_capability"
requires = { type = "all", capabilities = ["capability"] }
produces = []
consumes = []
required_barbs = ["Commit", "Dispatch", "Gate"]

[[actions]]
function = "revoke_capability"
requires = { type = "none" }
produces = []
consumes = ["capability"]
required_barbs = ["Commit", "Dispatch", "Gate"]

[[circuits]]
name = "IssueCredentialV2"
namespace = "IssueCredentialV2"
description = "Credential issuance proof (k=11, 16 witnesses)"

[[circuits]]
name = "VerifyCapabilityV2"
namespace = "VerifyCapabilityV2"
description = "Capability verification proof (k=11, 14 witnesses)"

[[trees]]
name = "credentials"

[[trees]]
name = "nullifiers"

[[trees]]
name = "issuers"

[[trees]]
name = "config"

[[trees]]
name = "capabilities"

[[trees]]
name = "identity_info"
