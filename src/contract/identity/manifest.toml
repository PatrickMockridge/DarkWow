# DarkWow Identity Contract Manifest
# 9 functions, 3 ZK circuits (consolidated)

[contract]
name = "Identity"
version = "1.0.0"
description = "O-Cap authorization primitive. Issues credentials, creates ZK claims, verifies capabilities."

[[functions]]
name = "initialize"
code = 0

[[functions]]
name = "issue_credential"
code = 1
requires_proof = true
proof_circuit = "IssueCredential_V2"

[[functions]]
name = "revoke_credential"
code = 2

[[functions]]
name = "create_claim"
code = 3
requires_proof = true
proof_circuit = "CreateClaim_V2"
description = "Unified claim creation with claim_mode 0-4 (basic/threshold/ratio/multi/dag)"

[[functions]]
name = "register_capability"
code = 4

[[functions]]
name = "issue_capability"
code = 5

[[functions]]
name = "verify_capability"
code = 6
requires_proof = true
proof_circuit = "VerifyCapability_V2"

[[functions]]
name = "revoke_capability"
code = 7

[[functions]]
name = "register_issuer"
code = 8

[[circuits]]
name = "CreateClaim_V2"
description = "Unified claim creation with 5 modes via cond_select (k=12, 30 witnesses)"

[[circuits]]
name = "IssueCredential_V2"
description = "Credential issuance proof (k=11, 16 witnesses)"

[[circuits]]
name = "VerifyCapability_V2"
description = "Capability verification proof (k=11, 14 witnesses)"
