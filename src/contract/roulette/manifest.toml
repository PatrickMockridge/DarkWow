[contract]
name = "roulette"
category = "Gaming"
description = "On-chain roulette — place bet, spin wheel, settle, house close."
version = "1.0.0"
dependencies = ["promissory_note", "native_token_v1"]

[[functions]]
name = "initialize"
code = 0

[[functions]]
name = "place_bet"
code = 1
requires_proof = true
proof_circuit = "PlaceBetV2"

[[functions]]
name = "spin_wheel"
code = 2
requires_proof = true
proof_circuit = "SpinWheelV2"

[[functions]]
name = "settle_bets"
code = 3
requires_proof = true
proof_circuit = "SettleBetV2"

[[functions]]
name = "house_close"
code = 4
requires_proof = true
proof_circuit = "HouseCloseV2"

[[capabilities]]
discriminant = 0
name = "player"
description = "Roulette player"

[[capabilities]]
discriminant = 1
name = "house"
description = "House banker"

[[trees]]
name = "roulette_tables"

[[trees]]
name = "roulette_bets"

[[trees]]
name = "roulette_nullifiers"

[[trees]]
name = "roulette_history"

[[trees]]
name = "info"

[[circuits]]
name = "PlaceBetV2"
namespace = "roulette"

[[circuits]]
name = "SettleBetV2"
namespace = "roulette"

[[circuits]]
name = "SpinWheelV2"
namespace = "roulette"

[[circuits]]
name = "HouseCloseV2"
namespace = "roulette"
