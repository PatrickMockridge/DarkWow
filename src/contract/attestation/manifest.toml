# Attestation contract manifest — capability declarations for type construction.
# The wallet reads this manifest to construct capability types per wallet.md §2.2.

[contract]
name = "attestation"
category = "Identity"
description = "Attestation framework — create attestations, claims, verify, consume, delegate, slash."
version = "2.0.0"
dependencies = ["promissory_note", "native_token_v1"]

[[functions]]
name = "create_attestation"
code = 0
requires_proof = true
proof_circuit = "CreateAttestation_V2"

[[functions]]
name = "revoke_attestation"
code = 1

[[functions]]
name = "expire_attestation"
code = 2

[[functions]]
name = "create_claim"
code = 3
requires_proof = true
proof_circuit = "CreateClaim_V2"

[[functions]]
name = "verify_claim"
code = 4
requires_proof = true
proof_circuit = "VerifyClaim_V2"

[[functions]]
name = "consume_claim"
code = 5
requires_proof = true
proof_circuit = "ConsumeClaim_V2"

[[functions]]
name = "validate_claim"
code = 6

[[functions]]
name = "check_not_revoked"
code = 7
requires_proof = true
proof_circuit = "CheckNotRevoked_V2"

[[functions]]
name = "delegate_attestation"
code = 8
requires_proof = true
proof_circuit = "DelegateAttestation_V2"

[[functions]]
name = "verify_chain"
code = 9
requires_proof = true
proof_circuit = "VerifyChain_V2"

[[functions]]
name = "update_delegation"
code = 10
requires_proof = true
proof_circuit = "UpdateDelegation_V2"

[[functions]]
name = "attest_slash"
code = 11
requires_proof = true
proof_circuit = "AttestSlash_V2"

[[functions]]
name = "commit_fee_schedule"
code = 12
requires_proof = true
proof_circuit = "CommitFeeSchedule_V2"

[[capabilities]]
discriminant = 0
name = "attestation"
description = "An on-chain attestation from a trusted issuer. Non-consumable."
primitives = ["SecretKey", "Commitment", "ContractId", "FuncId"]
note_schema = []

[[capabilities]]
discriminant = 1
name = "claim"
description = "A claim against an attestation. Consumable on verify."
primitives = ["SecretKey", "Commitment", "Nullifier", "ContractId", "FuncId"]
note_schema = []

[[capabilities]]
discriminant = 2
name = "delegation"
description = "A delegated attestation authority. Non-consumable, revocable."
primitives = ["SecretKey", "Commitment", "ContractId", "FuncId"]
note_schema = []

[[actions]]
function = "create_attestation"
requires = { type = "none" }
produces = [{ name = "attestation", description = "New on-chain attestation" }]
consumes = []
required_barbs = ["Commit", "Dispatch", "Gate"]

[[actions]]
function = "create_claim"
requires = { type = "any", capabilities = ["attestation"] }
produces = [{ name = "claim", description = "Claim against an attestation" }]
consumes = []
required_barbs = ["Commit", "Dispatch", "Gate"]

[[actions]]
function = "verify_claim"
requires = { type = "any", capabilities = ["claim"] }
produces = []
consumes = ["claim"]
required_barbs = ["Spend", "Nullify", "Commit", "Dispatch", "Gate"]

[[actions]]
function = "consume_claim"
requires = { type = "any", capabilities = ["claim"] }
produces = []
consumes = ["claim"]
required_barbs = ["Spend", "Nullify", "Commit", "Dispatch", "Gate"]

[[actions]]
function = "delegate_attestation"
requires = { type = "any", capabilities = ["attestation"] }
produces = [{ name = "delegation", description = "Delegated attestation authority" }]
consumes = []
required_barbs = ["Commit", "Dispatch", "Gate"]

[[trees]]
name = "attestations"
description = "Attestation records"

[[trees]]
name = "claims"
description = "Claim records"

[[trees]]
name = "nullifiers"
description = "Nullifier SMT for double-spend prevention"

[[trees]]
name = "attestation_index"
description = "Attestation index for lookup"

[[trees]]
name = "claim_rate_limits"
description = "Rate limit tracking for claims"

[[trees]]
name = "delegations"
description = "Delegation records"

[[circuits]]
name = "CreateAttestation_V2"
namespace = "attestation"

[[circuits]]
name = "CreateClaim_V2"
namespace = "attestation"

[[circuits]]
name = "VerifyClaim_V2"
namespace = "attestation"

[[circuits]]
name = "ConsumeClaim_V2"
namespace = "attestation"

[[circuits]]
name = "CheckNotRevoked_V2"
namespace = "attestation"

[[circuits]]
name = "DelegateAttestation_V2"
namespace = "attestation"

[[circuits]]
name = "VerifyChain_V2"
namespace = "attestation"

[[circuits]]
name = "UpdateDelegation_V2"
namespace = "attestation"

[[circuits]]
name = "AttestSlash_V2"
namespace = "attestation"

[[circuits]]
name = "CommitFeeSchedule_V2"
namespace = "attestation"
