[contract]
name = "deployooor"
category = "Infrastructure"
description = "Contract deployment infrastructure — deploys WASM contracts post-genesis. Supports singleton enforcement, WASM hash storage, and import whitelist validation."
version = "1.0.0"
dependencies = []

[[functions]]
name = "deploy"
code = 0
description = "Deploy a WASM contract. Validates WASM binary structure (required exports: memory, __initialize, __entrypoint, __update, __metadata), scans for disallowed imports, enforces singleton semantics when requested, and computes a WASM content hash for integrity verification."
requires_proof = false

[[functions]]
name = "lock"
code = 1
description = "Lock a deployed contract — marks it as immutable. Requires the deployer's signature (matching the public key used to derive the ContractId). Irrevocable."

[[capabilities]]
discriminant = 0
name = "deployment_right"
description = "Right to deploy a contract. Consumed on deploy."

[[actions]]
function = "deploy"
requires = ["deployment_right"]
produces = []
consumes = ["deployment_right"]

[[actions]]
function = "lock"
requires = ["deployment_right"]
produces = []
consumes = ["deployment_right"]

[[trees]]
name = "info"
description = "Contract metadata — DB version, WASM content hashes"

[[trees]]
name = "lock"
description = "Contract lock status — contract_id → locked(bool)"

[[trees]]
name = "singleton"
description = "Singleton registry — singleton_name → contract_id mapping for preventing duplicate logical deployments"
