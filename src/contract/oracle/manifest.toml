# Oracle contract manifest — capability declarations for type construction.
# The wallet reads this manifest to construct capability types per wallet.md §2.2.

[contract]
name = "oracle"
category = "Oracle"
description = "Oracle data feed — register oracle, push values, attest, aggregate, set active. ZK-proof authenticated at host level."
version = "2.0.0"

[[functions]]
name = "register_oracle"
code = 0
requires_proof = true
proof_circuit = "RegisterOracleV2"

[[functions]]
name = "push_value"
code = 1
requires_proof = true
proof_circuit = "PushValueV2"

[[functions]]
name = "attest_value"
code = 2
requires_proof = true
proof_circuit = "AttestValueV2"

[[functions]]
name = "push_value_commitment"
code = 3
requires_proof = true
proof_circuit = "PushValueCommitmentV2"

[[functions]]
name = "aggregate"
code = 4
requires_proof = true
proof_circuit = "AggregateV2"

[[functions]]
name = "set_oracle_active"
code = 5

[[capabilities]]
discriminant = 0
name = "oracle_registration"
description = "Registered oracle operator. Non-consumable."
primitives = ["SecretKey", "Commitment", "ContractId", "FuncId"]
note_schema = []

[[capabilities]]
discriminant = 1
name = "oracle_value"
description = "A value pushed by an oracle. Consumable on attest."
primitives = ["SecretKey", "Commitment", "Nullifier", "ContractId", "FuncId", "AssetId"]
note_schema = [{ name = "value", type = "u64" }]

[[capabilities]]
discriminant = 2
name = "attestation"
description = "An attestation of an oracle value. Produced by attest_value."
primitives = ["SecretKey", "Commitment", "Nullifier", "ContractId", "FuncId"]
note_schema = []

[[capabilities]]
discriminant = 3
name = "aggregate"
description = "Aggregated oracle values. Produced by aggregate."
primitives = ["SecretKey", "Commitment", "Nullifier", "ContractId", "FuncId", "AssetId"]
note_schema = [{ name = "value", type = "u64" }]

[[capabilities]]
discriminant = 4
name = "value_commitment"
description = "A Pedersen commitment to an oracle value. Produced by push_value_commitment."
primitives = ["SecretKey", "Commitment", "ContractId", "FuncId", "AssetId"]
note_schema = [{ name = "commitment", type = "pallas_base" }]

[[actions]]
function = "register_oracle"
requires = { type = "none" }
produces = [{ name = "oracle_registration", description = "Registered oracle operator capability" }]
consumes = []
required_barbs = ["Commit", "Dispatch", "Gate"]

[[actions]]
function = "push_value"
requires = { type = "all", capabilities = ["oracle_registration"] }
produces = [{ name = "oracle_value", description = "Oracle value pushed to the feed" }]
consumes = []
required_barbs = ["Commit", "Dispatch", "Gate", "Denominate"]

[[actions]]
function = "attest_value"
requires = { type = "any", capabilities = ["oracle_value"] }
produces = [{ name = "attestation", description = "Attested oracle value" }]
consumes = ["oracle_value"]
required_barbs = ["Spend", "Nullify", "Commit", "Dispatch", "Gate"]

[[actions]]
function = "push_value_commitment"
requires = { type = "all", capabilities = ["oracle_registration"] }
produces = [{ name = "value_commitment", description = "Pedersen commitment to an oracle value" }]
consumes = []
required_barbs = ["Commit", "Dispatch", "Gate", "Denominate"]

[[actions]]
function = "aggregate"
requires = { type = "any", capabilities = ["oracle_value"] }
produces = [{ name = "aggregate", description = "Aggregated oracle values" }]
consumes = ["oracle_value"]
required_barbs = ["Spend", "Nullify", "Commit", "Dispatch", "Gate", "Denominate"]

[[trees]]
name = "oracles"
description = "Oracle registrations"

[[trees]]
name = "attestations"
description = "Attestation records"

[[trees]]
name = "info"
description = "Contract metadata and state"

[[circuits]]
name = "RegisterOracleV2"
namespace = "oracle"

[[circuits]]
name = "PushValueV2"
namespace = "oracle"

[[circuits]]
name = "AttestValueV2"
namespace = "oracle"

[[circuits]]
name = "PushValueCommitmentV2"
namespace = "oracle"

[[circuits]]
name = "AggregateV2"
namespace = "oracle"
