# Oracle contract manifest — capability declarations for type construction.

[contract]
name = "oracle"
category = "Oracle"
description = "Oracle data feed — register oracle, push values, attest, aggregate, set active. ZK-proof authenticated at host level."
version = "1.0.0"

[[functions]]
name = "register_oracle"
code = 0
requires_proof = true
proof_circuit = "RegisterOracle_V1"

[[functions]]
name = "push_value"
code = 1
requires_proof = true
proof_circuit = "PushValue_V1"

[[functions]]
name = "attest_value"
code = 2
requires_proof = true
proof_circuit = "AttestValue_V1"

[[functions]]
name = "push_value_commitment"
code = 3
requires_proof = true
proof_circuit = "PushValueCommitment_V1"

[[functions]]
name = "aggregate"
code = 4
requires_proof = true
proof_circuit = "Aggregate_V1"

[[functions]]
name = "set_oracle_active"
code = 5

[[capabilities]]
discriminant = 0
name = "oracle_registration"
description = "Registered oracle operator. Non-consumable."

[[capabilities]]
discriminant = 1
name = "oracle_value"
description = "A pushed oracle data value with attestation. Produced by push_value, consumed by attest_value."

[[capabilities]]
discriminant = 2
name = "aggregate_result"
description = "Aggregated value from multiple oracles. Non-consumable."

[[actions]]
function = "register_oracle"
requires = []
produces = ["oracle_registration"]
consumes = []

[[actions]]
function = "push_value"
requires = ["oracle_registration"]
produces = ["oracle_value"]
consumes = []

[[actions]]
function = "attest_value"
requires = ["oracle_value"]
produces = []
consumes = ["oracle_value"]

[[actions]]
function = "aggregate"
requires = ["oracle_value"]
produces = ["aggregate_result"]
consumes = []

[[trees]]
name = "oracles"

[[trees]]
name = "attestations"

[[trees]]
name = "info"

[[circuits]]
name = "RegisterOracle_V1"
namespace = "oracle"

[[circuits]]
name = "PushValue_V1"
namespace = "oracle"

[[circuits]]
name = "AttestValue_V1"
namespace = "oracle"

[[circuits]]
name = "PushValueCommitment_V1"
namespace = "oracle"

[[circuits]]
name = "Aggregate_V1"
namespace = "oracle"
