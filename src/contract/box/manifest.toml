# Box contract manifest — capability declarations for type construction.
# The wallet reads this manifest to construct capability types per wallet.md §2.2.
# Box is L1: two ZK circuits, Merkle inclusion proofs, nullifier per state transition.
# The wire carries what a verifier needs and no more: the public inputs, the Merkle
# path, the proof, the two contents commitments, and `new_state_nonce` — whose
# successor the *prover* must supply because the circuit constrains it to `old + 1`.
# `box_id` and `state_nonce` are NOT on the wire; their witness slots read `note:` and
# the wallet serves them from its own record (`CapRecord.object_id`/`.state_nonce`,
# `bin/dww/src/lib.rs`), because `privacy.md` §2 promises an observer learns "not which
# resource was operated on" and §5.5 says `box_id` "is never a public input". `Put`
# emits the box's AEAD note (`{commitment, state_nonce, box_id}`), which is how the
# wallet discovers the new leaf (§C.8.1). The contents commitments are the residue,
# declared in `scripts/check-l1-wire-conformance.sh`; the note does not yet carry what
# the box holds, and §C.8.2's `nullifier`/`merkle_root`/`leaf_position` are not in the
# schema yet either. `owner_secret` stays private (wallet.md §6.4.1).

[contract]
name = "box"
category = "Infrastructure"
version = "1.0.0"
description = "ZK capability container — linear o-cap delegation (L1)"

[[functions]]
name = "initialize"
code = 0
description = "Genesis initialization"
requires_proof = false

[[functions]]
name = "put"
code = 1
description = "Place a capability into a Box — consumes old state, creates new Merkle leaf"
requires_proof = true
proof_circuit = "Put"

[[functions]]
name = "take"
code = 2
description = "Take a capability from a Box — consumes current state via nullifier"
requires_proof = true
proof_circuit = "Take"

[[circuits]]
name = "Put"
namespace = "Put"
witness_map = [
    "note:box_id",
    "note:state_nonce",
    "param:new_state_nonce",
    "param:old_contents_commit",
    "param:new_contents_commit",
    "derived:nullifier:8,0,1",
    "merkle_root",
    "derived:leaf:0,4,2,8",
    "secret",
    "leaf_position",
    "merkle_path",
    "tx_commitment",
    "param:tx_nonce",
    "derived:tx_binding:11,12",
    "derived:owner_pub:8",
]

[[circuits]]
name = "Take"
namespace = "Take"
witness_map = [
    "note:box_id",
    "param:contents_commit",
    "note:state_nonce",
    "derived:nullifier:5,0,2",
    "merkle_root",
    "secret",
    "leaf_position",
    "merkle_path",
    "tx_commitment",
    "param:tx_nonce",
    "derived:tx_binding:8,9",
    "derived:owner_pub:5",
]

[[parameters]]
function = "put"
fields = [
    { name = "new_state_nonce", type = "pallas_base" },
    { name = "old_contents_commit", type = "pallas_base" },
    { name = "new_contents_commit", type = "pallas_base" },
    { name = "nullifier", type = "pallas_base", witness = 5 },
    { name = "expected_root", type = "pallas_base", witness = 6 },
    { name = "new_leaf", type = "pallas_base", witness = 7, leaf = true },
    { name = "leaf_pos", type = "u32", witness = 9 },
    { name = "merkle_path", type = "merkle_path", witness = 10 },
    { name = "proof", type = "proof" },
    { name = "tx_binding", type = "pallas_base", witness = 13 },
    { name = "tx_nonce", type = "pallas_base" },
]

[[parameters]]
function = "take"
fields = [
    { name = "contents_commit", type = "pallas_base" },
    { name = "nullifier", type = "pallas_base", witness = 3 },
    { name = "expected_root", type = "pallas_base", witness = 4 },
    { name = "leaf_pos", type = "u32", witness = 6 },
    { name = "merkle_path", type = "merkle_path", witness = 7 },
    { name = "proof", type = "proof" },
    { name = "tx_binding", type = "pallas_base", witness = 10 },
    { name = "tx_nonce", type = "pallas_base" },
]

[[trees]]
name = "nullifiers"
description = "Spent nullifier records"

[[trees]]
name = "box_roots"
description = "Historical Merkle roots for inclusion proofs"

[[trees]]
name = "info"
description = "Merkle tree state and root pointers"

[[capabilities]]
name = "box_capability"
discriminant = 0
primitives = ["SecretKey", "Commitment", "Nullifier", "MerkleNode", "ContractId", "FuncId"]
note_schema = [
    { name = "commitment", type = "pallas_base", witness = 7 },
    { name = "state_nonce", type = "pallas_base", source = "new_state_nonce" },
    { name = "box_id", type = "pallas_base", witness = 0 },
]

[[actions]]
function = "put"
required_barbs = ["Spend", "Nullify", "ProveInclusion", "Commit", "Dispatch", "Gate"]
consumes = ["box_capability"]
produces = [{ name = "box_capability" }]

[[actions]]
function = "take"
required_barbs = ["Spend", "Nullify", "ProveInclusion", "Commit", "Dispatch", "Gate"]
consumes = ["box_capability"]
