# Box contract manifest — capability declarations for type construction.
# The wallet reads this manifest to construct capability types per wallet.md §2.2.
# Box is L1: two ZK circuits, Merkle inclusion proofs, nullifier per state transition.
#
# **The wire carries the public inputs, the Merkle path, the proof, `tx_binding` and
# `tx_nonce` — and nothing else.** Everything a verifier does not need is either a
# witness-tagged param (supplied by the caller, never published) or read from the
# wallet's own record: `box_id` and `state_nonce` come from `CapRecord.object_id` and
# `.state_nonce` through the `note:` sources, `new_state_nonce` is `derived:increment:1`
# of the consumed nonce, and the three contents commitments are witness-tagged. That is
# the whole of `privacy.md` §2's promise, which says an observer learns "not which
# resource was operated on", and §5.5's, which says `box_id` "is never a public input".
#
# `Put` emits the box's AEAD note (`{commitment, state_nonce, box_id}`), which is how
# the wallet discovers the new leaf (§C.8.1). **The note does not yet carry what the box
# holds** — §C.8.2's `contents`/`nullifier`/`merkle_root`/`leaf_position` are not in the
# schema — so a wallet that put a box learns its contents only from its own record, not
# by scanning. That gap is recorded rather than implied. `owner_secret` stays private
# (wallet.md §6.4.1).

[contract]
name = "box"
category = "Infrastructure"
version = "1.0.0"
description = "ZK capability container — linear o-cap delegation (L1)"

[[functions]]
name = "initialize"
code = 0
description = "Genesis initialization"
requires_proof = false

[[functions]]
name = "put"
code = 1
description = "Place a capability into a Box — consumes old state, creates new Merkle leaf"
requires_proof = true
proof_circuit = "Put"

[[functions]]
name = "take"
code = 2
description = "Take a capability from a Box — consumes current state via nullifier"
requires_proof = true
proof_circuit = "Take"

[[circuits]]
name = "Put"
namespace = "Put"
witness_map = [
    "note:box_id",
    "note:state_nonce",
    # `derived:increment:1` — the successor of slot 1, the consumed nonce. `put.zk:63-64` computes
    # `computed_nsn = base_add(old_state_nonce, ONE)` and constrains it equal to `new_state_nonce`, so
    # the value is fully determined by the circuit and needs no caller input. The declared reason for
    # leaving it on the wire reads *"the prover must supply it (the circuit constrains it to `old + 1`)
    # and no `note:` field yields a successor, where purse's circuit derives its own"* — **the contrast
    # is false**: `put.zk` derives it too, and the `increment` rule is the same mechanism `purse` uses,
    # evaluated at `bin/dww/src/prover_impl.rs:435` for witness slots and
    # `src/sdk/src/contract_client.rs:304-321` for note fields.
    "derived:increment:1",
    "param:old_contents_commit",
    "param:new_contents_commit",
    "derived:nullifier:8,0,1",
    "merkle_root",
    "derived:leaf:0,4,2,8",
    "secret",
    "leaf_position",
    "merkle_path",
    "tx_commitment",
    "param:tx_nonce",
    "derived:tx_binding:11,12",
    "derived:owner_pub:8",
]

[[circuits]]
name = "Take"
namespace = "Take"
witness_map = [
    "note:box_id",
    "param:contents_commit",
    "note:state_nonce",
    "derived:nullifier:5,0,2",
    "merkle_root",
    "secret",
    "leaf_position",
    "merkle_path",
    "tx_commitment",
    "param:tx_nonce",
    "derived:tx_binding:8,9",
    "derived:owner_pub:5",
]

[[parameters]]
function = "put"
fields = [
    # Tagged, so none of the three is written to call data. A witness-tagged param is skipped by
    # `encode_params_values` and filled from the prover's bound values, while its `witness_map` source
    # still reads the caller's params — which is what "off the wire" means here: the caller supplies
    # them, the chain does not publish them.
    { name = "new_state_nonce", type = "pallas_base", witness = 2 },
    { name = "old_contents_commit", type = "pallas_base", witness = 3 },
    { name = "new_contents_commit", type = "pallas_base", witness = 4 },
    { name = "nullifier", type = "pallas_base", witness = 5 },
    { name = "expected_root", type = "pallas_base", witness = 6 },
    { name = "new_leaf", type = "pallas_base", witness = 7, leaf = true },
    { name = "leaf_pos", type = "u32", witness = 9 },
    { name = "merkle_path", type = "merkle_path", witness = 10 },
    { name = "proof", type = "proof" },
    { name = "tx_binding", type = "pallas_base", witness = 13 },
    { name = "tx_nonce", type = "pallas_base" },
]

[[parameters]]
function = "take"
fields = [
    # Tagged, as the three above: the box's contents are the caller's to name and no verifier needs
    # them — the circuit folds them into the leaf, whose root is the published value.
    { name = "contents_commit", type = "pallas_base", witness = 1 },
    { name = "nullifier", type = "pallas_base", witness = 3 },
    { name = "expected_root", type = "pallas_base", witness = 4 },
    { name = "leaf_pos", type = "u32", witness = 6 },
    { name = "merkle_path", type = "merkle_path", witness = 7 },
    { name = "proof", type = "proof" },
    { name = "tx_binding", type = "pallas_base", witness = 10 },
    { name = "tx_nonce", type = "pallas_base" },
]

[[trees]]
name = "nullifiers"
description = "Spent nullifier records"

[[trees]]
name = "box_roots"
description = "Historical Merkle roots for inclusion proofs"

[[trees]]
name = "info"
description = "Merkle tree state and root pointers"

[[capabilities]]
name = "box_capability"
discriminant = 0
primitives = ["SecretKey", "Commitment", "Nullifier", "MerkleNode", "ContractId", "FuncId"]
note_schema = [
    { name = "commitment", type = "pallas_base", witness = 7 },
    { name = "state_nonce", type = "pallas_base", source = "new_state_nonce" },
    { name = "box_id", type = "pallas_base", witness = 0 },
]

[[actions]]
function = "put"
required_barbs = ["Spend", "Nullify", "ProveInclusion", "Commit", "Dispatch", "Gate"]
consumes = ["box_capability"]
produces = [{ name = "box_capability" }]

[[actions]]
function = "take"
required_barbs = ["Spend", "Nullify", "ProveInclusion", "Commit", "Dispatch", "Gate"]
consumes = ["box_capability"]
