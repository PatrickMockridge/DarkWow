# Box contract manifest — capability declarations for type construction.
# The wallet reads this manifest to construct capability types per wallet.md §2.2.
# Box is L1: two ZK circuits, Merkle inclusion proofs, nullifier per state transition.
#
# **The wire carries the public inputs, the Merkle path, the proof, `tx_nonce` and — on `Take`
# only — `box_tag`.** `tx_binding` left the wire in `OBL-C198`: `get_metadata` derives it from the
# host, so it is a public *input* the node publishes and not a field a caller sends.
# `box_id`, `state_nonce` and `Put`'s consumed contents come from the wallet's own record through
# the `note:` sources, `new_state_nonce` is `derived:increment:1` of the consumed nonce, and
# `Put`'s produced contents is a parameter carrying `off_wire`. That is `privacy.md` §2's promise,
# which says an observer learns "not which resource was operated on", and §5.5's, which says
# `box_id` "is never a public input".
#
# **`Take`'s `box_tag` is the one parent-facing term, and it is a one-way function of the object,
# not the object.** `box_tag = poseidon(4, box_id, contents_commit)`; a parent that knows both
# witnesses' values names the box with it, and neither value reaches the wire.
# `escrow::ClaimV1` compares it against the tag it derives from its own record, so a claim is of
# *that* escrow's box and not a box-shaped formality. This replaces the `contents_commit` field
# that was on the wire because a parent read it (`OBL-C184`): the tag is strictly less information
# and `scripts/check-l1-wire-conformance.sh` now declares no leak. The privacy limit is real: a
# one-way pseudonym, and for escrow both preimages are derivable from its public create params, so
# the tag does not hide the escrow-to-claim link from an observer who computes it.
#
# **Corrected 2026-09-28, twice, and the second correction is why the first did not fix it.**
# The passages that stood here said the contents commitments were "witness-tagged" and so "not
# published". They were not: `encode_params_values` (`src/sdk/src/manifest.rs`) walks the whole
# schema and special-cases only `proof`, so **every field in `[[parameters]]` is written to call
# data** — a `witness` tag decides *who supplies* a value, never *whether it is published*
# (`OBL-C179`). Tagging the three therefore changed nothing, and it broke the call besides: the
# tag also made `decode_params_from_json` skip the field, so the prover's `param:` source had
# nothing to resolve. The tag that does what the old comment claimed is **`off_wire`**, and it
# is on `new_contents_commit` alone.
#
# `Put` emits the box's AEAD note, which is how the wallet discovers the new leaf (§C.8.1).
# **It carries what the box holds now** — as the *commitment*, never a preimage: the contents
# fields are opaque `pallas::Base` elements the circuit folds into a leaf and never interprets,
# so the box layer never receives a preimage and cannot leak one. It also carries the `nullifier`
# of the consumed box and the `merkle_root` that anchored it (§C.8.2, `OBL-C181`); the new leaf's
# position is structural and is not a note field — see the `note_schema` comment below.
# `owner_secret` stays private (wallet.md §6.4.1).

[contract]
name = "box"
category = "Infrastructure"
version = "1.0.0"
description = "ZK capability container — linear o-cap delegation (L1)"

[[functions]]
name = "initialize"
code = 0
description = "Genesis initialization"
requires_proof = false

[[functions]]
name = "put"
code = 1
description = "Place a capability into a Box — consumes old state, creates new Merkle leaf"
requires_proof = true
proof_circuit = "Put"

[[functions]]
name = "take"
code = 2
description = "Take a capability from a Box — consumes current state via nullifier"
requires_proof = true
proof_circuit = "Take"

[[circuits]]
name = "Put"
namespace = "Put"
witness_map = [
    "note:box_id",
    "note:state_nonce",
    # `derived:increment:1` — the successor of slot 1, the consumed nonce. `put.zk:63-64` computes
    # `computed_nsn = base_add(old_state_nonce, ONE)` and constrains it equal to `new_state_nonce`, so
    # the value is fully determined by the circuit and needs no caller input. The declared reason for
    # leaving it on the wire reads *"the prover must supply it (the circuit constrains it to `old + 1`)
    # and no `note:` field yields a successor, where purse's circuit derives its own"* — **the contrast
    # is false**: `put.zk` derives it too, and the `increment` rule is the same mechanism `purse` uses,
    # evaluated at `bin/dww/src/prover_impl.rs:435` for witness slots and
    # `src/sdk/src/contract_client.rs:304-321` for note fields.
    "derived:increment:1",
    # The consumed box's contents, from the wallet's own record of it — the note this contract
    # emitted when that box was produced or received, read back by the scan into
    # `CapRecord.user_data`. A box with no predecessor takes the record's zero, which is what a
    # fresh box's old leaf commits to.
    "note:user_data",
    "param:new_contents_commit",
    "derived:nullifier:8,0,1",
    "merkle_root",
    "derived:leaf:0,4,2,8",
    "secret",
    "leaf_position",
    "merkle_path",
    "tx_commitment",
    "param:tx_nonce",
    "derived:tx_binding:11,12",
    "derived:owner_pub:8",
]

[[circuits]]
name = "Take"
namespace = "Take"
witness_map = [
    "note:box_id",
    # The contents commitment is a witness again: the parent reads the one-way `box_tag` below,
    # not the app's preimage commitment. This is the L1 wire rule restored, not a lost binding.
    "note:user_data",
    "note:state_nonce",
    "derived:nullifier:5,0,2",
    "merkle_root",
    "secret",
    "leaf_position",
    "merkle_path",
    "tx_commitment",
    "param:tx_nonce",
    "derived:tx_binding:8,9",
    "derived:owner_pub:5",
    # The generic object tag: poseidon(4, box_id, contents_commit). A parent that knows both
    # witnesses' values names the box with it; neither value reaches the wire.
    "derived:box_tag:0,1",
]

[[parameters]]
function = "put"
fields = [
    # **`new_state_nonce` and `old_contents_commit` are gone from this list, and the wire with them.**
    # Neither needed a parameter: the nonce is slot 2, whose source is `derived:increment:1`, and the
    # consumed contents is slot 3, whose source is now `note:user_data`. A parameter that nothing
    # reads and no encoder should write is a wire field.
    #
    # `new_contents_commit` stays, `off_wire`: the caller chooses it, the prover binds it, and
    # `encode_params_values` does not write it. This is the fourth quadrant `OBL-C179` names — and
    # note that it carries `off_wire` and **not** `witness = 4`, which is what it carried before and
    # what made the call unbuildable: `witness` makes `decode_params_from_json` skip the field, so the
    # prover's `param:new_contents_commit` had nothing to look up while the encoder still wrote it.
    { name = "new_contents_commit", type = "pallas_base", off_wire = true },
    { name = "nullifier", type = "pallas_base", witness = 5 },
    { name = "expected_root", type = "pallas_base", witness = 6 },
    { name = "new_leaf", type = "pallas_base", witness = 7, leaf = true },
    { name = "leaf_pos", type = "u32", witness = 9 },
    { name = "merkle_path", type = "merkle_path", witness = 10 },
    { name = "proof", type = "proof" },
    # `tx_binding` was here until 2026-10-13. It left the wire in `OBL-C198` — `get_metadata`
    # derives it from the host's transaction commitment and `PutParams::decode` reads only
    # `tx_nonce` (`box/src/model/mod.rs:169-171`) — so a manifest that still wrote it shifted
    # `tx_nonce` by 32 bytes and the arm decoded the binding's bytes as the nonce. Deleted rather
    # than marked `off_wire`: nothing reads it from `[[parameters]]` (the slot is bound from
    # `[[circuits]] witness_map`), which is the same call this file already made for
    # `new_state_nonce` and `old_contents_commit`.
    { name = "tx_nonce", type = "pallas_base" },
]

[[parameters]]
function = "take"
fields = [
    # The one parent-facing term: a one-way tag over `(box_id, contents_commit)`, published as a
    # public input and compared by `escrow::ClaimV1`. Neither operand is on the wire; the producer's
    # `derived:box_tag:0,1` fills it. `scripts/check-l1-wire-conformance.sh` now declares no leak.
    { name = "box_tag", type = "pallas_base", witness = 12 },
    { name = "nullifier", type = "pallas_base", witness = 3 },
    { name = "expected_root", type = "pallas_base", witness = 4 },
    { name = "leaf_pos", type = "u32", witness = 6 },
    { name = "merkle_path", type = "merkle_path", witness = 7 },
    { name = "proof", type = "proof" },
    # `tx_binding` was here until 2026-10-13 — same removal as `Put` above. `TakeParams::decode`
    # reads `tx_nonce` where the pair used to start (`box/src/model/mod.rs:263-265`).
    { name = "tx_nonce", type = "pallas_base" },
]

[[trees]]
name = "nullifiers"
description = "Spent nullifier records"

[[trees]]
name = "box_roots"
description = "Historical Merkle roots for inclusion proofs"

[[trees]]
name = "info"
description = "Merkle tree state and root pointers"

[[capabilities]]
name = "box_capability"
discriminant = 0
primitives = ["SecretKey", "Commitment", "Nullifier", "MerkleNode", "ContractId", "FuncId"]
note_schema = [
    { name = "commitment", type = "pallas_base", witness = 7 },
    # `source = "new_state_nonce"` was a *param* lookup, and the param is gone: the nonce is the
    # circuit's own slot 2 (`derived:increment:1`), so the note reads it there.
    { name = "state_nonce", type = "pallas_base", witness = 2 },
    { name = "box_id", type = "pallas_base", witness = 0 },
    # **What the box holds, in the note — and it is the commitment, never a preimage.** The three
    # contents fields are opaque `pallas::Base` elements the circuit folds into a leaf
    # (`put.zk:46,67`, `take.zk:42`) and never interprets; the box layer never receives a preimage, so
    # this cannot leak one. Until now the note carried `{commitment, state_nonce, box_id}` and **not
    # the contents**, so a box was opaque to observers (right) *and to its own holder* (wrong): a
    # wallet that put or received a box could not learn what it held, and `CapRecord` had no slot for
    # it either. The name is `user_data` because `CapRecord.user_data` is the field that already
    # exists, is already persisted, and is already mapped in `cap_record_note_fields`.
    #
    # `witness = 4` is the produced contents — `put`'s slot 4. `take` produces nothing
    # (`[[actions]]` gives it `consumes` and no `produces`), so `note_schema_for_function(2)` returns
    # `None` and this schema is never applied in Take's witness frame, where slot 4 is `merkle_root`.
    { name = "user_data", type = "pallas_base", witness = 4 },
    # **§C.8.2 trajectory fields (`OBL-C181`).** `nullifier` (slot 5) is the consumed box's
    # nullifier and `merkle_root` (slot 6, the circuit's `expected_root`) is the root that
    # anchored it. Both are circuit-constrained witnesses, so the note cannot carry a value the
    # operation did not use. They let a holder — or a consumer holding only the note — match this
    # new box to the object that produced it and verify the state it came from.
    #
    # §C.8.2's third field, the *new* leaf's position, is deliberately absent. No circuit witness
    # carries it (a leaf's position is assigned by the tree when the call is applied, which is
    # after the note is built), and the wallet recovers it structurally: the scan inserts each
    # recovered leaf into the contract tree in call order (`bin/dww/src/scan.rs`,
    # `append_leaf_and_prove`) and records the position it receives. A note field would be a
    # second, unverifiable source for a value the scan already knows. The requirement is
    # corrected in `doc/src/arch/contract-wasm-type-system.md` §C.8.2 rather than satisfied
    # with a value the note cannot prove.
    { name = "nullifier", type = "pallas_base", witness = 5 },
    { name = "merkle_root", type = "pallas_base", witness = 6 },
]

[[actions]]
function = "put"
required_barbs = ["Spend", "Nullify", "ProveInclusion", "Commit", "Dispatch", "Gate"]
consumes = ["box_capability"]
produces = [{ name = "box_capability" }]

[[actions]]
function = "take"
required_barbs = ["Spend", "Nullify", "ProveInclusion", "Commit", "Dispatch", "Gate"]
consumes = ["box_capability"]
