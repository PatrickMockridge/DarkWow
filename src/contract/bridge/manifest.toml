[contract]
name = "bridge"
category = "Bridge"
description = "Cross-chain bridge core — locks external-chain assets and issues wrapped promissory notes."
version = "2.0.0"
dependencies = ["promissory_note", "native_token_v1"]

[[functions]]
name = "initialize"
code = 0

[[functions]]
name = "deposit"
code = 1
requires_proof = true
proof_circuit = "DepositV2"

[[functions]]
name = "withdraw"
code = 2
requires_proof = true
proof_circuit = "WithdrawV2"

[[trees]]
name = "info"

[[trees]]
name = "deposits"

[[trees]]
name = "withdrawals"

[[trees]]
name = "nullifiers"

# V2 circuits (HAZOP RC3: domain separation)
[[circuits]]
name = "DepositV2"
namespace = "bridge"

[[circuits]]
name = "WithdrawV2"
namespace = "bridge"
