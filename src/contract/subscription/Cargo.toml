[package]
name = "dwow_subscription_contract"
version = "0.1.0"
edition = "2021"
authors = ["DarkFi contributors"]
description = "DarkFi Subscription Contract - Member subscription service with DAO treasury and endowment fund"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dwow-sdk = { path = "../../sdk", features = ["wasm"] }
dwow-serial = { path = "../../serial" }
dwow_promissory_note_contract = { version = "0.1.0", path = "../promissory_note", features = ["no-entrypoint"] }
getrandom = { version = "0.2.8", features = ["custom"] }
halo2_proofs = { version = "0.3.2", optional = true }

dwow_core = { path = "../../../", features = ["zk"], optional = true }

[dependencies.rand]
optional = true
version = "0.8"

[features]
default = []
no-entrypoint = []
client = ["dwow_core", "rand", "halo2_proofs"]

[lints]
workspace = true
