[package]
name = "subscription_contract"
version = "0.1.0"
edition = "2021"
authors = ["DarkFi contributors"]
description = "DarkFi Subscription Contract - Member subscription service with DAO treasury and endowment fund"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
darkfi-sdk = { path = "../../sdk", features = ["wasm"] }
darkfi-serial = { path = "../../serial" }
halo2_proofs = { version = "0.3.2", optional = true }

[dependencies.darkfi]
optional = true
path = "../../../"

[dependencies.rand]
optional = true
version = "0.8"

[features]
default = []
no-entrypoint = []
client = ["dep:darkfi", "dep:rand", "dep:halo2_proofs"]

[lints]
workspace = true