[package]
name = "subscription_contract"
version = "0.1.0"
edition = "2021"
authors = ["DarkFi contributors"]
description = "DarkFi Subscription Contract - Member subscription service with DAO treasury and endowment fund"
license = "AGPL-3.0-only"

[dependencies]
darkfi-sdk = { path = "../../sdk", features = ["wasm"] }
darkfi-serial = { path = "../../serial" }

[features]
default = []
client = ["dep:darkfi", "dep:rand"]

[dependencies.darkfi]
optional = true
path = "../../../../darkfi"

[dependencies.rand]
optional = true
version = "0.8"