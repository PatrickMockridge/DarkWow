[contract]
name = "subscription"
category = "Infrastructure"
description = "Subscription service — subscribe, verify access, cancel, renew, DAO control, update usage."
version = "1.0.0"
dependencies = ["promissory_note", "native_token_v1"]

[[functions]]
name = "initialize"
code = 0

[[functions]]
name = "subscribe"
code = 1
requires_proof = true
proof_circuit = "SubscribeV2"

[[functions]]
name = "cancel"
code = 2
requires_proof = true
proof_circuit = "CancelV2"

[[functions]]
name = "renew"
code = 3
requires_proof = true
proof_circuit = "RenewV2"

[[functions]]
name = "verify_access"
code = 4
requires_proof = true
proof_circuit = "VerifyAccessV2"

[[functions]]
name = "dao_control"
code = 5

[[functions]]
name = "update_usage"
code = 6
requires_proof = true
proof_circuit = "UpdateUsageV2"

[[capabilities]]
discriminant = 0
name = "subscriber"
description = "Active subscriber"

[[trees]]
name = "info"

[[trees]]
name = "subscriptions"

[[trees]]
name = "nullifiers"

[[trees]]
name = "plans"

[[circuits]]
name = "SubscribeV2"
namespace = "subscription"

[[circuits]]
name = "CancelV2"
namespace = "subscription"

[[circuits]]
name = "RenewV2"
namespace = "subscription"

[[circuits]]
name = "VerifyAccessV2"
namespace = "subscription"

[[circuits]]
name = "UpdateUsageV2"
namespace = "subscription"
