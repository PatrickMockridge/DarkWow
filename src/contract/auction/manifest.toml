[contract]
name = "auction"
category = "Gaming"
description = "Sealed-bid auction — create auction, place bid, close, claim winnings, settle, refund."
version = "2.0.0"
dependencies = ["promissory_note", "native_token_v1"]

[[functions]]
name = "create_auction"
code = 0
requires_proof = true
proof_circuit = "CreateAuctionV2"

[[functions]]
name = "place_bid"
code = 1
requires_proof = true
proof_circuit = "PlaceBidV2"

[[functions]]
name = "close_auction"
code = 2
requires_proof = true
proof_circuit = "CloseAuctionV2"

[[functions]]
name = "claim_winnings"
code = 3
requires_proof = true
proof_circuit = "ClaimWinningsV2"

[[functions]]
name = "settle_auction"
code = 4
requires_proof = true
proof_circuit = "SettleAuctionV2"

[[functions]]
name = "refund_bid"
code = 5
requires_proof = true
proof_circuit = "RefundBidV2"

[[capabilities]]
discriminant = 0
name = "seller"
description = "Auction seller"

[[capabilities]]
discriminant = 1
name = "bidder_active"
description = "Active bidder"

[[capabilities]]
discriminant = 2
name = "bidder_outbid"
description = "Outbid bidder"

[[trees]]
name = "auctions"

[[trees]]
name = "bids"

[[trees]]
name = "nullifiers"

[[trees]]
name = "info"

[[circuits]]
name = "CreateAuctionV2"
namespace = "auction"

[[circuits]]
name = "PlaceBidV2"
namespace = "auction"

[[circuits]]
name = "CloseAuctionV2"
namespace = "auction"

[[circuits]]
name = "ClaimWinningsV2"
namespace = "auction"

[[circuits]]
name = "SettleAuctionV2"
namespace = "auction"

[[circuits]]
name = "RefundBidV2"
namespace = "auction"
