[contract]
name = "otc_swap"
category = "DEX"
description = "Peer-to-peer OTC atomic swap. Create, fund, execute, cancel. Two-party trustless exchange."
version = "1.0.0"
dependencies = ["promissory_note", "native_token_v1"]

[[functions]]
name = "initialize"
code = 0

[[functions]]
name = "create_swap"
code = 1
requires_proof = true
proof_circuit = "CreateSwapV2"

[[functions]]
name = "fund_swap"
code = 2
requires_proof = true
proof_circuit = "FundSwapV2"

[[functions]]
name = "execute_swap"
code = 3
requires_proof = true
proof_circuit = "ExecuteSwapV2"

[[functions]]
name = "cancel_swap"
code = 4
requires_proof = true
proof_circuit = "CancelSwapV2"

[[capabilities]]
discriminant = 0
name = "proposer"
description = "Swap proposer"

[[capabilities]]
discriminant = 1
name = "acceptor"
description = "Swap acceptor"

[[trees]]
name = "info"

[[trees]]
name = "swaps"

[[trees]]
name = "nullifiers"

[[circuits]]
name = "CreateSwapV2"
namespace = "otc_swap"

[[circuits]]
name = "FundSwapV2"
namespace = "otc_swap"

[[circuits]]
name = "ExecuteSwapV2"
namespace = "otc_swap"

[[circuits]]
name = "CancelSwapV2"
namespace = "otc_swap"
