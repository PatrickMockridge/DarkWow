[package]
name = "dwow_core"
version = "0.5.0"
homepage = "https://darkwow.org"
description = "DarkWow: pure PoW, Uncle Merkle consensus, Lean4-verified ZK opcodes, no premine."
authors = ["Dyne.org foundation <foundation@dyne.org>"]
repository = "https://codeberg.org/darkrenaissance/darkwow"
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "dwow_core"
doctest = false
bench = false

[workspace]
members = [
    "bin/zkas",
    "bin/dwowd",
    "bin/darkwow",
    "crates/dwow-mempool",
    "bin/bridge_test_helper",
    "bin/explorer",
    "bin/dww",
    "bin/fud/fu",
    "bin/fud/fud",
    "bin/genev/genevd",
    "bin/genev/genev-cli",
    "bin/darkirc",
    "bin/tau/taud",
    "bin/tau/tau_pallas",
    #"bin/vanityaddr",  # on hold — needs Promissory Note ContractId architecture decision
    "bin/lilith",
    # Relayer binaries excluded from workspace — all stub code (#![allow(dead_code)]).
    # Re-add when withdrawal execution and slashing are wired.
    # "bin/xmr_relayer",
    # "bin/zcash_relayer",
    # "bin/aztec_relayer",
    # "bin/litecoin_relayer",
    # "bin/universal_relayer",

    "src/sdk",
    "src/sdk/python",

    "src/serial",
    "src/serial/derive",
    "src/serial/derive-internal",

    "src/linear",
    "src/transport",

    "crates/dwow-accounts",

    "src/contract/native_token",
    "src/contract/purse",
    "src/contract/box",
    "src/contract/multisig",
    "src/contract/darktoshi_dice",
    "src/contract/baccarat",
    "src/contract/insurance_market",
    "src/contract/drain_protection",
    "src/contract/entropy",
    "src/contract/escrow",
    "src/contract/dao_escrow",
    "src/contract/lottery",
    "src/contract/betting_stake",
    "src/contract/roulette",
    "src/contract/darkbet_exchange",
    "src/contract/slot",
    "src/contract/identity",
    "src/contract/deployooor",
    "src/contract/dex",
    "src/contract/bridge",
    "src/contract/pool_stake",
    "src/contract/relayer_endowment",
    "src/contract/stablecoin",
    "src/contract/subscription",
    "src/contract/auction",
    "src/contract/attestation",
    "src/contract/oracle",
    "src/contract/otc_swap",
    "src/contract/tender",
    "src/contract/labor_market",
    "src/contract/promissory_note",
    "src/contract/bearer_bond",
    "src/contract/game_room",
    "src/contract/test-harness",

    "example/dchat/dchatd",
]

# Vendored halo2 crates are patch sources (see [patch.crates-io]), not workspace members.
exclude = [
    "vendor/halo2/halo2_proofs",
    "vendor/halo2/halo2_gadgets",
    "vendor/halo2/halo2_poseidon",
]

[dependencies]
# Hard dependencies
libc = "0.2.178"
thiserror = "2.0.17"
tracing = "0.1.44"
parking_lot = "0.12.5"

# async-runtime
async-trait = {version = "0.1.89", optional = true}
futures = {version = "0.3.31", optional = true}
smol = {version = "2.0.2", optional = true}
pin-project-lite = {version = "0.2.16", optional = true}

# Networking
futures-rustls = {version = "0.26.0", default-features = false, features = ["logging", "tls12", "ring"], optional = true}

# Pluggable Transports
socket2 = {version = "0.6.1", features = ["all"], optional = true}
arti-client = {version = "0.37.0", default-features = false, features = ["async-std", "compression", "error_detail", "rustls", "onion-service-client", "onion-service-service"], optional = true}
tor-error = {version = "0.37.0", optional = true}
tor-rtcompat = {version = "0.37.0", features = ["async-std", "rustls"], optional = true}
tor-hscrypto = {version = "0.37.0", optional = true}
tor-hsservice = {version = "0.37.0", optional = true}
tor-proto = {version = "0.37.0", optional = true}
tor-cell = {version = "0.37.0", optional = true}
quinn-smol = {git="https://github.com/parazyd/quinn", rev="6c06de3bee346033e370c41f3a43a831f17d1869", default-features = false, features = ["rustls-ring", "runtime-smol"], optional = true}

# TLS cert utilities
ed25519-compact = {version = "2.2.0", optional = true}
rcgen = {version = "0.14.6", optional = true, features = ["pem"]}
x509-parser = {version = "0.18.0", features = ["validate", "verify"], optional = true}

# UPnP IGD for NAT traversal
oxy-upnp-igd = {version = "0.1", optional = true}

# Encoding
bs58 = {version = "0.5.1", optional = true}
hex = {version = "0.4.3", optional = true}
serde = {version = "1.0.228", features = ["derive"], optional = true}
tinyjson = {version = "2.5.1", optional = true}
httparse = {version = "1.10.1", optional = true}
primitive-types = {version = "0.14.0", optional = true}
semver = {version = "1.0.27", optional = true}
structopt = {version= "0.3.26", optional = true}
structopt-toml = {version= "0.5.1", optional = true}
toml = {version = "0.9.8", optional = true}

# Utilities
dwow-serial = {path = "src/serial", optional = true}


num-bigint = {version = "0.4.6", optional = true}
url = {version = "2.5.7", features = ["serde"], optional = true}

# Misc
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt"], optional = true }
tracing-appender = {version = "0.2.4", optional = true }
nu-ansi-term = {version = "0.50.3", optional = true}

# Crypto
rand = {version = "0.8.5", optional = true}
blake3 = {version = "1.8.2", features = ["rayon"], optional = true}

halo2_proofs = {version = "0.3.2", features = ["circuit-params"], optional = true}
halo2_gadgets = {version = "0.5.0", optional = true}
sha2 = {version = "0.10.9", optional = true}

# Smart contract runtime
dwow-sdk = {path = "src/sdk", optional = true}
wasmer = {version = "6.1.0", features = ["singlepass"], optional = true}
wasmer-compiler-singlepass = {version = "6.1.0", optional = true}
wasmer-compiler-cranelift = {version = "6.1.0", optional = true}
wasmer-middlewares = {version = "6.1.0", optional = true}

# Blockchain store
sled = "0.34"
# QUARANTINED: SledDbOverlay and multi-tree fork diff accumulation MUST NOT be
# used in blockchain execution-layer code — that layer is strictly deterministic.
# Single-tree SledTreeOverlay as an atomic write-buffer (execute_block, genesis
# deployment, event_graph dag_insert) is acceptable and deterministic. The
# quarantine is tree-level (§10.4): the dwowd_dag tree SHALL NOT write to
# blockchain trees, and the blockchain trees SHALL NOT write to the dag tree;
# both co-exist in the same physical sled::Db, using disjoint tree names.
sled-overlay = {version = "0.1.20", optional = true}

# Miner
randomx = {git = "https://codeberg.org/darkrenaissance/RandomX", rev = "0e31d5a", optional = true}
monero = {version = "0.21.0", optional = true}
tiny-keccak = { version = "2.0.2", features = ["keccak"], optional = true }

[dev-dependencies]
clap = {version = "4.4.11", features = ["derive"]}
halo2_proofs = {version = "0.3.2", features = ["circuit-params", "dev-graph", "sanity-checks"]}
halo2_gadgets = {version = "0.5.0", features = ["test-dependencies"]}
plotters = "0.3.7"
easy-parallel = "3.3.1"
prettytable-rs = "0.10.0"
# Used for benchmarks
criterion = {version = "0.8.1", features = ["html_reports"]}
# Needed by top-level integration tests
smol = "2.0.2"
dwow-sdk = {path = "src/sdk"}
dwow-serial = {path = "src/serial"}
rand = "0.8.5"
blake3 = "1.8.2"
async-trait = "0.1.89"
tinyjson = "2.5.1"
url = "2.5.7"
tracing = "0.1.44"
futures = "0.3.31"
futures-rustls = {version = "0.26.0", default-features = false, features = ["logging", "tls12", "ring"]}

# -----BEGIN LIBRARY FEATURES-----
[features]
# Feature gates for P2P bloat — gated, never deleted.
# Hierarchy: net-wallet ⊂ net-node ⊂ net-full
#   net-wallet: P2P for wallets — seed-sync + protocol-seed for hostlist exchange (no BanPolicy)
#   net-node:   net-wallet + refine-session (mining/observer nodes)
#   net-full:   net-node + ban-policy + session-seed
#               + transport plugins (darkirc/tau/lilith — full upstream stack)
protocol-seed = []
seed-sync-session = []
ban-policy = []
session-seed = []
refine-session = []
async-daemonize = ["concurrency"]

async-serial = ["dwow-serial/async"]

async-sdk = [
    "dwow-sdk/async",

    "async-serial",
]

blockchain = [
    "bs58",
    "dwow-serial",

    "tx",
    "util",
]

geode = [
    "blake3",
    "bs58",
    "futures",
    "smol",
]

# P2P messaging DAG (darkirc, evgrd). Uses SledTreeOverlay as an atomic
# write-buffer for event graph operations. The QUARANTINE above clarifies
# which overlay patterns are safe for execution-layer code.
# features — the execution layer must remain deterministic (plain sled only).
event-graph = [
    "blake3",
    "num-bigint",
    "sled-overlay",
    "smol",
    "tinyjson",
    "bs58",

    "dwow-serial",
    "dwow-serial/collections",
    "dwow-serial/hash",

    "net",
]

p2p-nym = []

p2p-tor = [
    "arti-client",
    "tor-hsservice",
    "tor-hscrypto",
    "tor-error",
    "tor-rtcompat",
    "tor-proto",
    "tor-cell",
]

upnp-igd = [
    "oxy-upnp-igd",
]

# Wire protocol types — message + metering. Smallest net dependency.
net-wire = [
    "hex",
    "semver",
    "url",
    "dwow-serial",
]

# Wallet P2P — minimal. No BanPolicy (addr filtering unnecessary for wallets).
# Includes protocol-seed for seed sync and seed-sync-session for handshake.
net-wallet = [
    "net-wire",
    "async-trait",
    "blake3",
    "ed25519-compact",
    "futures",
    "futures-rustls",
    "hex",
    "rcgen",
    "serde",
    "smol",
    "socket2",
    "x509-parser",
    "dwow-serial/url",
    "async-serial",
    "concurrency",
    "util",
    "protocol-seed",
    "seed-sync-session",
]

# Mining/observer P2P — net-wallet + refine session for long-running nodes.
net-node = [
    "net-wallet",
    "refine-session",
]

# Full upstream P2P stack for darkirc/tau/lilith — includes all bloat.
net-full = [
    "net-node",
    "structopt",
    "structopt-toml",
    "async-sdk",
    "protocol-seed",
    "seed-sync-session",
    "ban-policy",
    "session-seed",
    "p2p-tor",
    #"p2p-nym",
    "p2p-i2p",
    "p2p-socks5",
    "p2p-unix",
    "p2p-quic",
]

p2p-unix = []
p2p-socks5 = []
p2p-i2p = ["p2p-socks5"]
p2p-quic = ["quinn-smol"]

net = ["net-wire", "net-wallet", "net-full"]

rpc = [
    "async-trait",
    "httparse",

    "net",
]

concurrency = [
    "futures",
    "pin-project-lite",
    "rand",
    "smol",
]

tx = [
    "blake3",

    "async-sdk",
    "async-serial",
    "zk",
]

util = [
    "tinyjson",
    "tracing-subscriber",
    "tracing-appender",
    "nu-ansi-term",
    "smol",

    "dwow-serial",
]

wasm-runtime = [
    "wasmer",
    "wasmer-compiler-singlepass",
    "wasmer-middlewares",
    "hex",
    "num-bigint",
    "sha2",

    "dwow-sdk/wasm",

    "blockchain",
]

# Opt-in Cranelift compiler for 3-10× faster WASM execution.
# Comes with deeper native stack frames — may require larger thread stacks
# and RUST_MIN_STACK. Use for benchmarking or high-throughput scenarios
# where the stability tradeoff is acceptable.
cranelift-compiler = [
    "wasmer-compiler-cranelift",
]

zk = [
    "halo2_proofs",
    "halo2_gadgets",
    "rand",

    "async-sdk",
    "zkas",
]

zkas = [
    "dwow-serial",
]

dht = [
    "async-sdk",
    "blake3",
    "bs58",
    "futures",
    "num-bigint",
    "serde",
    "smol",

    "dwow-serial",
    "net",
]
# -----END LIBRARY FEATURES-----

[patch.crates-io]
# Vendored halo2 fork, security-pinned (ZCash Orchard fix) — see vendor/halo2/README.md
halo2_proofs = {path = "vendor/halo2/halo2_proofs"}
halo2_gadgets = {path = "vendor/halo2/halo2_gadgets"}
# Forked "url" crate with added P2P schemas
url = {git="https://github.com/darkrenaissance/rust-url", rev="69fa32c0b1af622bf6e5d4aa28b36d1095565a6b"}

[[bench]]
name = "zk_arith"
harness = false
path = "bench/zk_arith.rs"
[[bench]]
name = "zk_from_json"
harness = false
path = "bench/zk_from_json.rs"
[[bench]]
name = "sled"
harness = false
path = "bench/sled.rs"

# Crossbeam SkipMap vs Mutex protected HashMap.
[workspace.lints.clippy]
